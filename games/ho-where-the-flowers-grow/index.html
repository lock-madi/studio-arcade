          { speaker: 'Scooter, the Hermit Snail', text: "Berries? ...There's a patch that only grows down here, where the light doesn't reach." },
          { speaker: 'Scooter, the Hermit Snail', text: "I might remember which way they went. But my old lantern's gone dim — wake it for me, and I'll tell you." },
        ],
        outroLines: [
          { speaker: 'Scooter, the Hermit Snail', text: "...There. Warm again. Alright — they went east, toward the berry patch. Follow the light." },
          { speaker: 'You', text: "Thank you. Really." },
          { speaker: 'Scooter, the Hermit Snail', text: "Go on, before I change my mind." },
        ],
      },
      {
        // the lovebug — met only after the lantern's lit and a short walk further in
        x: 3050, y: GROUND_Y - 24, w: 22, h: 22, kind: 'partner', name: 'Lovebug',
        minigameType: null, special: 'final',
        introLines: FINAL_REUNION_LINES_SRC,
      },
    ],
  },
];

/* =========================================================================
   ZONE LOOKUP — which garden a given world-x falls in, used for the HUD
   label and for blending the ambient palette between neighboring gardens.
   ========================================================================= */
function zoneIndexAt(x) {
  for (let i = 0; i < LEVELS.length; i++) if (x < LEVELS[i].endX) return i;
  return LEVELS.length - 1;
}
function zoneAt(x) { return LEVELS[zoneIndexAt(x)]; }
function isLastZone(zone) { return zone === LEVELS[LEVELS.length - 1]; }

/* =========================================================================
   PALETTE BLENDING — the mood shifts as a gradient across each garden's
   border rather than cutting hard from one to the next.
   ========================================================================= */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
function lerpColor(a, b, t) {
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return rgbToHex(ca.map((v, i) => v + (cb[i] - v) * t));
}
function blendPalette(a, b, t) {
  return {
    skyTop: lerpColor(a.skyTop, b.skyTop, t),
    skyBottom: lerpColor(a.skyBottom, b.skyBottom, t),
    vignette: a.vignette + (b.vignette - a.vignette) * t,
    pollen: t < 0.5 ? a.pollen : b.pollen,
  };
}

// A single crossfade window straddling each zone boundary (not one window
// per zone) — that's what keeps the gradient continuous exactly at the
// crossing point instead of jumping back to a raw color there. Returns the
// two zone indices to mix and how far into the mix x is (from === to, t = 0
// outside any window). Shared by the palette and the parallax background.
const ZONE_BLEND_WIDTH = 500;
function zoneBlendAt(x) {
  const half = ZONE_BLEND_WIDTH / 2;
  for (let i = 0; i < LEVELS.length - 1; i++) {
    const boundary = LEVELS[i].endX; // === LEVELS[i + 1].startX
    if (x >= boundary - half && x <= boundary + half) {
      return { from: i, to: i + 1, t: (x - (boundary - half)) / ZONE_BLEND_WIDTH };
    }
  }
  const i = zoneIndexAt(x);
  return { from: i, to: i, t: 0 };
}
function paletteAt(x) {
  const { from, to, t } = zoneBlendAt(x);
  return from === to ? LEVELS[from].palette : blendPalette(LEVELS[from].palette, LEVELS[to].palette, t);
}

/* =========================================================================
   WORLD ASSEMBLY — stitches all three gardens end-to-end into one
   continuous world (rebuilt from scratch on first load, on New Game and after the ending)
   ========================================================================= */
function buildPollen(offsetX, width) {
  const arr = [];
  for (let i = 0; i < 40; i++) {
    arr.push({
      x: offsetX + Math.random() * width, y: Math.random() * LEVEL_HEIGHT,
      speed: 10 + Math.random() * 18, size: 1.5 + Math.random() * 2,
      drift: Math.random() * Math.PI * 2,
    });
  }
  return arr;
}

// Fits the tiled ground to whole 32px tiles, so every run of ground ends in
// a full tile and its end cap (no cut-short tile seam):
// - strips that touch end to end (some are authored as several pieces, and
//   zones butt together) are merged into one, so no end caps appear in the
//   middle of solid ground;
// - each run is then widened to whole tiles, left edge kept. Rounded up,
//   never down: gaps only ever get a little narrower, so no jump gets longer
//   than it was designed to be.
function fitGroundToTiles(list) {
  const tiled = list.filter(p => !p.isDrifter && !p.isGate).sort((a, b) => a.y - b.y || a.x - b.x);
  const runs = [];
  for (const p of tiled) {
    const last = runs[runs.length - 1];
    if (last && last.y === p.y && last.h === p.h && p.x <= last.x + last.w) {
      last.w = Math.max(last.x + last.w, p.x + p.w) - last.x;
    } else {
      runs.push({ ...p });
    }
  }
  for (const r of runs) r.w = Math.max(2 * GROUND_TILE, Math.ceil(r.w / GROUND_TILE) * GROUND_TILE);
  return [...runs, ...list.filter(p => p.isDrifter || p.isGate)];
}

function buildWorld() {
  platforms = []; clovers = []; petals = []; stompHazards = [];
  loreSpots = []; decor = []; pollenParticles = []; npcs = [];
  buildAmbient();

  let xOffset = 0;
  for (const z of LEVELS) {
    z.startX = xOffset;
    z.endX = xOffset + z.width;

    const zonePlatforms = z.buildPlatforms().map(p => ({ ...p, x: p.x + xOffset }));
    const zoneDrifters = z.buildDrifters().map(d => ({ ...d, x: d.x + xOffset, baseX: d.baseX + xOffset }));
    platforms.push(...zonePlatforms, ...zoneDrifters);

    clovers.push(...z.buildClovers().map(c => ({ ...c, x: c.x + xOffset, r: CLOVER_PICKUP_R, collected: false })));
    petals.push(...z.buildPetals().map(p => ({ ...p, x: p.x + xOffset, collected: false })));
    stompHazards.push(...z.buildStomps().map(h => ({ ...h, x: h.x + xOffset })));
    loreSpots.push(...z.buildLore().map(l => ({ ...l, x: l.x + xOffset, collected: false })));
    decor.push(...z.buildDecor().map(d => ({ ...d, x: d.x + xOffset })));
    if (z.palette.pollen) pollenParticles.push(...buildPollen(xOffset, z.width));

    for (const zNpc of z.npcs) {
      const npc = { ...zNpc, x: zNpc.x + xOffset, resolved: false, talkedTo: false };
      if (npc.special === 'carry') {
        npc.carryTarget = { x: zNpc.carryTarget.x + xOffset, y: zNpc.carryTarget.y };
        npc.homeX = npc.x; npc.homeY = npc.y; // where it flies back to afterwards
      }
      if (npc.hasGate) {
        // Taller than the player's max jump apex (~152px) with a healthy
        // margin, so the gate can't just be hopped over from flat ground.
        npc.gateBars = [
          { x: npc.x + 40, y: GROUND_Y - 260, w: 14, h: 260, color: '#5a4a2a', isGate: true },
          { x: npc.x + 80, y: GROUND_Y - 260, w: 14, h: 260, color: '#5a4a2a', isGate: true },
        ];
        platforms.push(...npc.gateBars);
      }
      npcs.push(npc);
    }

    xOffset += z.width;
  }

  worldWidth = xOffset;
  platforms = fitGroundToTiles(platforms);

  // Nothing floats: keep a decor piece only if its whole width rests on one
  // solid ground platform (top at GROUND_Y), not over a gap or chasm edge.
  const groundSegs = platforms.filter(p => p.y === GROUND_Y && !p.isDrifter && !p.isGate);
  decor = decor.filter(d => {
    const half = (DECOR_NATIVE_W[d.type] || 0) * decorScale(d.type) / 2;
    return groundSegs.some(g => d.x - half >= g.x && d.x + half <= g.x + g.w);
  });

  drifters = platforms.filter(p => p.isDrifter);
  clovers.forEach(c => { c.r = CLOVER_PICKUP_R; c.collected = false; });
  cloverCount = 0;
  petals.forEach(p => { p.collected = false; });
  petalsFound = 0;
  collectedClues = [];

  player.x = spawnDefault.x;
  player.y = spawnDefault.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.standingOn = null;
  player.facing = 1;
  player.coyoteTimer = 0; player.jumpBufferTimer = 0;
  player.graceTimer = 0;
  hidingIn = null;

  checkpointX = player.x;
  checkpointY = player.y;

  cameraX = Math.max(0, Math.min(worldWidth - CW, player.x + player.w / 2 - CW / 2));
  cameraY = Math.max(0, Math.min(LEVEL_HEIGHT - CH, player.y + player.h / 2 - CH / 2));

  dialogue = null; carry = null; activeMinigame = null; activeNpc = null;
  lantern = null; cards = null;

  gameState = STATE.PLAYING;
}

/* =========================================================================
   STATE LOGIC — respawning after a hazard, and the one true restart
   ========================================================================= */
// The checkpoint rolls with every grounded frame, so it's usually right
// where the hazard caught you — and hazards freeze mid-attack on the game
// over screen. Without a grace period, restarting dropped the player
// straight back into a bird still mid-swoop, re-dying instantly, forever.
// 1.5s outlasts the rest of any attack in progress; a fresh swoop still
// gives its full warning first.
const RESPAWN_GRACE_S = 1.5;

function respawnAtCheckpoint() {
  player.x = checkpointX;
  player.y = checkpointY;
  player.vx = 0; player.vy = 0;
  player.standingOn = null;
  player.graceTimer = RESPAWN_GRACE_S;
  hidingIn = null;
  if (gameState === STATE.GAME_OVER) { gameOverLeftAt = performance.now() / 1000; sfx.retry(); } // ...and eases back out
  gameState = STATE.PLAYING;
}

function handlePrimaryAction() {
  if (gameState === STATE.GAME_OVER) respawnAtCheckpoint();
}

/* =========================================================================
   DIALOGUE (story text boxes, typed out as the bug talks)
   ========================================================================= */
const TYPE_MS_PER_CHAR = 28;
// dialogue: { lines: [{speaker,text}], lineIndex, charIndex, charTimer, lineDone, onComplete }

let dialogueShadeStartedAt = 0;
let dialogueClosedAt = -Infinity;

function startDialogue(lines, onComplete) {
  // A dialogue that picks up straight after another (e.g. an NPC's intro
  // flowing into their outro) keeps the screen shaded instead of re-fading.
  const now = performance.now();
  if (now - dialogueClosedAt > 100) dialogueShadeStartedAt = now;
  dialogue = {
    lines, lineIndex: 0, charIndex: 0, charTimer: 0,
    lineDone: lines[0].text.length === 0,
    onComplete: onComplete || null,
  };
  gameState = STATE.DIALOGUE;
}

function updateDialogue(dt) {
  if (!dialogue) return;
  const line = dialogue.lines[dialogue.lineIndex];

  if (!dialogue.lineDone) {
    dialogue.charTimer += dt * 1000;
    while (dialogue.charTimer >= TYPE_MS_PER_CHAR && dialogue.charIndex < line.text.length) {
      dialogue.charTimer -= TYPE_MS_PER_CHAR;
      sfx.talk(line.speaker, line.text[dialogue.charIndex]); // the speaker's voice, blip by blip
      dialogue.charIndex++;
    }
    if (dialogue.charIndex >= line.text.length) dialogue.lineDone = true;
  }

  if (!anyJustPressed(KEY_INTERACT)) return;

  if (!dialogue.lineDone) {
    dialogue.charIndex = line.text.length;
    dialogue.lineDone = true;
    return;
  }

  sfx.tick();
  dialogue.lineIndex++;
  if (dialogue.lineIndex >= dialogue.lines.length) {
    const onComplete = dialogue.onComplete;
    dialogue = null;
    dialogueClosedAt = performance.now();
    if (gameState === STATE.DIALOGUE) gameState = STATE.PLAYING;
    if (onComplete) onComplete();
  } else {
    dialogue.charIndex = 0;
    dialogue.charTimer = 0;
    dialogue.lineDone = dialogue.lines[dialogue.lineIndex].text.length === 0;
  }
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxWidth) {
      ctx.fillText(line, x, yy);
      line = word;
      yy += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}

/* Dialogue layout, measured off the 800x450 dialogue mockup (same size as the
   canvas, so these are canvas px): a translucent navy band along the bottom,
   the speaker's sprite as a large portrait sitting on its top edge, and the
   name + line in lime Pixelta beside it, while the screen edges
   darken to navy. Everything hangs off the box top, so the one line long
   enough to wrap to 3 rows grows the box upward and carries the rest along. */
const DIALOGUE_LAYOUT = {
  boxX: 40, boxW: 720, boxBottom: 428, baseBoxH: 96, baseRows: 2,
  textX: 160, textMaxW: 576, rowH: 26,
  nameBaseline: 25, bodyBaseline: 60,          // from the box top
  nameSize: 18, bodySize: 22, letterSpacing: '1.5px',
  portraitX: 31, portraitTop: -105, portraitSize: 160, // 64px sprites at 2.5x
  shadeFadeMs: 250,
};

// Who's drawn beside a line. The bee and butterfly art face left, so they're
// flipped so every portrait faces the text. '???' is the lovebug.
function dialoguePortrait(speaker) {
  switch (speaker) {
    case 'You': return { sprite: currentPlayerIdleSprite(), flip: false };
    case '???': return { sprite: currentPartnerSprite(), flip: false };
    case 'Duchess, the Queen Bee': return { sprite: currentBeeSprite(), flip: true };
    case 'Flutter, the Wandering Butterfly': return { sprite: currentButterflySprite(), flip: true };
    case 'Scooter, the Hermit Snail': return { sprite: currentSnailSprite(), flip: false };
    default: return null;
  }
}

function countWrappedRows(text, maxWidth) {
  let line = '', rows = 1;
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxWidth) { rows++; line = word; } else line = test;
  }
  return rows;
}

// The navy edge-darkening from the mockup: four soft linear fades, heaviest
// down the left side behind the portrait, stacked so they compound in the
// corners the way the mockup's do.
function drawDialogueShade(strength) {
  const rgb = THEME.dialogue.shadeRGB;
  const fade = (x0, y0, x1, y1, a0, a1) => {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a0 * strength})`);
    g.addColorStop(1, `rgba(${rgb},${a1 * strength})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);
  };
  fade(0, 0, 440, 0, 1, 0);        // left
  fade(670, 0, CW, 0, 0, 0.97);    // right
  fade(0, 0, 0, 110, 0.9, 0);      // top
  fade(0, 330, 0, CH, 0, 0.9);     // bottom
}

function renderDialogue() {
  const L = DIALOGUE_LAYOUT;
  const line = dialogue.lines[dialogue.lineIndex];
  const shown = line.text.slice(0, dialogue.charIndex);

  drawDialogueShade(Math.min(1, (performance.now() - dialogueShadeStartedAt) / L.shadeFadeMs));

  ctx.save();
  ctx.letterSpacing = L.letterSpacing;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // size the box from the whole line, not the typed-so-far part, so it
  // never grows mid-sentence
  ctx.font = `${L.bodySize}px ${FONT_BODY}`;
  const rows = countWrappedRows(line.text, L.textMaxW);
  const boxH = L.baseBoxH + Math.max(0, rows - L.baseRows) * L.rowH;
  const boxTop = L.boxBottom - boxH;

  ctx.fillStyle = `rgba(${THEME.dialogue.boxRGB},${THEME.dialogue.boxAlpha})`;
  ctx.fillRect(L.boxX, boxTop, L.boxW, boxH);

  const portrait = dialoguePortrait(line.speaker);
  if (portrait && portrait.sprite.complete && portrait.sprite.naturalWidth > 0) {
    const px = L.portraitX, py = boxTop + L.portraitTop, s = L.portraitSize;
    if (portrait.flip) {
      ctx.save();
      ctx.translate(px + s, py);
      ctx.scale(-1, 1);
      ctx.drawImage(portrait.sprite, 0, 0, s, s);
      ctx.restore();
    } else {
      ctx.drawImage(portrait.sprite, px, py, s, s);
    }
  }

  ctx.fillStyle = THEME.dialogue.text;
  ctx.font = `${L.nameSize}px ${FONT_BODY}`;
  ctx.fillText(line.speaker, L.textX, boxTop + L.nameBaseline);
  ctx.font = `${L.bodySize}px ${FONT_BODY}`;
  wrapText(shown, L.textX, boxTop + L.bodyBaseline, L.textMaxW, L.rowH);

  // a small blinking "continue" arrow tucked into the box's bottom-right
  // corner, clear of the text column
  if (dialogue.lineDone) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 250);
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('▶', L.boxX + L.boxW - 8, L.boxBottom - 10);
  }
  ctx.restore();
}

/* =========================================================================
   NPC ENCOUNTER FLOW — shared across all three gardens; each NPC's data
   supplies its own lines, optional minigame, and any special follow-up.

   Duchess, the Queen Bee, is a special case (npc.isQuestGiver): talking to her
   never starts a minigame or resolves her directly — her task is a small
   journey (find the three petals scattered through the greenhouse), and
   petal collection resolves her asynchronously, wherever the player
   happens to be when the last one is found. See tryOpenGate().
   ========================================================================= */
function startNpcEncounter(npc) {
  activeNpc = npc;

  if (npc.isQuestGiver) {
    const firstTalk = !npc.talkedTo;
    startDialogue(firstTalk ? npc.introLines : npc.reminderLines, () => {
      activeNpc = null;
      if (!firstTalk) return;
      // The petals only exist once she's asked for them: marking her
      // talked-to here (at the end of her intro, not the start) is what
      // makes them pop into the greenhouse.
      npc.talkedTo = true;
      petalsRevealedAt = performance.now();
      saveGame();
    });
    return;
  }

  // The reunion is the outro cutscene, which ends the game: it stays on "The
  // End" with a "[ play again ]" button, which starts a fresh run. The
  // conversation it replaced is still here in case the cutscene can't load
  // (that way ends back on the title, see finishNpc).
  if (npc.special === 'final') {
    playCutscene('outro', { found: cloverCount, total: clovers.length },
      () => { activeNpc = null; startNewGame(); },
      () => startDialogue([...npc.introLines, ...cloverGiftLines()], resolveNpc),
      { endButton: 'play again' });
    return;
  }
  startDialogue(npc.introLines, () => {
    if (npc.minigameType) startLevelMinigame();
    else resolveNpc(); // no task — the conversation itself was the point
  });
}

function startLevelMinigame() {
  const type = activeNpc.minigameType;
  if (type === 'lantern') startLanternGame(resolveNpc);
  else if (type === 'cards') startCardsGame(resolveNpc);
}

// Only the very last NPC (the lovebug) ends the game (see finishNpc).
// Everyone else just resolves their bargain and lets the player keep
// walking — no "level complete" interruption, so the journey stays one
// continuous thing rather than a series of discrete stages.
function resolveNpc() {
  const npc = activeNpc;
  npc.resolved = true;
  npc.resolvedAt = performance.now(); // e.g. drives the darkness lifting once the snail's lantern is lit
  saveGame();
  if (npc.outroLines) {
    startDialogue(npc.outroLines, () => finishNpc(npc));
  } else {
    finishNpc(npc);
  }
}

function finishNpc(npc) {
  if (npc.hasGate) platforms = platforms.filter(p => !p.isGate);
  if (npc.special === 'carry') startButterflyCarry(npc);
  else if (npc.special === 'final') {
    // the story's finished, by the reunion conversation (only played if the
    // outro cutscene can't load, which has its own "[ play again ]"): nothing
    // to continue into, so it's back to the title, the garden reset
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    buildWorld();
    gameState = STATE.TITLE;
    showTitleScreen();
  }
  activeNpc = null;
}

// The petals don't appear (can't be seen or collected) until the Queen has
// finished asking for them.
function isPetalQuestActive() {
  const bee = npcs.find(n => n.isQuestGiver);
  return !!bee && bee.talkedTo;
}

// Checked whenever a petal is collected — opens the Queen's gate and lets
// her acknowledge it the moment the task is actually complete, wherever
// the player happens to be when the last petal is found.
function tryOpenGate() {
  if (petalsFound < petals.length) return;
  const bee = npcs.find(n => n.isQuestGiver);
  if (!bee || bee.resolved) return;
  bee.resolved = true;
  platforms = platforms.filter(p => !p.isGate);
  sfx.fanfare(); // the gate opens
  startDialogue(bee.gateOpenLines, null);
  saveGame();
}

/* The butterfly carrying the ladybug over the chasm, in phases:
   - pickup: it flutters over from its spot to just above her;
   - fly:    it lifts her and carries her across in a gentle arc (easing in
             and out), with a little side-to-side sway;
   - drop:   it sets her down and lets go, rising a touch;
   then the two say thank you (the npc's thanksLines), and
   - return: it flies home in an arc while she's free to walk on.
   The ladybug can't move until she's been set down. The butterfly is moved
   by moving its npc box, which drawButterfly already follows. */
const CARRY_PICKUP_S = 0.7, CARRY_FLY_S = 2.6, CARRY_DROP_S = 0.5, CARRY_RETURN_S = 1.8;
const CARRY_ARC = 140;   // how high above the straight line the flight bows
const CARRY_GRIP = 6;    // px the butterfly's box overlaps the ladybug's top, so it looks like it's holding on
let carry = null;

const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);

// where the butterfly's box goes to be holding the ladybug
function carrierHoldPos(npc) {
  return { x: player.x + player.w / 2 - npc.w / 2, y: player.y - npc.h + CARRY_GRIP };
}

function startButterflyCarry(npc) {
  carry = {
    npc, phase: 'pickup', t: 0,
    fromX: npc.x, fromY: npc.y,                         // butterfly's start, for the pickup
    liftX: player.x, liftY: player.y,                   // ladybug's start, for the flight
    toX: npc.carryTarget.x, toY: npc.carryTarget.y,
  };
  player.vx = 0; player.vy = 0;
  gameState = STATE.PLAYING;
}

// true while the ladybug is being carried (she can't move herself)
function isCarryHoldingPlayer() {
  return !!carry && carry.phase !== 'return';
}

function updateCarry(dt) {
  const c = carry, npc = c.npc;
  c.t += dt;
  if (c.phase === 'pickup') {
    const s = easeInOut(Math.min(1, c.t / CARRY_PICKUP_S));
    const hold = carrierHoldPos(npc);
    npc.x = c.fromX + (hold.x - c.fromX) * s;
    npc.y = c.fromY + (hold.y - c.fromY) * s - Math.sin(Math.PI * s) * 30;
    player.vx = 0; player.vy = 0;
    if (c.t >= CARRY_PICKUP_S) Object.assign(c, { phase: 'fly', t: 0 });
  } else if (c.phase === 'fly') {
    const raw = Math.min(1, c.t / CARRY_FLY_S), s = easeInOut(raw);
    player.x = c.liftX + (c.toX - c.liftX) * s + Math.sin(raw * Math.PI * 3) * 6 * Math.sin(Math.PI * raw);
    player.y = c.liftY + (c.toY - c.liftY) * s - Math.sin(Math.PI * s) * CARRY_ARC;
    player.vx = 0; player.vy = 0; player.onGround = false; player.standingOn = null;
    const hold = carrierHoldPos(npc);
    npc.x = hold.x; npc.y = hold.y;
    if (raw >= 1) Object.assign(c, { phase: 'drop', t: 0, fromX: npc.x, fromY: npc.y });
  } else if (c.phase === 'drop') {
    const s = easeInOut(Math.min(1, c.t / CARRY_DROP_S));
    npc.y = c.fromY - 26 * s; // lets go and lifts away a little
    if (c.t >= CARRY_DROP_S) {
      Object.assign(c, { phase: 'thanks', t: 0, fromX: npc.x, fromY: npc.y });
      startDialogue(npc.thanksLines, () => { if (carry) Object.assign(carry, { phase: 'return', t: 0 }); });
    }
  } else if (c.phase === 'return') {
    const s = easeInOut(Math.min(1, c.t / CARRY_RETURN_S));
    npc.x = c.fromX + (npc.homeX - c.fromX) * s;
    npc.y = c.fromY + (npc.homeY - c.fromY) * s - Math.sin(Math.PI * s) * 90;
    if (c.t >= CARRY_RETURN_S) { npc.x = npc.homeX; npc.y = npc.homeY; carry = null; }
  }
}

/* =========================================================================
   MINIGAME 1 — Awaken the Lantern-Bug (color memory, Level 3's snail).
   The lantern flashes a sequence of colors; the player repeats it on six
   swatches (click, or keys 1-6). Three rounds, the sequence one color
   longer each time (3, 4, 5). Each round the lantern starts dim and every
   correct step makes it burn brighter; a mistake gutters it and the same
   sequence plays again. The flame flickers throughout.

   Layout from the lantern mockups (744x418, scaled to the 800x450 canvas):
   the dialogue's navy edge-shade over the scene with a warm glow spilling
   from a giant lantern cropped off the right edge, a lime title, an
   orange-dashed panel holding the small lantern, and the six swatches.
   Both lanterns are the same art (see drawLantern), at two sizes.
   ========================================================================= */
const LANTERN_SWATCHES = ['#ab2330', '#eb9361', '#b5de89', '#a2dceb', '#735bab', '#ee8fbf'];
const LANTERN_LAYOUT = {
  panel: { x: 56, y: 110, w: 292, h: 220 }, border: 6, dash: 6, dashPeriod: 15,
  borderColor: '#eb9361',
  swatch: (i) => ({ x: 56 + i * 51, y: 347, w: 36, h: 36 }),
  // top-left of each lantern's 64x64 art and its px per art pixel, from the
  // mockups: the small one centred in the panel; the giant one with its dome
  // at the top edge, feet near the bottom, and its right side cropped off
  small: { x: 90, y: 106, S: 3.5 },
  big: { x: 292, y: -290, S: 13.5 },
  spill: { x: 600, y: 260 }, // where the giant lantern's light spreads from
  // The how-to-play card shown before round 1, from the "LIGHT GAME 2"
  // mockup in Figma. That frame is 744x418, so every number here is its
  // position there scaled by 800/744 to the game's 800x450 screen.
  intro: {
    panel: { x: 206.7, y: 116.1, w: 386.6, h: 217.2 }, // see-through black, orange dashed ring on its edge
    ring: 7.5,                                         // the ring's thickness and dash length
    titleY: 85.9,                                      // "Awaken the Lantern-Bug", centred over the panel
    text: { x: 285.6, y: 171.4, w: 229, lineH: 18.5 }, // the two paragraphs, a blank line between them
    snail: { x: 105.5, y: 219.3, size: 147.3 },        // Scooter the Hermit Snail, overlapping the panel's left edge
    button: { x: 312.5, y: 357, w: 178.5, h: 46 },     // "[ begin ]"
  },
  titleX: 75, titleY: 88, statusY: 432,
};
const LANTERN_ROUNDS = 3;
const LANTERN_FIRST_LENGTH = 3;
const LANTERN_FLASH_S = 0.56, LANTERN_GAP_S = 0.22, LANTERN_LEAD_S = 0.7;
const LANTERN_DIM = 0.06; // how much it glows at the start of a round
const LANTERN_INTRO_LOCK_S = 0.35; // ignore input briefly so the key that opened the game doesn't skip the intro
const LANTERN_INTRO_TEXT = [
  'The Lantern-Bug has dozed off, and its lantern has gone dark.',
  'Watch the lantern flash a string of colors, then repeat them in order by clicking the swatches (or pressing keys 1-6).',
];

function randomLanternColor(avoid) {
  let c;
  do { c = Math.floor(Math.random() * LANTERN_SWATCHES.length); } while (c === avoid);
  return c;
}

function startLanternGame(onWin) {
  gameState = STATE.MINIGAME;
  activeMinigame = 'lantern';
  lantern = {
    sequence: [], roundsDone: 0, step: 0,
    // opens on the how-to-play card; round 1 starts once the player is ready
    phase: 'intro', showIndex: -1, showOn: false, phaseTimer: LANTERN_INTRO_LOCK_S,
    bright: LANTERN_DIM, shown: LANTERN_DIM,
    tint: null, tintTimer: 0, flashSwatch: -1,
    status: '', onWin: onWin || null,
  };
  extendLanternSequence();
}

function leaveLanternIntro() {
  if (lantern.phase === 'intro' && lantern.phaseTimer <= 0) { sfx.click(); beginLanternShowing(); }
}

// Simon-style: each round keeps the previous sequence and adds to it.
function extendLanternSequence() {
  const L = lantern;
  while (L.sequence.length < LANTERN_FIRST_LENGTH + L.roundsDone) {
    L.sequence.push(randomLanternColor(L.sequence[L.sequence.length - 1]));
  }
}

function beginLanternShowing() {
  const L = lantern;
  Object.assign(L, { phase: 'showing', showIndex: -1, showOn: false, phaseTimer: LANTERN_LEAD_S, step: 0,
    bright: LANTERN_DIM, flashSwatch: -1,
    status: `Round ${L.roundsDone + 1} of ${LANTERN_ROUNDS} — watch the lantern…` });
}

function lanternPress(i) {
  const L = lantern;
  if (!L || L.phase !== 'input') return;
  L.tint = LANTERN_SWATCHES[i]; L.tintTimer = 0.38; L.flashSwatch = i;
  if (i === L.sequence[L.step]) {
    sfx.lanternNote(i);
    L.step++;
    L.bright = 0.1 + 0.9 * (L.step / L.sequence.length);
    if (L.step === L.sequence.length) {
      Object.assign(L, { phase: 'success', phaseTimer: 1.4, status: 'The lantern blazes!' });
      sfx.roundWon();
    } else {
      L.status = `${L.step} of ${L.sequence.length}…`;
    }
  } else {
    sfx.fizzle();
    Object.assign(L, { phase: 'fail', phaseTimer: 1.1, bright: 0, status: 'The flame gutters — watch again.' });
  }
}

function updateLanternGame(dt) {
  const L = lantern;
  L.shown += (L.bright - L.shown) * Math.min(1, dt * 5); // brightness swells rather than jumping
  if (L.tintTimer > 0) {
    L.tintTimer -= dt;
    if (L.tintTimer <= 0) { L.tint = null; if (L.phase !== 'showing') L.flashSwatch = -1; }
  }

  if (L.phase === 'intro') {
    L.phaseTimer -= dt;
    if (anyJustPressed([...KEY_INTERACT, 'Enter', 'Space', ' '])) leaveLanternIntro();
    return;
  }

  if (L.phase === 'input') {
    for (let i = 0; i < LANTERN_SWATCHES.length; i++) {
      if (anyJustPressed([`Digit${i + 1}`, `Numpad${i + 1}`, String(i + 1)])) { lanternPress(i); break; }
    }
    return;
  }

  L.phaseTimer -= dt;
  if (L.phaseTimer > 0) return;

  if (L.phase === 'showing') {
    // alternate: flash a color, then a short dark gap, until the sequence is done
    if (L.showOn) {
      Object.assign(L, { showOn: false, flashSwatch: -1, tint: null, bright: LANTERN_DIM, phaseTimer: LANTERN_GAP_S });
    } else if (L.showIndex + 1 < L.sequence.length) {
      L.showIndex++;
      const c = L.sequence[L.showIndex];
      Object.assign(L, { showOn: true, flashSwatch: c, tint: LANTERN_SWATCHES[c], tintTimer: LANTERN_FLASH_S, bright: 0.7, phaseTimer: LANTERN_FLASH_S });
      sfx.lanternNote(c); // each colour sings its own note, so the sequence can be heard as well as seen
    } else {
      Object.assign(L, { phase: 'input', step: 0, status: `Your turn — repeat all ${L.sequence.length} colors.` });
    }
  } else if (L.phase === 'fail') {
    beginLanternShowing();
  } else if (L.phase === 'success') {
    L.roundsDone++;
    if (L.roundsDone >= LANTERN_ROUNDS) {
      Object.assign(L, { phase: 'won', phaseTimer: 1.6, bright: 1, status: 'The Lantern-Bug wakes!' });
      sfx.fanfare();
    } else {
      extendLanternSequence();
      beginLanternShowing();
    }
  } else if (L.phase === 'won') {
    const onWin = L.onWin;
    activeMinigame = null; lantern = null;
    gameState = STATE.PLAYING;
    if (onWin) onWin();
  }
}

function handleLanternClick(mx, my) {
  if (lantern.phase === 'intro') { leaveLanternIntro(); return; }
  for (let i = 0; i < LANTERN_SWATCHES.length; i++) {
    const r = LANTERN_LAYOUT.swatch(i);
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) { lanternPress(i); return; }
  }
}

// Layered sines plus a touch of per-frame jitter, around 1.
function lanternFlicker(t) {
  return 1 + 0.09 * Math.sin(t * 12.7) + 0.06 * Math.sin(t * 23.3 + 1.7) + 0.04 * (Math.random() - 0.5);
}

/* The lantern art: the unlit lantern body plus three flame layers (spark,
   small flame, big flame), each just the pixels that change from unlit, cut
   from the four-frame lighting-up GIF on its 64x64 grid. Stacked, body +
   flame reproduces each GIF frame exactly; keeping the flame separate lets
   it flicker on its own (a sway and pulse about its wick) and take on the
   color being flashed. */
const lanternImage = src => Object.assign(new Image(), { src });
const LANTERN_BODY = lanternImage('assets/minigame/lantern-unlit.png');
const LANTERN_FLAMES = [null, // stage 0: unlit
  lanternImage('assets/minigame/lantern-flame-1.png'),
  lanternImage('assets/minigame/lantern-flame-2.png'),
  lanternImage('assets/minigame/lantern-flame-3.png'),
];
const LANTERN_WICK = { x: 32, y: 50 };        // art px the flame grows up from
const LANTERN_FLAME_GLOW = { x: 32, y: 43 };  // art px the glow centres on
const LANTERN_TINT_ALPHA = 0.75;              // how strongly a flashed color takes over the flame

// Which drawn stage a brightness shows. The glow stays continuous; the flame
// art steps through spark -> small -> big as it wakes.
function lanternStage(b) {
  return b < 0.08 ? 0 : b < 0.35 ? 1 : b < 0.72 ? 2 : 3;
}

// Flame layers recolored toward a flashed color, made once per stage/color.
const tintedFlameCache = new Map();
function lanternFlameImage(stage, tint) {
  const base = LANTERN_FLAMES[stage];
  if (!tint) return base;
  const key = `${stage}${tint}`;
  if (!tintedFlameCache.has(key)) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    x.drawImage(base, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.globalAlpha = LANTERN_TINT_ALPHA;
    x.fillStyle = tint;
    x.fillRect(0, 0, 64, 64);
    tintedFlameCache.set(key, c);
  }
  return tintedFlameCache.get(key);
}

// One lantern with its top-left at (ox, oy), each art pixel `S` px: a warm
// glow behind the see-through cage, the body, then the flickering flame.
function drawLantern(ox, oy, S, b, f, tint) {
  const gx = ox + LANTERN_FLAME_GLOW.x * S, gy = oy + LANTERN_FLAME_GLOW.y * S;
  const glowR = 16 * S * (0.5 + 0.5 * b);
  const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, glowR);
  glow.addColorStop(0, `rgba(255,236,170,${Math.min(1, (0.15 + 0.75 * b) * f)})`);
  glow.addColorStop(1, 'rgba(255,215,135,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(gx - glowR, gy - glowR, glowR * 2, glowR * 2);

  if (LANTERN_BODY.complete && LANTERN_BODY.naturalWidth > 0) ctx.drawImage(LANTERN_BODY, ox, oy, 64 * S, 64 * S);

  const stage = lanternStage(b);
  const flame = stage > 0 && LANTERN_FLAMES[stage].complete ? lanternFlameImage(stage, tint) : null;
  if (flame) {
    ctx.save();
    ctx.translate(ox + LANTERN_WICK.x * S, oy + LANTERN_WICK.y * S);
    ctx.scale(S * (1 + (f - 1) * 0.5), S * f); // taller/shorter with the flicker, a little wider/narrower
    ctx.drawImage(flame, -LANTERN_WICK.x, -LANTERN_WICK.y, 64, 64);
    ctx.restore();
  }
}

// The panel's orange dashed border around rect `p`.
// the orange dashed ring, just inside p; thickness, dash length and spacing
// default to the game panel's
function drawLanternDashedRing(p, bw = LANTERN_LAYOUT.border, dash = LANTERN_LAYOUT.dash, period = LANTERN_LAYOUT.dashPeriod) {
  const LL = LANTERN_LAYOUT;
  ctx.fillStyle = LL.borderColor;
  const dashes = (x, y, len, horiz) => {
    const n = Math.max(1, Math.round((len - dash) / period)), step = (len - dash) / n;
    for (let k = 0; k <= n; k++) {
      const at = Math.round(k * step);
      if (horiz) ctx.fillRect(x + at, y, dash, bw); else ctx.fillRect(x, y + at, bw, dash);
    }
  };
  dashes(p.x, p.y, p.w, true); dashes(p.x, p.y + p.h - bw, p.w, true);
  dashes(p.x, p.y, p.h, false); dashes(p.x + p.w - bw, p.y, p.h, false);
}

// The how-to-play card, as in the "LIGHT GAME 2" mockup: the title over a
// see-through panel with an orange dashed ring, the rules in Pixelta, the
// Scooter the Hermit Snail peeking over the panel's left edge, and a "[ begin ]" button.
// (Any click or E starts the game, once the short input lock is over; the
// button just shows how.)
function renderLanternIntro(t) {
  const c = LANTERN_LAYOUT.intro, p = c.panel, r = c.ring;
  ctx.save();
  ctx.letterSpacing = '0px'; // the mockup's text is set with no extra spacing

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  drawLanternDashedRing({ x: p.x - r / 2, y: p.y - r / 2, w: p.w + r, h: p.h + r }, r, r, r * 2); // the ring sits centred on the panel's edge

  ctx.fillStyle = THEME.dialogue.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `26px 'Venice Classic', ${FONT_BODY}`;
  ctx.fillText('Awaken the Lantern-Bug', p.x + p.w / 2, c.titleY);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = `16px ${FONT_BODY}`;
  let y = c.text.y;
  for (const para of LANTERN_INTRO_TEXT) y = wrapText(para, c.text.x, y, c.text.w, c.text.lineH) + c.text.lineH * 2;

  const snail = currentSnailSprite();
  if (snail.complete && snail.naturalWidth > 0) ctx.drawImage(snail, c.snail.x, c.snail.y, c.snail.size, c.snail.size);

  const b = c.button;
  ctx.globalAlpha = lantern.phaseTimer > 0 ? 0.5 : 1; // dimmed for the brief moment it can't be pressed yet
  ctx.fillStyle = '#8e8e8e';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = THEME.dialogue.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `16px 'Venice Classic', ${FONT_BODY}`;
  ctx.fillText('[ begin ]', b.x + b.w / 2, b.y + b.h / 2 + 2);
  ctx.restore();
}

function renderLanternGame() {
  const L = lantern, LL = LANTERN_LAYOUT, t = performance.now() / 1000;
  const b = L.shown, f = lanternFlicker(t), tint = L.tint;

  // backdrop: the big lantern's light spilling across the scene (stronger as
  // it wakes), under the dialogue's navy edge-shade
  // (the how-to-play card has its mockup's soft light instead, and no big lantern yet)
  if (L.phase === 'intro') { drawMinigameLight(); renderLanternIntro(t); return; }
  const glow = ctx.createRadialGradient(LL.spill.x, LL.spill.y, 20, LL.spill.x, LL.spill.y, 520);
  glow.addColorStop(0, `rgba(255,243,196,${Math.min(1, (0.2 + 0.75 * b) * f)})`);
  glow.addColorStop(0.45, `rgba(255,215,135,${(0.08 + 0.35 * b) * f})`);
  glow.addColorStop(1, 'rgba(255,215,135,0)');
  ctx.fillStyle = `rgba(${THEME.dialogue.shadeRGB},0.55)`;
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CW, CH);
  drawDialogueShade(1);

  drawLantern(LL.big.x, LL.big.y, LL.big.S, b, f, tint);

  // panel: warm see-through fill (brighter toward the big lantern), orange dashed ring
  const p = LL.panel, bw = LL.border;
  const fill = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  fill.addColorStop(0, 'rgba(111,99,90,0.77)');
  fill.addColorStop(1, `rgba(255,215,135,${0.25 + 0.35 * b * f})`);
  ctx.fillStyle = fill;
  ctx.fillRect(p.x + bw, p.y + bw, p.w - 2 * bw, p.h - 2 * bw);
  drawLanternDashedRing(p);

  drawLantern(LL.small.x, LL.small.y, LL.small.S, b, f, tint);

  ctx.save();
  ctx.fillStyle = THEME.dialogue.text;
  ctx.font = `24px ${FONT_BODY}`;
  ctx.letterSpacing = '1.5px';
  ctx.textAlign = 'left';
  ctx.fillText('Awaken the Lantern-Bug', LL.titleX, LL.titleY);

  // one small flame per round won (the big-flame art, tiny), tucked inside
  // the panel's top-right corner; a faint dot where a round is still to win
  const markerFlame = LANTERN_FLAMES[3];
  for (let k = 0; k < LANTERN_ROUNDS; k++) {
    const x = p.x + p.w - 24 - (LANTERN_ROUNDS - 1 - k) * 20, y = p.y + 30;
    if (k < L.roundsDone && markerFlame.complete) {
      const s = 1.2;
      ctx.drawImage(markerFlame, x - LANTERN_WICK.x * s, y - LANTERN_WICK.y * s * f, 64 * s, 64 * s * f);
    } else { ctx.fillStyle = 'rgba(200,211,180,0.35)'; ctx.fillRect(x - 2, y - 4, 4, 4); }
  }

  // swatches, with their key numbers under them; the flashed/pressed one is ringed
  ctx.font = `13px ${FONT_BODY}`;
  ctx.textAlign = 'center';
  LANTERN_SWATCHES.forEach((c, i) => {
    const r = LL.swatch(i);
    ctx.fillStyle = c;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (i === L.flashSwatch) {
      ctx.strokeStyle = THEME.dialogue.text;
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
    }
    ctx.fillStyle = 'rgba(200,211,180,0.75)';
    ctx.fillText(String(i + 1), r.x + r.w / 2, r.y + r.h + 16);
  });

  ctx.fillStyle = '#e8ecdc';
  ctx.font = `15px ${FONT_BODY}`;
  ctx.textAlign = 'left';
  ctx.fillText(L.status, p.x, LL.statusY);
  ctx.restore();
}

/* =========================================================================
   MINIGAME 2 — Match the Butterfly Wings (card-matching memory game, by
   mouse click, Level 2). The butterfly "never forgets a wing pattern" —
   flip cards two at a time, find every matching pair.

   Built from the minigame mockups (744x418, scaled to the 800x450 canvas):
   the dialogue's navy edge-shade over the scene with a giant butterfly
   silhouette slowly flapping behind, a lime Pixelta title, and a
   pale-cyan panel with a dashed sky-blue border holding a 4x2 grid of
   64px butterfly cards drawn at 1.25x. Cards flip by squeezing to their
   edge and opening on the other side.
   ========================================================================= */
const cardImage = src => Object.assign(new Image(), { src });
const CARD_BACK = cardImage('assets/minigame/card-back.png');
const CARD_FACES = [ // one pair of each in the deck
  cardImage('assets/minigame/wings-blue.png'),
  cardImage('assets/minigame/wings-purple.png'),
  cardImage('assets/minigame/wings-green.png'),
  cardImage('assets/minigame/wings-red.png'),
];

/* The wing-matching game, from the mockup in Figma ("Frame 28", next to the
   lantern card). That frame is 744x418, so every number here is its position
   there scaled by 800/744 to the game's 800x450 screen. */
const CARDS_LAYOUT = {
  panel: { x: 172.6, y: 149.3, w: 454.8, h: 228.5 }, // the pale-cyan panel; its dashed ring sits centred on this edge
  border: 8.6, dash: 7.5, dashPeriod: 15,
  panelFill: '#dfffff', borderColor: '#759ed0',
  colCenters: [251.4, 350.5, 449.6, 548.6], rowCenters: [218.3, 309.3],
  cardSize: 83, // the 64px sprites at about 1.3x
  titleY: 118.2, titleSize: 26, // "Match the Butterfly Wings" in Venice Classic, centred
  // the two big wing silhouettes behind the panel (CARD_WING_PATH, the left
  // one; the right is its mirror image), flapping slowly toward the body
  wings: { left: { x: 90.6, y: 17 }, rightEdge: 691.4, scale: 800 / 744, color: '42,34,65', alpha: 0.5, folded: 0.66, flapS: 2.6 },
  // the butterfly perched on the panel's top-left corner, watching you play:
  // its own two-frame flap, floating gently, flipped to face the cards
  butterfly: { x: 84.9, y: 65.1, size: 166.6, bob: 5, drift: 3 },
  flipS: 0.28,  // one full flip
  popMs: 300,   // the little bounce a matched pair gives once it's face up
};

const CARD_WING_W = 203.09; // the path's width in mockup px; its right edge is the body side

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startCardsGame(onWin) {
  gameState = STATE.MINIGAME;
  activeMinigame = 'cards';
  const deck = shuffleArray([0, 0, 1, 1, 2, 2, 3, 3]);
  cards = {
    deck,
    revealed: deck.map(() => false),
    matched: deck.map(() => false),
    faceT: deck.map(() => 0),       // flip progress per card: 0 = back showing .. 1 = face showing
    matchedAt: deck.map(() => null), // performance.now() when each card was matched, for its pop
    firstPick: null, secondPick: null,
    lockTimer: 0, winTimer: 0,
    matchesFound: 0,
    onWin: onWin || null,
  };
}

// Each card's click area: its full 80px square, centered on its grid slot.
function cardRect(i) {
  const L = CARDS_LAYOUT, cols = L.colCenters.length;
  const cx = L.colCenters[i % cols], cy = L.rowCenters[Math.floor(i / cols)];
  return { x: cx - L.cardSize / 2, y: cy - L.cardSize / 2, w: L.cardSize, h: L.cardSize };
}

function updateCardsGame(dt) {

  // ease every card's flip toward the side it should be showing
  const step = dt / CARDS_LAYOUT.flipS;
  for (let i = 0; i < cards.deck.length; i++) {
    const target = cards.revealed[i] || cards.matched[i] ? 1 : 0;
    if (cards.faceT[i] < target) cards.faceT[i] = Math.min(target, cards.faceT[i] + step);
    else if (cards.faceT[i] > target) cards.faceT[i] = Math.max(target, cards.faceT[i] - step);
  }

  if (cards.winTimer > 0) {
    cards.winTimer -= dt;
    if (cards.winTimer <= 0) {
      const onWin = cards.onWin;
      activeMinigame = null; cards = null;
      gameState = STATE.PLAYING;
      if (onWin) onWin();
    }
    return;
  }

  if (cards.lockTimer > 0) {
    cards.lockTimer -= dt;
    if (cards.lockTimer <= 0) {
      cards.revealed[cards.firstPick] = false;
      cards.revealed[cards.secondPick] = false;
      cards.firstPick = null; cards.secondPick = null;
    }
  }
}

function handleCardsClick(mx, my) {
  if (!cards || cards.lockTimer > 0 || cards.winTimer > 0) return;
  for (let i = 0; i < cards.deck.length; i++) {
    if (cards.matched[i] || cards.revealed[i]) continue;
    const r = cardRect(i);
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
      if (cards.firstPick === null) {
        cards.firstPick = i;
        cards.revealed[i] = true;
        sfx.flip();
      } else if (cards.secondPick === null && i !== cards.firstPick) {
        cards.secondPick = i;
        cards.revealed[i] = true;
        sfx.flip();
        if (cards.deck[cards.firstPick] === cards.deck[cards.secondPick]) {
          cards.matched[cards.firstPick] = true;
          cards.matched[cards.secondPick] = true;
          cards.matchedAt[cards.firstPick] = cards.matchedAt[cards.secondPick] = performance.now();
          cards.firstPick = null; cards.secondPick = null;
          cards.matchesFound++;
          // a beat to enjoy the finished board before it closes
          if (cards.matchesFound >= cards.deck.length / 2) { cards.winTimer = 1.4; sfx.fanfare(); }
          else sfx.match();
        } else {
          // long enough to flip the second card up and still see both faces
          cards.lockTimer = 0.9;
          sfx.miss();
        }
      }
      return;
    }
  }
}

// Dashes along one straight edge of the panel's border, spread evenly so
// both corners get a dash.
function drawDashedEdge(x, y, length, horizontal) {
  const L = CARDS_LAYOUT;
  const count = Math.max(1, Math.round((length - L.dash) / L.dashPeriod));
  const spacing = (length - L.dash) / count;
  for (let k = 0; k <= count; k++) {
    const at = Math.round(k * spacing);
    if (horizontal) ctx.fillRect(x + at, y, L.dash, L.border);
    else ctx.fillRect(x, y + at, L.border, L.dash);
  }
}

// The backdrop of the minigame cards' mockups (the lantern's how-to-play card
// and the wing-matching game): the game dimmed, a soft grey light in the
// middle of the screen, and the dialogue's navy edges.
function drawMinigameLight() {
  ctx.fillStyle = `rgba(${THEME.dialogue.shadeRGB},0.55)`;
  ctx.fillRect(0, 0, CW, CH);
  const glow = ctx.createRadialGradient(CW / 2, CH / 2 + 20, 20, CW / 2, CH / 2 + 20, 440);
  glow.addColorStop(0, 'rgba(232,232,228,0.92)');
  glow.addColorStop(0.45, 'rgba(190,190,192,0.62)');
  glow.addColorStop(1, 'rgba(200,200,200,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CW, CH);
  drawDialogueShade(1);
}

function renderCardsGame() {
  const L = CARDS_LAYOUT, now = performance.now();

  // backdrop: the soft light and navy edges of the minigame cards (as on the
  // lantern's how-to-play card), then the two wing silhouettes flapping
  // slowly toward the body behind the panel
  drawMinigameLight();
  const W = L.wings, open = 0.5 + 0.5 * Math.sin((now / 1000) * (2 * Math.PI / W.flapS));
  const fold = W.folded + (1 - W.folded) * open; // 1 = spread as in the mockup
  ctx.save();
  ctx.fillStyle = `rgba(${W.color},${W.alpha})`;
  for (const side of [-1, 1]) {
    ctx.save();
    // pin each wing at its body edge, and squeeze it toward the body as it folds
    const bodyX = side < 0 ? W.left.x + CARD_WING_W * W.scale : W.rightEdge - CARD_WING_W * W.scale;
    ctx.translate(bodyX, W.left.y);
    ctx.scale(-side * fold * W.scale, W.scale); // the left wing's path is drawn with its body edge at x=CARD_WING_W
    ctx.translate(-CARD_WING_W, 0);
    ctx.fill(CARD_WING_PATH);
    ctx.restore();
  }
  ctx.restore();

  ctx.save();
  ctx.fillStyle = THEME.dialogue.text;
  ctx.font = `${L.titleSize}px 'Venice Classic', ${FONT_BODY}`;
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Match the Butterfly Wings', CW / 2, L.titleY);
  ctx.restore();

  // panel: pale cyan, with a dashed sky-blue ring centred on its edge whose
  // gaps let the backdrop show through
  const p = L.panel, b = L.border;
  ctx.fillStyle = L.panelFill;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = L.borderColor;
  const o = { x: p.x - b / 2, y: p.y - b / 2, w: p.w + b, h: p.h + b };
  drawDashedEdge(o.x, o.y, o.w, true);
  drawDashedEdge(o.x, o.y + o.h - b, o.w, true);
  drawDashedEdge(o.x, o.y, o.h, false);
  drawDashedEdge(o.x + o.w - b, o.y, o.h, false);

  // cards: squeezed horizontally toward their edge as they turn (back
  // showing for the first half, face for the second), lifting slightly mid-turn
  for (let i = 0; i < cards.deck.length; i++) {
    const t = cards.faceT[i];
    const img = t >= 0.5 ? CARD_FACES[cards.deck[i]] : CARD_BACK;
    if (!img.complete || img.naturalWidth === 0) continue;
    const r = cardRect(i);
    const turn = Math.abs(t - 0.5) * 2;
    const lift = 1 + 0.08 * Math.sin(Math.PI * t);
    let pop = 1;
    if (cards.matchedAt[i] !== null) {
      const since = (now - cards.matchedAt[i] - L.flipS * 1000) / L.popMs;
      if (since > 0 && since < 1) pop = 1 + 0.15 * Math.sin(Math.PI * since);
    }
    ctx.save();
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
    ctx.scale(turn * lift * pop, lift * pop);
    ctx.drawImage(img, -L.cardSize / 2, -L.cardSize / 2, L.cardSize, L.cardSize);
    ctx.restore();
  }

  // the butterfly in the corner, flapping and floating as it watches you play
  const bf = L.butterfly, sprite = butterflyFrames[Math.floor(now / BUTTERFLY_FRAME_MS) % butterflyFrames.length];
  if (sprite.complete && sprite.naturalWidth > 0) {
    const s = now / 1000;
    const fx = bf.x + Math.sin(s * 0.9) * bf.drift, fy = bf.y + Math.sin(s * 1.7) * bf.bob;
    ctx.save();
    ctx.translate(fx + bf.size, fy);
    ctx.scale(-1, 1); // flipped, as in the mockup, to face the cards
    ctx.drawImage(sprite, 0, 0, bf.size, bf.size);
    ctx.restore();
  }
}

/* =========================================================================
   MINIGAME DISPATCH
   ========================================================================= */
function updateActiveMinigame(dt) {
  if (activeMinigame === 'lantern') updateLanternGame(dt);
  else if (activeMinigame === 'cards') updateCardsGame(dt);
}

// Each minigame draws its own full-screen look.
function renderActiveMinigame() {
  if (activeMinigame === 'lantern') renderLanternGame();
  else if (activeMinigame === 'cards') renderCardsGame();
}

/* =========================================================================
   PHYSICS / COLLISION
   ========================================================================= */
function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updatePlayerPhysics(dt) {
  // hidden in a bush she stays put; a fresh move or jump brings her out
  // (a jump straight out, too, since the jump below still sees the press)
  if (hidingIn && (anyJustPressed(KEY_LEFT) || anyJustPressed(KEY_RIGHT) || anyJustPressed(KEY_JUMP))) leaveShelter();
  const left = !hidingIn && anyDown(KEY_LEFT);
  const right = !hidingIn && anyDown(KEY_RIGHT);

  if (left && !right) {
    player.vx -= MOVE_ACCEL * dt;
    player.facing = -1;
  } else if (right && !left) {
    player.vx += MOVE_ACCEL * dt;
    player.facing = 1;
  } else {
    if (player.vx > 0) player.vx = Math.max(0, player.vx - MOVE_FRICTION * dt);
    else if (player.vx < 0) player.vx = Math.min(0, player.vx + MOVE_FRICTION * dt);
  }
  player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

  if (player.onGround) player.coyoteTimer = COYOTE_TIME;
  else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  if (anyJustPressed(KEY_JUMP)) player.jumpBufferTimer = JUMP_BUFFER_TIME;
  else player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);

  if (player.jumpBufferTimer > 0 && player.coyoteTimer > 0) {
    sfx.jump();
    player.vy = -JUMP_VELOCITY;
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
  }

  player.vy += (player.vy < 0 ? RISE_GRAVITY : FALL_GRAVITY) * dt;
  if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;

  const prevX = player.x;
  player.x += player.vx * dt;
  for (const p of platforms) {
    if (aabbOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  player.x = Math.max(0, Math.min(worldWidth - player.w, player.x));
  if (player.onGround) player.walkDistance += Math.abs(player.x - prevX);

  player.onGround = false;
  player.standingOn = null;
  player.y += player.vy * dt;
  for (const p of platforms) {
    if (aabbOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
        player.standingOn = p;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }

  if (player.y > LEVEL_HEIGHT + 150) {
    triggerGameOver(PIT_GAME_OVER_MESSAGE);
  }
}

function updateDrifters(dt) {
  for (const d of drifters) {
    const oldX = d.x, oldY = d.y;
    if (d.axis === 'x') d.x = d.baseX + Math.sin(elapsed * d.speed + d.phase) * d.amplitude;
    else d.y = d.baseY + Math.sin(elapsed * d.speed + d.phase) * d.amplitude;
    if (player.standingOn === d) {
      player.x += d.x - oldX;
      player.y += d.y - oldY;
    }
  }
}

/* =========================================================================
   HAZARDS
   ========================================================================= */
// A hit from a hazard (the bird) — ignored during the brief
// post-respawn grace period. Falling out of the level isn't a hazard hit
// and always counts.
function hazardHit(message) {
  if (player.graceTimer > 0) return;
  triggerGameOver(message);
}

function triggerGameOver(message) {
  gameState = STATE.GAME_OVER;
  gameOverMessage = message;
  sfx.caught();
  gameOverAt = performance.now() / 1000; // the screen eases in from here (see gameOverFade)
}

/* Swooping birds (these were foot-stomps) — restricted to wide clearing
   segments. After the red-column warning, the bird (a 256x160 sprite, ~3.5x
   the ladybug) dives in from the top of the screen on the player's side,
   slowly at first and faster and faster, levelling out as it reaches the
   clearing; it skims the whole clearing at full speed (the snatch), then
   eases off as it climbs out the far side, its wings beating faster the
   faster it flies. The clearing is wide, so the way to survive is to hide
   in one of its bushes (see SHELTER below) — the red warning leaves
   a gap under each one. It's only dangerous where its body actually is
   while it's skimming inside the warned clearing, so the warning stays
   honest; a well-timed jump near the apex can still just clear it. */
const SWOOP_ENTRY_DX = 260; // how far outside the clearing's near edge the dive starts
const SWOOP_LOW = 70;      // bird-center height above the ground while skimming — talons (wings-up frame) graze the grass; wingtips (wings-down frame) dip into it
const SWOOP_TOP = 560;     // height the dive starts from, above the top of the screen
const SWOOP_HIGH = 440;    // height it climbs out to, above the top of the screen
const SWOOP_RAMP = 260;    // px past the clearing's far edge over which it climbs out to full height
const BIRD_BODY_HALF_W = 100; // half-width of the danger block around the bird's center
const BIRD_DANGER_H = 90;  // height of the danger block (and warning column) above the ground
// The approach accelerates the whole way in (distance ~ time cubed); the exit
// leaves at the same speed and eases off, so the two phases join without a
// jolt: that needs the exit to last 2/3 of the approach.
const SWOOP_APPROACH_S = 2.4;
const SWOOP_EXIT_S = SWOOP_APPROACH_S * 2 / 3;
const SWOOP_APPROACH_FRACTION = SWOOP_APPROACH_S / (SWOOP_APPROACH_S + SWOOP_EXIT_S);

const smoothstep01 = k => { k = Math.min(1, Math.max(0, k)); return k * k * (3 - 2 * k); };

// Where the bird is at swoop progress t (0..1).
function swoopPose(hz, t) {
  const half = hz.w / 2, reach = half + SWOOP_ENTRY_DX;
  let along, height, approach;
  if (t < SWOOP_APPROACH_FRACTION) {
    approach = t / SWOOP_APPROACH_FRACTION; // 0..1 through the approach
    along = -reach * (1 - approach * approach * approach);
    // steep from the top at first, levelling out to skim height at the clearing's edge
    const k = Math.min(1, Math.max(0, (Math.abs(along) - half) / SWOOP_ENTRY_DX));
    height = SWOOP_LOW + (SWOOP_TOP - SWOOP_LOW) * k * k;
  } else {
    const s = (t - SWOOP_APPROACH_FRACTION) / (1 - SWOOP_APPROACH_FRACTION);
    along = reach * (1 - (1 - s) * (1 - s));
    height = SWOOP_LOW + (SWOOP_HIGH - SWOOP_LOW) * smoothstep01((along - half) / SWOOP_RAMP);
  }
  return {
    x: hz.x + half + hz.swoopDir * along,
    y: hz.groundY - height,
    inColumn: Math.abs(along) <= half,
    approach, // 0..1 while still coming in; undefined once it's past the clearing's center
    // 0 skimming the ground .. 1 up high
    lift: Math.min(1, Math.max(0, (height - SWOOP_LOW) / (SWOOP_HIGH - SWOOP_LOW))),
  };
}

/* SHELTER — a bush in each bird clearing (the garden's bush art, at the same
   3x as the decor bushes). Walk up to one and press E to hide in it: she
   tucks in behind it with her face peeking out of its right side, and
   only a hidden ladybug is safe from the bird. E again, or moving or
   jumping, brings her back out. The bush rustles as she ducks in or out and
   as the bird rushes past. */
const SHELTER_HALF = 30;     // the red warning's safe gap around each bush (see drawBirdWarning)
const SHELTER_REACH = 44;    // how close her centre has to be to the bush's to hide in it
const SHELTER_SCALE = 3;     // drawn like the decor bushes
const SHELTER_SINK = 2 * 3 + 3; // the art's 2 empty bottom rows, plus a little into the grass
const SHELTER_ART_H = 64;    // roughly how tall the bush stands, for placing prompts above it
const SHELTER_PEEK_DX = 34;  // hidden, her centre sits this far right of the bush's, facing out, so just her face shows
const SHELTER_RUSTLE_S = 0.45;

function shelterXs(hz) { return hz.covers.map(off => hz.x + off); }

// { hz, sx, at } while she's hidden in a bush
let hidingIn = null;

function isPlayerSheltered(hz) { return !!hidingIn && hidingIn.hz === hz; }

// The bush she's close enough to hide in, if any.
function shelterInReach() {
  if (!player.onGround || hidingIn) return null;
  const pcx = player.x + player.w / 2;
  for (const hz of stompHazards) {
    for (const sx of shelterXs(hz)) if (Math.abs(pcx - sx) <= SHELTER_REACH) return { hz, sx };
  }
  return null;
}

const shelterRustle = {}; // bush x -> elapsed time it was last disturbed
function hideInShelter(s) {
  hidingIn = { ...s, at: elapsed };
  shelterRustle[s.sx] = elapsed;
  sfx.rustle();
  player.x = s.sx + SHELTER_PEEK_DX - player.w / 2;
  player.vx = 0;
  player.facing = 1;
}
function leaveShelter() {
  if (!hidingIn) return;
  shelterRustle[hidingIn.sx] = elapsed;
  sfx.rustle();
  hidingIn = null;
}

// Each bush is drawn behind her, except the one she's hiding in, which is
// drawn in front ('front' pass, after the player).
function drawShelters(pass) {
  const im = decorSprites.bush;
  if (!im.complete || !im.naturalWidth) return;
  const w = im.naturalWidth * SHELTER_SCALE, h = im.naturalHeight * SHELTER_SCALE;
  for (const hz of stompHazards) {
    let birdX = null, birdLow = 0;
    if (hz.state === 'swoop') {
      const pose = swoopPose(hz, 1 - hz.timer / hz.swoopDur);
      birdX = pose.x; birdLow = 1 - pose.lift;
    }
    for (const sx of shelterXs(hz)) {
      const inFront = !!hidingIn && hidingIn.sx === sx;
      if (inFront !== (pass === 'front')) continue;
      // a shiver as she ducks in or out, and a hard rustle as the bird rushes low overhead
      const rush = birdX === null ? 0 : Math.max(0, 1 - Math.abs(birdX - sx) / 180) * birdLow;
      const since = elapsed - (shelterRustle[sx] ?? -Infinity);
      const duck = since < SHELTER_RUSTLE_S ? 1 - since / SHELTER_RUSTLE_S : 0;
      const shake = Math.round(Math.sin(elapsed * 24 + sx) * (3 * rush + 2 * duck));
      ctx.drawImage(im, Math.round(sx - w / 2) + shake, hz.groundY - h + SHELTER_SINK, w, h);
    }
  }
}

// "Press E to Hide" by a bush she can hide in; while a bird is on its way
// and she's out in the open nearby, a pulsing nudge toward the nearest bush.
function drawShelterPrompts() {
  if (gameState !== STATE.PLAYING || hidingIn) return;
  const reach = shelterInReach();
  if (reach) {
    drawPromptText('Press E to Hide', reach.sx, reach.hz.groundY - SHELTER_ART_H - 6);
    return;
  }
  const pcx = player.x + player.w / 2;
  for (const hz of stompHazards) {
    const coming = hz.state === 'telegraph' || (hz.state === 'swoop' && swoopPose(hz, 1 - hz.timer / hz.swoopDur).approach !== undefined);
    if (!coming) continue;
    if (pcx < hz.x - 150 || pcx > hz.x + hz.w + 150) continue;
    const nearest = shelterXs(hz).reduce((a, b) => Math.abs(b - pcx) < Math.abs(a - pcx) ? b : a);
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(hz.pulse);
    drawPromptText('Quick! Hide in the bush!', nearest, hz.groundY - SHELTER_ART_H - 6);
    ctx.restore();
  }
}

// whether a bird's clearing is on (or just off) the screen
const clearingOnScreen = hz => hz.x + hz.w > cameraX - 120 && hz.x < cameraX + CW + 120;

function updateStomps(dt) {
  for (const hz of stompHazards) {
    hz.timer -= dt;
    if (hz.timer > 0) continue;

    switch (hz.state) {
      case 'idle':
        hz.state = 'telegraph'; hz.timer = hz.telegraphDur;
        if (clearingOnScreen(hz)) sfx.birdCall(); // only heard when it's near enough to matter
        break;
      case 'telegraph':
        // come in from the player's side, so they see it arriving
        hz.swoopDir = player.x + player.w / 2 < hz.x + hz.w / 2 ? 1 : -1;
        hz.state = 'swoop'; hz.timer = hz.swoopDur; hz.whooshed = false;
        break;
      case 'swoop': hz.state = 'idle'; hz.timer = hz.idleDur; break;
    }
  }

  for (const hz of stompHazards) {
    // build-up: the warning pulses faster and the wings beat faster as it closes in
    let pulseRate = 7, flapRate = 0.7;
    hz.urgency = 0;
    if (hz.state === 'swoop') {
      const t = 1 - hz.timer / hz.swoopDur;
      const pose = swoopPose(hz, t);
      const ahead = swoopPose(hz, Math.min(1, t + 0.01));
      const speed = Math.abs(ahead.x - pose.x) / (0.01 * hz.swoopDur);
      flapRate = Math.min(2.6, 0.7 + speed / 350);
      if (pose.approach !== undefined) {
        hz.urgency = pose.approach * pose.approach;
        pulseRate = 7 + 28 * hz.urgency;
      }
    }
    hz.pulse += pulseRate * dt;
    hz.flap += (dt * 1000 / BIRD_FRAME_MS) * flapRate;
  }

  for (const hz of stompHazards) {
    if (hz.state !== 'swoop') continue;
    const pose = swoopPose(hz, 1 - hz.timer / hz.swoopDur);
    // the rush of air as it sweeps into the clearing
    if (pose.inColumn && !hz.whooshed) { hz.whooshed = true; if (clearingOnScreen(hz)) sfx.whoosh(); }
    if (!pose.inColumn || isPlayerSheltered(hz)) continue;
    // the bird's body, kept within the warned clearing
    const left = Math.max(hz.x, pose.x - BIRD_BODY_HALF_W), right = Math.min(hz.x + hz.w, pose.x + BIRD_BODY_HALF_W);
    const block = { x: left, y: hz.groundY - BIRD_DANGER_H, w: right - left, h: BIRD_DANGER_H };
    if (aabbOverlap(player, block)) hazardHit(BIRD_GAME_OVER_MESSAGE);
  }
}

/* =========================================================================
   COLLECTIBLES + INTERACTABLES (NPC and lore markers)
   ========================================================================= */
function updateCollectibles() {
  for (const c of clovers) {
    if (c.collected) continue;
    const d = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
    if (aabbOverlap(player, d)) {
      c.collected = true;
      cloverCount++;
      sfx.clover();
      saveGame();
    }
  }
  const petalsActive = isPetalQuestActive();
  for (const p of petals) {
    if (p.collected || !petalsActive) continue;
    if (aabbOverlap(player, flowerPickupBox(p))) {
      p.collected = true;
      petalsFound++;
      sfx.petal();
      tryOpenGate();
      saveGame();
    }
  }
}

function nearEntity(a, b, radius) {
  const dx = (a.x + a.w / 2) - (b.x + b.w / 2);
  const dy = (a.y + a.h / 2) - (b.y + b.h / 2);
  return Math.sqrt(dx * dx + dy * dy) < radius;
}

function nearestLoreSpot() {
  return loreSpots.find(s => !s.collected && nearEntity(player, s, 50)) || null;
}

let activeLoreSpot = null;

function updateInteractables() {
  // E in a bush brings her back out (and does nothing else that press)
  if (hidingIn) {
    activeLoreSpot = null;
    if (anyJustPressed(KEY_INTERACT)) leaveShelter();
    return;
  }
  activeLoreSpot = nearestLoreSpot();
  const npc = npcs.find(n => !n.resolved && nearEntity(player, n, 60));
  if (npc && anyJustPressed(KEY_INTERACT)) {
    startNpcEncounter(npc);
    return;
  }
  const bush = !activeLoreSpot && shelterInReach();
  if (bush && anyJustPressed(KEY_INTERACT)) {
    hideInShelter(bush);
    return;
  }
  if (activeLoreSpot && anyJustPressed(KEY_INTERACT)) {
    const spot = activeLoreSpot;
    spot.opened = true; spot.openedAt = elapsed; // the envelope pops open while it's read
    sfx.paper();
    startDialogue(spot.lines, () => {
      spot.collected = true;
      spot.collectedAt = elapsed; // ...then the letter's left behind
      collectedClues.push(spot.label);
      saveGame();
    });
  }
}

/* =========================================================================
   CAMERA
   ========================================================================= */
function updateCamera(dt) {
  const targetX = Math.max(0, Math.min(worldWidth - CW, player.x + player.w / 2 - CW / 2));
  const targetY = Math.max(0, Math.min(LEVEL_HEIGHT - CH, player.y + player.h / 2 - CH / 2));
  const t = Math.min(1, dt * 6);
  cameraX += (targetX - cameraX) * t;
  cameraY += (targetY - cameraY) * t;
}

/* =========================================================================
   AMBIENT PARTICLES (level 3 pollen)
   ========================================================================= */
function updatePollen(dt) {
  for (const p of pollenParticles) {
    p.y -= p.speed * dt;
    p.x += Math.sin(elapsed * 0.6 + p.drift) * 6 * dt;
    if (p.y < -20) p.y = LEVEL_HEIGHT + 20;
  }
}

function drawPollen() {
  ctx.fillStyle = THEME.ambient.pollen;
  for (const p of pollenParticles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* =========================================================================
   AMBIENT LIFE — falling petals, wind gusts, fireflies, light rays and
   twinkling sky, so the garden never sits still. All screen-space, each
   particle on its own parallax depth (wrapping around the screen as the
   camera moves), and blended across zone borders like the palette:
   - petals fall everywhere, tumbling (squashed edge-on as they turn) and
     swaying; a few big near ones pass in front of the player. Pink
     blossoms in the greenhouse, rose and lilac in the arbor, and in the
     soil bed fewer, leaf-colored ones;
   - every so often a gust of wind sweeps them sideways and sets them spinning;
   - fireflies wander and blink in the arbor and the soil bed, glowing
     through the dark;
   - soft sun rays lean down through the greenhouse (fainter in the arbor);
   - pixel sparkles twinkle in the sky.
   ========================================================================= */
const AMBIENT_BY_SET = {
  daylight: { petals: 1, rays: 1, fireflies: 0, twinkle: '#ffffff',
    petalColors: [['#f49ac1', '#ffc9de'], ['#f7b6cf', '#ffe3ee'], ['#fff6f0', '#ffffff']] },
  dreamy: { petals: 0.85, rays: 0.4, fireflies: 0.45, twinkle: '#fff3c7',
    petalColors: [['#e98bb4', '#ffc4dc'], ['#c9a7eb', '#ecdcff'], ['#f7b6cf', '#ffe3ee']] },
  mossy: { petals: 0.45, rays: 0, fireflies: 1, twinkle: '#d9ff00',
    petalColors: [['#9cc46a', '#d4ef9c'], ['#b5de89', '#e2f5b5'], ['#cdbb8c', '#efe2bd']] },
};
// petal pixel masks: '#' body, 'o' highlight
const PETAL_SHAPES = [
  ['.o#', '###', '##.'],
  ['.oo.', '####', '.##.'],
  ['o#..', '###.', '.###', '..#.'],
];
const AMBIENT_WRAP = 40; // particles wrap this far off each screen edge
const WIND_BASE = 10, WIND_GUST = 55;

let ambientPetals = [], fireflies = [], skyTwinkles = [];
const wind = { x: WIND_BASE, gust: 0, gustT: 0, gustDur: 0, next: 6 };

function buildAmbient() {
  const r = (a, b) => a + Math.random() * (b - a);
  const petal = (near) => ({
    x: r(0, CW), y: r(0, CH),
    depth: near ? r(1.25, 1.5) : r(0.35, 0.95), near,
    shape: Math.floor(Math.random() * PETAL_SHAPES.length),
    colorIdx: Math.floor(Math.random() * 3), colorSeed: Math.random(), densitySeed: Math.random(),
    fall: r(16, 30), sway: r(8, 20), swayF: r(0.6, 1.4), phase: r(0, Math.PI * 2),
    spin: r(0, Math.PI * 2), spinSpeed: r(1.2, 3),
  });
  ambientPetals = [...Array.from({ length: 42 }, () => petal(false)), ...Array.from({ length: 6 }, () => petal(true))];
  // chunkier pixels the nearer the petal
  for (const p of ambientPetals) p.px = p.near ? 4 : p.depth > 0.7 ? 3 : 2;
  fireflies = Array.from({ length: 16 }, () => ({
    x: r(0, CW), y: r(CH * 0.25, CH * 0.95), vx: r(-8, 8), vy: r(-5, 5),
    depth: r(0.8, 1.05), blinkF: r(0.7, 1.6), phase: r(0, Math.PI * 2), densitySeed: Math.random(),
  }));
  skyTwinkles = Array.from({ length: 12 }, () => ({
    // y includes the wrap margin, which ambientScreenPos takes back off
    x: r(0, CW), y: AMBIENT_WRAP + r(8, 115), f: r(0.6, 1.4), phase: r(0, Math.PI * 2), big: Math.random() < 0.35,
  }));
}

// The ambient settings at the player's spot, mixed across a zone border.
function ambientAt(x) {
  const { from, to, t } = zoneBlendAt(x);
  return { a: AMBIENT_BY_SET[LEVELS[from].backgroundSet], b: AMBIENT_BY_SET[LEVELS[to].backgroundSet], t };
}
const mixAmbient = (m, key) => m.a[key] + (m.b[key] - m.a[key]) * m.t;

// where a layer-space particle lands on screen at its parallax depth
function ambientScreenPos(p, depth, depthY = depth) {
  const wrapW = CW + 2 * AMBIENT_WRAP, wrapH = CH + 2 * AMBIENT_WRAP;
  let sx = (p.x - cameraX * depth) % wrapW; if (sx < 0) sx += wrapW;
  let sy = (p.y - cameraY * depthY) % wrapH; if (sy < 0) sy += wrapH;
  return { sx: sx - AMBIENT_WRAP, sy: sy - AMBIENT_WRAP };
}

function updateAmbient(dt) {
  // wind: a steady breeze, with a gust swelling and fading every 8-15s
  wind.next -= dt;
  if (wind.next <= 0 && wind.gustDur === 0) { wind.gustDur = 2.4 + Math.random() * 1.4; wind.gustT = 0; }
  if (wind.gustDur > 0) {
    wind.gustT += dt;
    wind.gust = Math.sin(Math.PI * Math.min(1, wind.gustT / wind.gustDur));
    if (wind.gustT >= wind.gustDur) { wind.gustDur = 0; wind.gust = 0; wind.next = 8 + Math.random() * 7; }
  }
  wind.x = WIND_BASE + WIND_GUST * wind.gust;

  for (const p of ambientPetals) {
    const d = Math.min(1.2, p.depth); // nearer petals move a little faster
    p.x += (wind.x + Math.sin(elapsed * p.swayF + p.phase) * p.sway) * d * dt;
    p.y += p.fall * d * (1 - 0.35 * wind.gust) * dt; // a gust carries them along, slowing the fall
    p.spin += (p.spinSpeed + 4 * wind.gust) * dt;
  }
  for (const f of fireflies) {
    f.vx = Math.max(-14, Math.min(14, f.vx + (Math.random() - 0.5) * 60 * dt));
    f.vy = Math.max(-9, Math.min(9, f.vy + (Math.random() - 0.5) * 40 * dt));
    f.x += (f.vx + wind.x * 0.25) * dt;
    f.y += f.vy * dt;
  }
}

// One petal: its mask drawn in chunky pixels, squashed sideways by the turn
// (cos of its spin) so it flips edge-on as it tumbles.
function drawAmbientPetal(p, sx, sy, colors, alpha) {
  const mask = PETAL_SHAPES[p.shape], P = p.px, c = Math.cos(p.spin);
  const w = mask[0].length, h = mask.length;
  ctx.globalAlpha = alpha;
  for (let row = 0; row < h; row++) {
    for (let col = 0; col < w; col++) {
      const ch = mask[row][col];
      if (ch === '.') continue;
      // the highlight shows only while the petal's face is turned toward us
      ctx.fillStyle = ch === 'o' && c > 0 ? colors[1] : colors[0];
      const x = Math.round((col + 0.5 - w / 2) * c - 0.5);
      ctx.fillRect(Math.round(sx) + x * P, Math.round(sy) + (row - (h >> 1)) * P, P, P);
    }
  }
}

function drawAmbientPetals(near) {
  const m = ambientAt(player.x), density = mixAmbient(m, 'petals');
  ctx.save();
  for (const p of ambientPetals) {
    if (p.near !== near) continue;
    const alpha = Math.min(1, (density - p.densitySeed) * 6); // thinning out fades petals, not pops them
    if (alpha <= 0) continue;
    const { sx, sy } = ambientScreenPos(p, p.depth);
    const colors = (p.colorSeed < m.t ? m.b : m.a).petalColors[p.colorIdx];
    drawAmbientPetal(p, sx, sy, colors, alpha * (near ? 0.95 : 0.55 + 0.4 * p.depth));
  }
  ctx.restore();
}

function drawSkyTwinkles() {
  const m = ambientAt(player.x);
  ctx.save();
  ctx.fillStyle = m.t < 0.5 ? m.a.twinkle : m.b.twinkle;
  for (const s of skyTwinkles) {
    const a = Math.pow(Math.max(0, Math.sin(elapsed * s.f + s.phase)), 4);
    if (a < 0.05) continue;
    const { sx, sy } = ambientScreenPos(s, 0.15, 0); // stays up in the sky band, like the background's own stars
    const x = Math.round(sx), y = Math.round(sy);
    ctx.globalAlpha = a;
    ctx.fillRect(x - 1, y - 1, 2, 2);                  // core
    const arm = s.big && a > 0.5 ? 4 : 2;              // the big ones flare into a cross at their peak
    ctx.fillRect(x - 1, y - 1 - arm, 2, arm); ctx.fillRect(x - 1, y + 1, 2, arm);
    ctx.fillRect(x - 1 - arm, y - 1, arm, 2); ctx.fillRect(x + 1, y - 1, arm, 2);
  }
  ctx.restore();
}

// Soft sun rays leaning down from the top, swaying in brightness.
function drawLightRays() {
  const strength = mixAmbient(ambientAt(player.x), 'rays');
  if (strength <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const span = CW + 400;
  for (let i = 0; i < 4; i++) {
    let x = (i * span / 4 + 120 - cameraX * 0.25) % span; if (x < 0) x += span;
    x -= 200;
    const w = 46 + 30 * ((i * 37) % 3), lean = 170;
    const a = strength * (0.12 + 0.05 * Math.sin(elapsed * 0.5 + i * 1.9));
    const g = ctx.createLinearGradient(0, 0, 0, CH * 0.85);
    g.addColorStop(0, `rgba(255,246,214,${a})`);
    g.addColorStop(1, 'rgba(255,246,214,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + w, 0);
    ctx.lineTo(x + w + lean, CH * 0.85); ctx.lineTo(x + lean, CH * 0.85);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Fireflies: a slow blink with a soft glow, drawn over the darkness.
function drawFireflies() {
  const density = mixAmbient(ambientAt(player.x), 'fireflies');
  if (density <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const fade = Math.min(1, (density - f.densitySeed) * 6);
    if (fade <= 0) continue;
    const blink = Math.pow(Math.max(0, Math.sin(elapsed * f.blinkF + f.phase)), 2) * fade;
    if (blink < 0.03) continue;
    const { sx, sy } = ambientScreenPos(f, f.depth);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 11);
    g.addColorStop(0, `rgba(217,255,0,${0.45 * blink})`);
    g.addColorStop(1, 'rgba(217,255,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - 11, sy - 11, 22, 22);
    ctx.fillStyle = `rgba(244,255,176,${blink})`;
    ctx.fillRect(Math.round(sx) - 1, Math.round(sy) - 1, 2, 2);
  }
  ctx.restore();
}

/* =========================================================================
   NPC RENDERING (one shape family per gatekeeper)
   ========================================================================= */
function drawSnail(n) {
  const sprite = currentSnailSprite();
  if (sprite.complete && sprite.naturalWidth > 0) {
    const cx = n.x + n.w / 2;
    const bottom = n.y + n.h; // bottom-anchored so it stands on the ground line, not centered on the (smaller) hitbox
    ctx.drawImage(sprite, cx - SNAIL_SPRITE_SIZE / 2, bottom - SNAIL_SPRITE_SIZE, SNAIL_SPRITE_SIZE, SNAIL_SPRITE_SIZE);
    return;
  }
  // fallback vector art while the sprite loads (or if it fails to load)
  ctx.fillStyle = THEME.creatures.snail.shell;
  ctx.beginPath();
  ctx.ellipse(n.x + n.w / 2 - 4, n.y + 6, 16, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = THEME.creatures.snail.shellOutline;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(n.x + n.w / 2 - 4, n.y + 6, 8, 0, Math.PI * 1.5);
  ctx.stroke();
  ctx.fillStyle = THEME.creatures.snail.underbelly;
  ctx.fillRect(n.x, n.y + 14, 16, 14);
  ctx.fillStyle = THEME.creatures.snail.eye;
  ctx.beginPath();
  ctx.arc(n.x + 4, n.y + 12, 1.6, 0, Math.PI * 2);
  ctx.arc(n.x + 10, n.y + 12, 1.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawButterfly(n) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  const sprite = currentButterflySprite();
  if (sprite.complete && sprite.naturalWidth > 0) {
    // bottom-anchored to the hitbox like the bee, with the same draw-only
    // hover bob (the hitbox itself never moves)
    const hover = Math.sin(performance.now() / 260) * 2.5;
    ctx.drawImage(sprite, cx - BUTTERFLY_SPRITE_SIZE / 2, n.y + n.h - BUTTERFLY_SPRITE_SIZE + hover, BUTTERFLY_SPRITE_SIZE, BUTTERFLY_SPRITE_SIZE);
    return;
  }
  // fallback vector art while the sprite loads (or if it fails to load)
  const flap = Math.sin(performance.now() / 150) * 0.35;

  ctx.save();
  ctx.translate(cx, cy);

  // upper wings
  ctx.fillStyle = THEME.creatures.butterfly.upperWing;
  ctx.beginPath();
  ctx.ellipse(-11, -7, 13, 9, -0.35 + flap, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(11, -7, 13, 9, 0.35 - flap, 0, Math.PI * 2);
  ctx.fill();

  // lower wings
  ctx.fillStyle = THEME.creatures.butterfly.lowerWing;
  ctx.beginPath();
  ctx.ellipse(-8, 7, 9, 7, -0.2 + flap * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8, 7, 9, 7, 0.2 - flap * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // wing spots
  ctx.fillStyle = THEME.creatures.butterfly.spot;
  ctx.beginPath();
  ctx.arc(-11, -7, 3, 0, Math.PI * 2);
  ctx.arc(11, -7, 3, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = THEME.creatures.butterfly.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 3, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // antennae
  ctx.strokeStyle = THEME.creatures.butterfly.body;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-1, -9); ctx.quadraticCurveTo(-6, -15, -8, -17);
  ctx.moveTo(1, -9); ctx.quadraticCurveTo(6, -15, 8, -17);
  ctx.stroke();

  ctx.restore();
}

function drawBee(n) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  // A tiny hover bob (draw-only; her hitbox in n.y/n.h never moves, so this
  // can't affect collision or the dialogue-trigger radius). The sprite art
  // has its own wings; wingFlap only drives the vector fallback below.
  const wingFlap = Math.sin(performance.now() / 90) * 0.3;
  const hover = Math.sin(performance.now() / 260) * 2.5;
  const sprite = currentBeeSprite();
  if (sprite.complete && sprite.naturalWidth > 0) {
    // bottom-anchored to the hitbox, so she stays just above the ground like before
    ctx.drawImage(sprite, cx - BEE_SPRITE_SIZE / 2, n.y + n.h - BEE_SPRITE_SIZE + hover, BEE_SPRITE_SIZE, BEE_SPRITE_SIZE);
    return;
  }
  // fallback vector art while the sprite loads (or if it fails to load)
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = THEME.creatures.bee.wing;
  ctx.beginPath();
  ctx.ellipse(cx - 6, cy - 10 + hover, 10, 6, -0.3 + wingFlap, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 6, cy - 10 + hover, 10, 6, 0.3 - wingFlap, 0, Math.PI * 2);
  ctx.fill();
