<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Disc Junky</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #202020;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #start {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(32, 32, 32, 0.92);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 2;
    }
    #start small { opacity: 0.6; letter-spacing: 0.08em; text-transform: none; }
    #start.hidden { display: none; }
    #error {
      position: fixed;
      left: 12px; right: 12px; bottom: 12px;
      color: #ff8a8a;
      font: 12px/1.4 monospace;
      z-index: 3;
    }
    /* Debug panel: only shows when the address ends with ?debug=1 */
    #debug {
      display: none;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 46%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.72);
      color: #9fffa8;
      font: 10px/1.35 monospace;
      padding: 6px;
      z-index: 5;
      pointer-events: none;      /* taps go through to the game */
      white-space: pre-wrap;
      word-break: break-word;
    }
    #debug.on { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="start">
    <div>Tap to start</div>
    <small id="startHint">Loading...</small>
  </div>
  <div id="error"></div>
  <div id="debug"></div>

  <script>
    // ---- Change these if your names are different ----
    const RIV_FILE = "disc_junkey.riv";
    const ARTBOARD = "iPhone 16 - 1";
    const STATE_MACHINE = "State Machine 1";
    // --------------------------------------------------

    // Optional switches you can add to the end of the web address:
    //   ?debug=1        show an on-screen log + frame rate
    //   ?r=canvas       use the older Canvas renderer instead of the Rive (WebGL) renderer
    //   ?dpr=1.5        cap the sharpness (lower = faster on phones). Default 2.
    const params = new URLSearchParams(location.search);
    const DEBUG = params.get("debug") === "1";
    const RENDERER = params.get("r") === "canvas" ? "canvas" : "webgl2";
    const DPR_CAP = parseFloat(params.get("dpr")) || 2;
    //   ?mt=0           turn multi-touch off (for testing). It is ON by default so two fingers can tap two buttons at once.
    const MULTI_TOUCH = params.get("mt") !== "0";

    const canvas = document.getElementById("canvas");
    const startOverlay = document.getElementById("start");
    const errorBox = document.getElementById("error");
    const debugBox = document.getElementById("debug");

    // ---------- on-screen log ----------
    // Important lines (SongControl, audio, errors, setup) are kept and shown first.
    // Noisy lines (WaveDistort) are only counted. Only the latest frame-rate is shown.
    const keyLines = [];
    const otherLines = [];
    let noisyCount = 0;
    let lastFps = "(waiting)";
    let renderQueued = false;
    function render() {
      renderQueued = false;
      if (!DEBUG) return;
      const out = [];
      out.push("FPS: " + lastFps);
      out.push("WaveDistort lines hidden: " + noisyCount);
      out.push("---- key lines ----");
      out.push.apply(out, keyLines.slice(-40));
      out.push("---- other ----");
      out.push.apply(out, otherLines.slice(-12));
      debugBox.textContent = out.join("\n");
    }
    function addLog(kind, args) {
      const text = Array.prototype.map.call(args, (a) => {
        try { return typeof a === "string" ? a : JSON.stringify(a); } catch (e) { return String(a); }
      }).join(" ");
      if (text.indexOf("[WaveDistort]") === 0) { noisyCount++; }
      else if (text.indexOf("fps:") === 0) { lastFps = text.replace("fps: ", ""); }
      else if (kind !== "·" || /SongControl|multi-touch|song|rive event|trigger|asset:|audio|Audio|renderer|version|loaded|play\(\)|screen|browser/i.test(text)) {
        keyLines.push(kind + " " + text);
        if (keyLines.length > 200) keyLines.shift();
      } else {
        otherLines.push(kind + " " + text);
        if (otherLines.length > 100) otherLines.shift();
      }
      if (!renderQueued) { renderQueued = true; setTimeout(render, 300); }
    }
    if (DEBUG) {
      debugBox.classList.add("on");
      ["log", "info", "warn", "error"].forEach((k) => {
        const orig = console[k].bind(console);
        console[k] = function () { addLog(k === "log" || k === "info" ? "·" : k.toUpperCase() + ":", arguments); orig.apply(null, arguments); };
      });
      window.addEventListener("error", (e) => addLog("ERROR:", [e.message]));
      window.addEventListener("unhandledrejection", (e) => addLog("REJECTED:", [String(e.reason)]));
      console.log("renderer:", RENDERER, "| dpr cap:", DPR_CAP, "| device dpr:", window.devicePixelRatio);
      console.log("multi-touch:", MULTI_TOUCH ? "on" : "off");
      console.log("screen:", window.innerWidth + "x" + window.innerHeight);
      console.log("browser:", navigator.userAgent);
    }

    // ---------- frame-rate counter ----------
    let frames = 0, lastT = performance.now(), worst = 0, lastFrame = lastT;
    function fpsLoop(now) {
      frames++;
      worst = Math.max(worst, now - lastFrame);
      lastFrame = now;
      if (now - lastT >= 2000) {
        if (DEBUG) console.log("fps:", Math.round(frames * 1000 / (now - lastT)), "| slowest frame:", Math.round(worst) + "ms");
        frames = 0; worst = 0; lastT = now;
      }
      requestAnimationFrame(fpsLoop);
    }
    if (DEBUG) requestAnimationFrame(fpsLoop);

    // ---------- the game song, played by the browser itself ----------
    // The browser decodes and plays it on its own audio thread, so it stays smooth
    // even when the game drawing is busy. The game's own `songVolume` number
    // (0-100, the same one SongControl used) is copied onto this volume every frame.
    const SONG_FILE = "song.mp3";
    const SONG_OFFSET_SECONDS = 0;   // if the song and the waveform are slightly off, nudge this (e.g. 0.05)
    // The song starts when the game timeline reports a Rive event with this name
    // (a "Report Event" keyframe placed where the song should begin).
    // Add ?song=tap to the address to start it on the first tap instead (for testing).
    const SONG_START_EVENT = "songStart";
    // Newer, preferred way: a Trigger property on gameScreen that a Listener fires.
    const SONG_START_TRIGGER = "songStartTrigger";
    // Fired by the PLAY AGAIN button on the final stats screen (a Trigger property on gameScreen).
    // The page answers by reloading itself, which restarts the game, the song and every counter.
    const PLAY_AGAIN_TRIGGER = "playAgainTrigger";
    // Fired when the ult is pressed (a Trigger property on gameScreen). The page then
    // works out the "time to complete" and starts the cutscene music.
    const ULT_TRIGGER = "ultTrigger";
    // Where the page writes the "time to complete" text (a String property called timeText
    // on gameState, reached through gameScreen).
    const TIME_PROPERTY_PATH = "gameState/timeText";
    // The cutscene music, played by the page (put cutscene.mp3 next to index.html).
    const CUTSCENE_FILE = "cutscene.mp3";
    const CUTSCENE_VOLUME = 1;   // 0 to 1
    const SONG_ON_TAP = params.get("song") === "tap";
    const AC = window.AudioContext || window.webkitAudioContext;
    let songCtx = null, songGain = null, songBuffer = null, songSource = null, songVolumeProp = null;
    let songStartedAt = null, cutsceneBuffer = null, cutsceneGain = null, ultHandled = false;
    try {
      songCtx = new AC();
      songGain = songCtx.createGain();
      songGain.connect(songCtx.destination);
      fetch(SONG_FILE)
        .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.arrayBuffer(); })
        .then((data) => new Promise((ok, fail) => songCtx.decodeAudioData(data, ok, fail)))
        .then((buf) => { songBuffer = buf; if (DEBUG) console.log("song decoded:", Math.round(buf.duration) + "s"); updateStartText(); })
        .catch((e) => { console.error("song failed to load:", String(e)); errorBox.textContent = "Could not load " + SONG_FILE; });
      cutsceneGain = songCtx.createGain();
      cutsceneGain.gain.value = CUTSCENE_VOLUME;
      cutsceneGain.connect(songCtx.destination);
      fetch(CUTSCENE_FILE)
        .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.arrayBuffer(); })
        .then((data) => new Promise((ok, fail) => songCtx.decodeAudioData(data, ok, fail)))
        .then((buf) => { cutsceneBuffer = buf; if (DEBUG) console.log("cutscene song decoded:", Math.round(buf.duration) + "s"); })
        .catch((e) => { console.error("cutscene song failed to load:", String(e)); });
    } catch (e) {
      console.error("audio not available:", String(e));
    }

    function startSong() {
      if (!songCtx || !songBuffer || songSource) return;
      if (songCtx.state !== "running") songCtx.resume();
      songSource = songCtx.createBufferSource();
      songSource.buffer = songBuffer;
      songSource.connect(songGain);
      songSource.start(0, Math.max(0, SONG_OFFSET_SECONDS));
      songStartedAt = songCtx.currentTime;   // the audio clock stops while suspended, so paused time is not counted
      if (DEBUG) console.log("song started, audio state:", songCtx.state);
      requestAnimationFrame(volumeLoop);
    }

    // Copy the game's songVolume (0-100) onto the browser volume
    function volumeLoop() {
      try {
        if (!songVolumeProp && r && r.viewModelInstance) {
          songVolumeProp = r.viewModelInstance.number("songVolume");
          if (DEBUG) console.log("songVolume property:", songVolumeProp ? "found" : "NOT found");
        }
        if (songVolumeProp && typeof songVolumeProp.value === "number") {
          const v = Math.max(0, Math.min(1, songVolumeProp.value / 100));
          if (Math.abs(songGain.gain.value - v) > 0.001) songGain.gain.value = v;
        }
      } catch (e) {}
      requestAnimationFrame(volumeLoop);
    }

    // ---------- the ult: time to complete + cutscene music ----------
    function formatTime(totalSeconds) {
      const t = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(t / 60);
      const s = t % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function writeTimeText(text) {
      try {
        let prop = r.viewModelInstance.string(TIME_PROPERTY_PATH);
        if (!prop) {
          const parts = TIME_PROPERTY_PATH.split("/");
          const child = r.viewModelInstance.viewModel(parts[0]);
          prop = child && child.string(parts[1]);
        }
        if (prop) {
          prop.value = text;
          if (DEBUG) console.log("time to complete written:", text);
        } else if (DEBUG) {
          console.log("time property NOT found (" + TIME_PROPERTY_PATH + "). Check the String property timeText on gameState");
        }
      } catch (e) {
        console.log("could not write time text:", String(e));
      }
    }

    function startCutsceneAudio() {
      if (!songCtx || !cutsceneBuffer) { if (DEBUG) console.log("cutscene song not ready"); return; }
      if (songCtx.state !== "running") songCtx.resume();
      const src = songCtx.createBufferSource();
      src.buffer = cutsceneBuffer;
      src.connect(cutsceneGain);
      src.start(0);
      if (DEBUG) console.log("cutscene song started");
    }

    function onUlt() {
      if (ultHandled) return;          // only the first press counts
      ultHandled = true;
      const elapsed = (songCtx && songStartedAt !== null) ? (songCtx.currentTime - songStartedAt + SONG_OFFSET_SECONDS) : 0;
      if (DEBUG) console.log("ult trigger fired, song played for", Math.round(elapsed) + "s");
      writeTimeText(formatTime(elapsed));
      startCutsceneAudio();
    }

    // Phones: keep audio and game paused/resumed together when the tab is hidden
    document.addEventListener("visibilitychange", () => {
      if (!songCtx || !songSource) return;
      if (document.hidden) songCtx.suspend(); else songCtx.resume();
    });

    // ---------- load the Rive runtime, then start ----------
    let r = null;
    let ready = false;

    function resize() {
      if (!r) return;
      r.resizeDrawingSurfaceToCanvas(Math.min(window.devicePixelRatio || 1, DPR_CAP));
    }

    function startRive() {
      if (DEBUG) console.log("rive runtime loaded, version:", (window.rive && rive.RuntimeLoader && rive.RuntimeLoader.version) || "unknown");
      r = new rive.Rive({
        src: RIV_FILE,
        canvas: canvas,
        artboard: ARTBOARD,
        stateMachine: STATE_MACHINE,
        autoplay: false,
        autoBind: true,
        enableMultiTouch: MULTI_TOUCH,   // lets two (or more) fingers press different buttons at the same time
        // Diagnostic only: lists every asset in the file and whether it is embedded.
        // Returning false tells Rive to carry on and load it normally.
        assetLoader: (asset, bytes) => {
          if (DEBUG) {
            const kind = asset.isAudio ? "AUDIO" : asset.isImage ? "image" : asset.isFont ? "font" : "other";
            console.log("asset:", kind, JSON.stringify(asset.name), "| embedded bytes:", bytes ? bytes.length : 0, "| cdn:", asset.cdnUuid ? "yes" : "no");
          }
          return false;
        },
        layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
        onLoad: () => {
          ready = true;
          resize();
          if (DEBUG) console.log("riv file loaded");
          try {
            const trig = r.viewModelInstance.trigger(SONG_START_TRIGGER);
            if (trig) {
              trig.on(() => { if (DEBUG) console.log("song trigger fired"); startSong(); });
              if (DEBUG) console.log("song trigger property: found");
            } else if (DEBUG) {
              console.log("song trigger property: NOT found (add a Trigger called " + SONG_START_TRIGGER + " on gameScreen)");
            }
          } catch (e) {
            console.log("song trigger setup failed:", String(e));
          }
          try {
            const again = r.viewModelInstance.trigger(PLAY_AGAIN_TRIGGER);
            if (again) {
              again.on(() => {
                if (DEBUG) console.log("play again trigger fired - reloading");
                try { if (songCtx) songCtx.close(); } catch (e) {}   // stop the song straight away
                setTimeout(() => location.reload(), 50);
              });
              if (DEBUG) console.log("play again trigger property: found");
            } else if (DEBUG) {
              console.log("play again trigger property: NOT found (add a Trigger called " + PLAY_AGAIN_TRIGGER + " on gameScreen)");
            }
          } catch (e) {
            console.log("play again trigger setup failed:", String(e));
          }
          try {
            const ult = r.viewModelInstance.trigger(ULT_TRIGGER);
            if (ult) {
              ult.on(onUlt);
              if (DEBUG) console.log("ult trigger property: found");
            } else if (DEBUG) {
              console.log("ult trigger property: NOT found (add a Trigger called " + ULT_TRIGGER + " on gameScreen)");
            }
          } catch (e) {
            console.log("ult trigger setup failed:", String(e));
          }
          updateStartText();
        },
        onLoadError: (e) => {
          errorBox.textContent = "Could not load " + RIV_FILE + ". Check the file name and that it was uploaded next to index.html.";
          console.error("load error", e);
        },
      });

      // Events reported by the game (Report Event keyframes / listeners)
      r.on(rive.EventType.RiveEvent, (ev) => {
        const name = ev && ev.data && ev.data.name;
        if (DEBUG) console.log("rive event:", name);
        if (name === SONG_START_EVENT) startSong();
      });
    }

    function loadRuntime(which, onFail) {
      const s = document.createElement("script");
      s.src = "lib/" + which + "/rive.js";
      s.onload = () => {
        // Load the WebAssembly part of the runtime from this folder too (no internet needed).
        rive.RuntimeLoader.setWasmUrl("lib/" + which + "/rive.wasm");
        startRive();
      };
      s.onerror = onFail;
      document.head.appendChild(s);
    }

    loadRuntime(RENDERER, () => {
      if (RENDERER !== "canvas") {
        console.warn("could not load", RENDERER, "- falling back to canvas");
        loadRuntime("canvas", () => { errorBox.textContent = "Could not load the Rive runtime. Check your connection."; });
      } else {
        errorBox.textContent = "Could not load the Rive runtime. Check your connection.";
      }
    });

    const startHint = document.getElementById("startHint");
    function updateStartText() {
      if (ready && (songBuffer || !songCtx)) startHint.textContent = "Best in landscape";
    }

    startOverlay.addEventListener("pointerdown", () => {
      if (!ready || (songCtx && !songBuffer)) return;   // wait until everything has loaded
      startOverlay.classList.add("hidden");
      if (songCtx) songCtx.resume();                    // must happen inside the tap
      if (SONG_ON_TAP) startSong();
      r.play();
      if (DEBUG) console.log("play() called" + (SONG_ON_TAP ? "" : " - waiting for the " + SONG_START_TRIGGER + " trigger to start the song"));
    });

    window.addEventListener("resize", resize);
  </script>
</body>
</html>
