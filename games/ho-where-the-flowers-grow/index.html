  ctx.restore();

  ctx.save();
  ctx.translate(0, hover);
  ctx.fillStyle = THEME.creatures.bee.body;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 15, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = THEME.creatures.bee.stripe;
  for (const dx of [-6, 1, 8]) {
    ctx.fillRect(cx + dx, cy - 10, 4, 20);
  }
  ctx.beginPath();
  ctx.ellipse(cx, cy, 15, 11, 0, 0, Math.PI * 2);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = THEME.creatures.bee.stripe;
  for (const dx of [-6, 1, 8]) ctx.fillRect(cx + dx, cy - 12, 4, 24);
  ctx.restore();
  ctx.fillStyle = THEME.creatures.bee.eye;
  ctx.beginPath();
  ctx.arc(cx + 13, cy - 1, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// The swooping bird: a 2-frame wingbeat (wings up + talons out, then wings
// down), extracted from the 8x GIF down to its 256x160 pixel grid and drawn
// 1:1 around (cx, cy) at the GIF's own 0.25s per frame. Flipped to face
// `facing` and tilted by `angle` (positive = nose down) along its flight
// path; the art faces left, hence the flipped scale and negated rotation.
// Falls back to the old vector placeholder (facing +x, wingAngle swinging
// its wing) while the sprites load.
const birdFrames = [
  Object.assign(new Image(), { src: 'assets/hazards/bird-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/hazards/bird-frame1.png' }),
];
const BIRD_FRAME_MS = 250;
const BIRD_SPRITE_W = 256, BIRD_SPRITE_H = 160;

// `frame` is the hazard's own wing clock (see updateStomps).
function drawBird(cx, cy, facing, angle, wingAngle, frame) {
  const sprite = birdFrames[Math.floor(frame) % birdFrames.length];
  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(-facing, 1);
    ctx.rotate(-angle);
    ctx.drawImage(sprite, -BIRD_SPRITE_W / 2, -BIRD_SPRITE_H / 2, BIRD_SPRITE_W, BIRD_SPRITE_H);
    ctx.restore();
    return;
  }
  const c = THEME.hazards.bird;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(facing, 1);
  ctx.rotate(angle);
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = c.outline;

  ctx.fillStyle = c.wing; // tail
  ctx.beginPath();
  ctx.moveTo(-16, -2); ctx.lineTo(-30, -10); ctx.lineTo(-28, 6); ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.ellipse(0, 2, 19, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.belly;
  ctx.beginPath(); ctx.ellipse(4, 7, 12, 6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = c.body; // head
  ctx.beginPath(); ctx.arc(16, -8, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.beak;
  ctx.beginPath(); ctx.moveTo(23, -11); ctx.lineTo(33, -7); ctx.lineTo(23, -3); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.eye;
  ctx.beginPath(); ctx.arc(18, -10, 2, 0, Math.PI * 2); ctx.fill();

  ctx.save(); // wing, pivoting at the shoulder
  ctx.translate(2, -3);
  ctx.rotate(-0.2 + wingAngle);
  ctx.fillStyle = c.wing;
  ctx.beginPath(); ctx.ellipse(-10, 0, 14, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawPartner(n) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 400);

  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 36);
  glow.addColorStop(0, `rgba(${THEME.creatures.partner.glowRGB},${0.15 + 0.25 * pulse})`);
  glow.addColorStop(1, `rgba(${THEME.creatures.partner.glowRGB},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, 36, 0, Math.PI * 2);
  ctx.fill();

  const sprite = currentPartnerSprite();
  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.save();
    ctx.translate(cx, cy + PLAYER_SPRITE_Y_OFFSET);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, -PLAYER_SPRITE_SIZE / 2, -PLAYER_SPRITE_SIZE / 2, PLAYER_SPRITE_SIZE, PLAYER_SPRITE_SIZE);
    ctx.restore();
    return;
  }
  // fallback while the sprite loads (or if it fails to load)
  ctx.fillStyle = THEME.creatures.partner.body;
  ctx.fillRect(n.x, n.y, n.w, n.h);
  ctx.fillStyle = THEME.creatures.partner.accent;
  ctx.beginPath();
  ctx.arc(n.x + 6, cy, 3, 0, Math.PI * 2); // faces left, toward the player's approach
  ctx.fill();
  ctx.strokeStyle = THEME.creatures.partner.outline;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, n.y);
  ctx.lineTo(cx, n.y + n.h);
  ctx.stroke();
}

// A dark-outlined, light-filled label that stays legible whether it lands on
// bright ground or deep inside the Gloomy Soil Bed's darkness overlay — a
// plain dark fill (the old approach) vanished once the darkness fell on it.
// Prompts and hints over the world (Figma "prompts and hints"): Pixelta 12,
// dark navy with no outline, centred on x (world space). In the dark garden
// they turn light and wait in darkPrompts, drawn after the darkness and the
// colour wash so those don't dim them (see drawDarkPrompts).
const PROMPT_FONT = `12px ${FONT_BODY}`;
let darkPrompts = [];
function drawPromptText(text, x, y) {
  const { from, to, t } = zoneBlendAt(x);
  if (LEVELS[t < 0.5 ? from : to].isDarkZone) {
    darkPrompts.push({ text, x, y, alpha: ctx.globalAlpha });
    return;
  }
  fillPromptText(text, x, y, THEME.text.prompt);
}
function fillPromptText(text, x, y, color) {
  ctx.save();
  ctx.font = PROMPT_FONT;
  ctx.letterSpacing = '0px'; // normal spacing, as in the Figma
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}
function drawDarkPrompts() {
  ctx.save();
  ctx.translate(-cameraX, -cameraY);
  for (const p of darkPrompts) {
    ctx.globalAlpha = p.alpha;
    fillPromptText(p.text, p.x, p.y, THEME.text.promptOnDark);
  }
  ctx.restore();
  darkPrompts = [];
}

/* =========================================================================
   HOW-TO-PLAY HINTS — shown one at a time above the ladybug at the start of
   a new game (replacing the old Rules menu). Each fades out once the player
   has done it, and the next fades in. Talking (E), the minigames and the
   bird all prompt for themselves when they come up, so they aren't here.
   ========================================================================= */
const TUTORIAL_STEPS = [
  { text: 'Press  ← →  or  A D  to move',     done: t => t.walked > 140 },
  { text: 'Press  Space,  W  or  ↑  to jump', done: t => t.jumped },
  { text: 'Collect clovers for your lovebug', done: t => cloverCount > t.startClovers || t.stepTime > 6 },
];
const TUTORIAL_FADE_S = 0.35;
let tutorial = null;

function startTutorial() {
  tutorial = { step: 0, stepTime: 0, alpha: 0, leaving: false, walked: 0, jumped: false, startClovers: cloverCount };
}

function updateTutorial(dt) {
  const t = tutorial;
  if (!t) return;
  t.walked += Math.abs(player.vx) * dt;
  if (!player.onGround && player.vy < -100) t.jumped = true;
  t.stepTime += dt;
  if (!t.leaving && TUTORIAL_STEPS[t.step].done(t)) t.leaving = true;
  t.alpha = Math.max(0, Math.min(1, t.alpha + (t.leaving ? -dt : dt) / TUTORIAL_FADE_S));
  if (t.leaving && t.alpha === 0) {
    if (++t.step >= TUTORIAL_STEPS.length) { tutorial = null; return; }
    Object.assign(t, { leaving: false, stepTime: 0 });
  }
}

// world space, floating above the ladybug with a gentle bob
function drawTutorialHint() {
  if (!tutorial || gameState !== STATE.PLAYING || tutorial.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = tutorial.alpha;
  const bob = Math.sin(elapsed * 3) * 2;
  const text = TUTORIAL_STEPS[tutorial.step].text, font = PROMPT_FONT;
  // centred over the ladybug, but kept fully on screen (she starts right at the left edge)
  ctx.font = font;
  const half = ctx.measureText(text).width / 2 + 10;
  const x = Math.max(cameraX + half, Math.min(cameraX + CW - half, player.x + player.w / 2));
  drawPromptText(text, x, player.y - 48 + bob);
  ctx.restore();
}

function drawNpcs() {
  for (const n of npcs) {
    if (n.kind === 'snail') drawSnail(n);
    else if (n.kind === 'butterfly') drawButterfly(n);
    else if (n.kind === 'bee') drawBee(n);
    else if (n.kind === 'partner') drawPartner(n);

    if (!n.resolved && gameState === STATE.PLAYING && nearEntity(player, n, 60)) {
      // sprite-based NPCs are drawn taller than their hitbox (bottom-anchored),
      // so the prompt needs to clear the sprite's top, not just the hitbox's
      const spriteSize = { snail: SNAIL_SPRITE_SIZE, bee: BEE_SPRITE_SIZE, butterfly: BUTTERFLY_SPRITE_SIZE }[n.kind];
      const promptY = spriteSize ? (n.y + n.h - spriteSize - 6) : n.y - 12;
      drawPromptText('Press E to Talk', n.x + n.w / 2, promptY);
    }
  }
}

/* =========================================================================
   RENDERING
   ========================================================================= */
// Darkens the screen edges in the game's deep navy (the letterbox colour)
// rather than grey-black, easing in so the middle stays clear and the
// corners settle darkest. `strength` is the edge opacity, set per garden.
const VIGNETTE_RGB = '14,12,23';
function drawVignette(strength) {
  if (strength <= 0.005) return;
  const g = ctx.createRadialGradient(CW / 2, CH / 2, CH * 0.3, CW / 2, CH / 2, CH * 1.0);
  g.addColorStop(0, `rgba(${VIGNETTE_RGB},0)`);
  g.addColorStop(0.45, `rgba(${VIGNETTE_RGB},${strength * 0.3})`);
  g.addColorStop(1, `rgba(${VIGNETTE_RGB},${strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
}

// Only falls in the Gloomy Soil Bed (the final, darkest garden — see
// isDarkZone), and only until Scooter's lantern is lit: the
// world is too dark to see by except for a small, dim aura around the
// player. This isn't a wall — the player can still walk anywhere — but
// without light, going further is impractical rather than forbidden,
// which keeps the journey feeling like one continuous space instead of
// a level gated behind a locked door. `strength` (0..1) fades it.
function drawDarkness(strength) {
  if (strength <= 0.005) return;
  const psx = player.x - cameraX + player.w / 2;
  const psy = player.y - cameraY + player.h / 2;
  const g = ctx.createRadialGradient(psx, psy, 18, psx, psy, 230);
  g.addColorStop(0, THEME.darkness.inner);
  g.addColorStop(0.55, THEME.darkness.mid);
  g.addColorStop(1, THEME.darkness.outer);
  ctx.save();
  ctx.globalAlpha = strength;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
  ctx.restore();
}

// How dark it is right now (0..1). It creeps in across the same border
// window the palette and backdrop blend over — rather than snapping on the
// moment the player crosses into the Soil Bed — and lifts over a second
// once the snail's lantern is lit.
const DARKNESS_LIFT_MS = 1200;
function darknessStrength() {
  const { from, to, t } = zoneBlendAt(player.x);
  const darkAt = i => (LEVELS[i].isDarkZone ? 1 : 0);
  const zoneAmount = darkAt(from) + (darkAt(to) - darkAt(from)) * t;
  const snail = npcs.find(n => n.kind === 'snail');
  let lift = 1;
  if (snail && snail.resolved) {
    // a save that loads already-lit has no resolvedAt: it's simply light
    lift = snail.resolvedAt === undefined ? 0 : Math.max(0, 1 - (performance.now() - snail.resolvedAt) / DARKNESS_LIFT_MS);
  }
  return zoneAmount * lift;
}

/* =========================================================================
   SAVE / CONTINUE — a minimal localStorage save so "Continue" on the title
   screen means something. Deliberately not frame-by-frame: only written at
   discrete progress moments (collecting something, an NPC resolving, the
   checkpoint advancing), never every frame. buildWorld() always produces
   the same arrays in the same order from the same LEVELS data, so a saved
   game is just "rebuild fresh, then re-apply these collected/resolved
   flags by index" — no need to serialize the whole world.
   ========================================================================= */
const SAVE_KEY = 'ladybugGardenSave';

function saveGame() {
  try {
    const save = {
      checkpointX, checkpointY,
      cloverCollected: clovers.map(c => c.collected),
      petalCollected: petals.map(p => p.collected),
      loreCollected: loreSpots.map(s => s.collected),
      collectedClues: collectedClues.slice(),
      npcResolved: npcs.map(n => ({ kind: n.kind, x: n.x, resolved: n.resolved, talkedTo: !!n.talkedTo })),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {
    // localStorage can be unavailable (private browsing, storage full, etc.)
    // — degrade silently, Continue just won't be offered.
  }
}

function loadSavedGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

// Rebuilds a fresh world, then re-applies every saved collected/resolved
// flag onto it in the same deterministic order buildWorld() always
// produces them in.
function applySavedGame(save) {
  buildWorld();
  tutorial = null; // a continued game skips the how-to-play hints
  clovers.forEach((c, i) => { if (save.cloverCollected[i]) { c.collected = true; cloverCount++; } });
  petals.forEach((p, i) => { if (save.petalCollected[i]) { p.collected = true; petalsFound++; } });
  loreSpots.forEach((s, i) => { if (save.loreCollected[i]) s.collected = true; });
  collectedClues = save.collectedClues.slice();
  for (const savedNpc of save.npcResolved) {
    const npc = npcs.find(n => n.kind === savedNpc.kind && Math.abs(n.x - savedNpc.x) < 5);
    if (npc) { npc.resolved = savedNpc.resolved; npc.talkedTo = savedNpc.talkedTo; }
  }
  // buildWorld() always recreates the gate fresh — re-remove it if the
  // Queen was already resolved in the save.
  const bee = npcs.find(n => n.isQuestGiver);
  if (bee && bee.resolved) platforms = platforms.filter(p => !p.isGate);

  player.x = checkpointX = save.checkpointX;
  player.y = checkpointY = save.checkpointY;
  // the butterfly is saved as helped the moment its game is won, before the
  // flight — if the game was closed mid-flight, start on the far side
  // rather than stranded before a chasm nobody will carry her over again
  const carrier = npcs.find(n => n.special === 'carry' && n.resolved);
  if (carrier && player.x < carrier.carryTarget.x - 100 && player.x > carrier.x - 400) {
    player.x = checkpointX = carrier.carryTarget.x;
    player.y = checkpointY = carrier.carryTarget.y;
  }
  cameraX = Math.max(0, Math.min(worldWidth - CW, player.x + player.w / 2 - CW / 2));
  cameraY = Math.max(0, Math.min(LEVEL_HEIGHT - CH, player.y + player.h / 2 - CH / 2));
  gameState = STATE.PLAYING;
}

/* =========================================================================
   TITLE SCREEN — an interactive DOM overlay (not canvas) so hover states,
   keyboard navigation, and CSS animation are all free. See #titleScreen in
   the HTML/CSS. The canvas itself renders nothing while this is up; it's
   fully covered by the opaque overlay. The reference artwork is composited
   from separately-exported layers (background, gradients, logo, menu text,
   creature) so each can animate on its own — the creature is the one layer
   left fully static by design. The invisible hotspot buttons are positioned
   over the menu-text layers' own glyphs rather than redrawing them, and
   drive a glow on those same layers instead of a generic box.
   ========================================================================= */
const TITLE_TRANSITION_MS = 600; // must match #titleScreen's CSS transition duration
const titleScreenEl = document.getElementById('titleScreen');
const titleMenuItems = Array.from(document.querySelectorAll('.title-hotspot[data-action]'));
const titleParallaxEls = Array.from(document.querySelectorAll('.title-parallax'));
let titleMenuIndex = -1; // -1 = nothing highlighted (the yellow only shows on hover/selection)
let hasSavedGameAvailable = false;

// Both image layers (the quiet idle words and the yellow bracketed version)
// for a menu item.
function titleMenuLayersFor(hotspotEl) {
  const action = hotspotEl.dataset.action;
  return Array.from(document.querySelectorAll(`.title-menu-idle[data-action="${action}"], .title-menu-text[data-action="${action}"]`));
}

function enabledTitleMenuItems() {
  return titleMenuItems.filter(el => !el.classList.contains('is-disabled'));
}

function refreshTitleMenuSelection() {
  const selected = enabledTitleMenuItems()[titleMenuIndex];
  titleMenuItems.forEach(el => {
    const isSelected = el === selected;
    el.classList.toggle('is-selected', isSelected);
    titleMenuLayersFor(el).forEach(layer => layer.classList.toggle('is-selected', isSelected));
  });
}

// Background and logo drift a few px opposite the cursor; the creature and
// the menu-text layers are deliberately left out — the creature stays put,
// and the menu text never drifts off its hotspots.
function handleTitleParallax(e) {
  const rect = titleScreenEl.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
  const my = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
  titleParallaxEls.forEach(el => {
    const depth = parseFloat(el.dataset.depth) || 0;
    el.style.transform = `translate3d(${(-mx * depth).toFixed(2)}px, ${(-my * depth).toFixed(2)}px, 0)`;
  });
}
function resetTitleParallax() {
  titleParallaxEls.forEach(el => { el.style.transform = ''; });
}
titleScreenEl.addEventListener('mousemove', handleTitleParallax);
titleScreenEl.addEventListener('mouseleave', resetTitleParallax);

function moveTitleMenuSelection(delta) {
  const items = enabledTitleMenuItems();
  if (!items.length) return;
  sfx.tick();
  if (titleMenuIndex < 0) titleMenuIndex = delta > 0 ? 0 : items.length - 1;
  else titleMenuIndex = (titleMenuIndex + delta + items.length) % items.length;
  refreshTitleMenuSelection();
}

/* CUTSCENES — the intro (on New Game) and the outro (meeting Clover) are the
   animatics, run right here in the game's page (a page in a frame of its own
   doesn't load in the published game): cutscenes/<name>.js, loaded the first
   time it's needed, defines LadybugCutscenes.<name>(host), which fills `host`
   with the animatic and plays it. It's handed { run, sound, on } first, as
   window.__CUTSCENE__: `run` is the player's run (e.g. how many clovers they
   found), `sound` is the game's sfx (its captions talk in the characters'
   voices, and its shots play effects at set moments), and
   on('cutscene-done') comes once it's played out (its skip
   button, or S, jumps to its last card and plays that). The game waits in
   STATE.CUTSCENE meanwhile, under a cover that fades in to black and away
   again. Its last card holds a moment (CUTSCENE_HOLD_MS) before that; or,
   given an `endButton` label, it stays, and after the same moment a button
   with that label fades in under it (as the ending's "[ play again ]"), and
   the cutscene only ends when it's pressed (or Enter, E or Space). If the
   script can't load, `fallback` runs instead. */
// it fades in quickly (the #cutscene transition), and away more slowly, so
// the end of a cutscene settles gently into the game
const CUTSCENE_FADE_MS = 600, CUTSCENE_FADE_OUT_MS = 1800, CUTSCENE_HOLD_MS = 1500;
const cutsceneScripts = {};
function loadCutsceneScript(name) {
  return cutsceneScripts[name] || (cutsceneScripts[name] = new Promise((resolve, reject) => {
    const s = Object.assign(document.createElement('script'), { src: `cutscenes/${name}.js` });
    s.onload = () => (window.LadybugCutscenes?.[name] ? resolve() : reject(new Error(`${name} cutscene missing`)));
    s.onerror = () => { delete cutsceneScripts[name]; reject(new Error(`${name} cutscene didn't load`)); };
    document.head.appendChild(s);
  }));
}
function playCutscene(name, run, onDone, fallback = onDone, { endButton = null } = {}) {
  gameState = STATE.CUTSCENE;
  music.scene = name; // its own song (see MUSIC)
  for (const k in keys) keys[k] = false; // whatever was held to get here
  const host = Object.assign(document.createElement('div'), { id: 'cutscene' });
  document.body.appendChild(host);
  requestAnimationFrame(() => requestAnimationFrame(() => host.classList.add('is-shown')));
  let ended = false;
  const end = then => {
    if (ended) return;
    ended = true;
    window.__animaticRun = (window.__animaticRun || 0) + 1; // stops the cutscene's frame loop
    delete window.__CUTSCENE__;
    // its elements give up their ids as it fades, so a cutscene that starts
    // straight after (the ending's play again) finds its own, not these
    host.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    for (const k in keys) keys[k] = false;
    gameState = STATE.PLAYING;
    then();
    host.style.transition = `opacity ${CUTSCENE_FADE_OUT_MS}ms ease`;
    host.classList.remove('is-shown');
    setTimeout(() => host.remove(), CUTSCENE_FADE_OUT_MS);
  };
  // played out: hold the last card, then fade away, or wait for the end button
  const finished = () => setTimeout(() => {
    if (ended) return;
    if (!endButton) { end(onDone); return; }
    const stage = host.querySelector('.stage') || host;
    const button = Object.assign(document.createElement('button'), { type: 'button', className: 'end-button', textContent: `[ ${endButton} ]` });
    stage.appendChild(button);
    requestAnimationFrame(() => requestAnimationFrame(() => button.classList.add('is-shown')));
    const press = () => {
      window.removeEventListener('keydown', onKey, true);
      sfx.click();
      end(onDone);
    };
    const onKey = e => {
      if (['Enter', 'Space', 'KeyE'].includes(e.code)) { e.preventDefault(); press(); }
    };
    button.addEventListener('click', e => { e.stopPropagation(); press(); });
    window.addEventListener('keydown', onKey, true);
  }, CUTSCENE_HOLD_MS);
  loadCutsceneScript(name).then(() => {
    window.__CUTSCENE__ = { run, sound: sfx, on: type => { if (type === 'cutscene-done') finished(); } };
    window.LadybugCutscenes[name](host);
    host.addEventListener('click', e => { if (e.target.closest('.skip')) sfx.click(); }); // its skip button
  }).catch(err => {
    console.warn(err);
    end(fallback);
  });
}

// A fresh run (New Game, or "[ play again ]" after the ending): the garden
// reset, no save to continue, the intro, then the how-to-play hints.
function startNewGame() {
  buildWorld();
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  playCutscene('intro', null, startTutorial);
}

// New Game / Continue fade the artwork out first, then swap to gameplay —
// the "transition" asked for on starting a run.
function leaveTitleScreenThen(fn) {
  titleScreenEl.classList.add('is-leaving');
  setTimeout(() => {
    fn();
    hideTitleScreen();
    titleScreenEl.classList.remove('is-leaving');
  }, TITLE_TRANSITION_MS);
}

function activateTitleMenuItem(el) {
  if (!el || el.classList.contains('is-disabled') || gameState === STATE.CUTSCENE) return;
  ensureSound(); // (this click may be the very first, so the synthesizer is woken before the chirp)
  sfx.select();
  const action = el.dataset.action;
  if (action === 'new') {
    startNewGame(); // the intro fades in over the title, which goes once it's covered
    setTimeout(hideTitleScreen, CUTSCENE_FADE_MS);
  } else if (action === 'continue') {
    const save = loadSavedGame();
    if (!save) return;
    leaveTitleScreenThen(() => applySavedGame(save));
  }
}

/* TITLE PETALS — the gardens' falling petals (same pixel shapes, the
   Greenhouse's pinks and white, the same breeze with a gust now and then)
   drifting over the title art while it shows. Worked in the game's 800x450
   space on the #titlePetals canvas, scaled to its size. */
const titlePetalsEl = document.getElementById('titlePetals');
const titlePetalsCtx = titlePetalsEl.getContext('2d');
const titleWind = { x: WIND_BASE, gust: 0, t: 0, dur: 0, next: 4 };
let titlePetals = null, titleTime = 0;
function makeTitlePetals() {
  const r = (a, b) => a + Math.random() * (b - a);
  return Array.from({ length: 40 }, (_, i) => {
    const near = i >= 34, depth = near ? r(1.25, 1.5) : r(0.35, 0.95);
    return {
      x: r(-AMBIENT_WRAP, CW + AMBIENT_WRAP), y: r(-AMBIENT_WRAP, CH + AMBIENT_WRAP), depth, near,
      shape: i % PETAL_SHAPES.length, colors: AMBIENT_BY_SET.daylight.petalColors[Math.floor(Math.random() * 3)],
      fall: r(16, 30), sway: r(8, 20), swayF: r(0.6, 1.4), phase: r(0, Math.PI * 2), spin: r(0, Math.PI * 2), spinSpeed: r(1.2, 3),
      px: near ? 6 : depth > 0.7 ? 4 : 3, alpha: near ? 0.95 : 0.55 + 0.4 * depth, // a little chunkier than in the gardens, to match the title art's bigger pixels
    };
  });
}
function updateTitlePetals(dt) {
  if (titleScreenEl.hidden) return;
  titlePetals ||= makeTitlePetals();
  titleTime += dt;
  // the breeze, gusting every 8-15s as in the gardens
  const w = titleWind;
  w.next -= dt;
  if (w.next <= 0 && w.dur === 0) { w.dur = 2.4 + Math.random() * 1.4; w.t = 0; }
  if (w.dur > 0) {
    w.t += dt; w.gust = Math.sin(Math.PI * Math.min(1, w.t / w.dur));
    if (w.t >= w.dur) { w.dur = 0; w.gust = 0; w.next = 8 + Math.random() * 7; }
  }
  w.x = WIND_BASE + WIND_GUST * w.gust;
  // the canvas matches its size on screen
  const rect = titlePetalsEl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.round(rect.width * dpr)), ch = Math.max(1, Math.round(rect.height * dpr));
  if (titlePetalsEl.width !== cw || titlePetalsEl.height !== ch) { titlePetalsEl.width = cw; titlePetalsEl.height = ch; }
  const g = titlePetalsCtx, S = cw / CW;
  g.clearRect(0, 0, cw, ch);
  for (const p of titlePetals) {
    const d = Math.min(1.2, p.depth);
    p.x += (w.x + Math.sin(titleTime * p.swayF + p.phase) * p.sway) * d * dt;
    p.y += p.fall * d * (1 - 0.35 * w.gust) * dt;
    p.spin += (p.spinSpeed + 4 * w.gust) * dt;
    if (p.x > CW + AMBIENT_WRAP) p.x -= CW + 2 * AMBIENT_WRAP;
    if (p.y > CH + AMBIENT_WRAP) { p.y -= CH + 2 * AMBIENT_WRAP; p.x = Math.random() * CW; }
    // drawn like drawAmbientPetal: the highlight shows only while the petal faces us
    const mask = PETAL_SHAPES[p.shape], c = Math.cos(p.spin), mw = mask[0].length, mh = mask.length;
    const P = Math.max(1, Math.round(p.px * S)), sx = Math.round(p.x * S), sy = Math.round(p.y * S);
    g.globalAlpha = p.alpha;
    for (let row = 0; row < mh; row++) {
      for (let col = 0; col < mw; col++) {
        const chr = mask[row][col];
        if (chr === '.') continue;
        g.fillStyle = chr === 'o' && c > 0 ? p.colors[1] : p.colors[0];
        g.fillRect(sx + Math.round((col + 0.5 - mw / 2) * c - 0.5) * P, sy + (row - (mh >> 1)) * P, P, P);
      }
    }
  }
  g.globalAlpha = 1;
}

function hideTitleScreen() {
  titleScreenEl.hidden = true;
}

function showTitleScreen() {
  const save = loadSavedGame();
  hasSavedGameAvailable = !!save;
  const continueItem = titleMenuItems.find(el => el.dataset.action === 'continue');
  continueItem.classList.toggle('is-disabled', !hasSavedGameAvailable);
  titleMenuLayersFor(continueItem).forEach(layer => layer.classList.toggle('is-disabled', !hasSavedGameAvailable));
  titleMenuIndex = -1;
  refreshTitleMenuSelection();
  resetTitleParallax();
  titleScreenEl.hidden = false;
}

titleMenuItems.forEach(el => {
  el.addEventListener('click', () => activateTitleMenuItem(el));
  el.addEventListener('mouseenter', () => {
    if (el.classList.contains('is-disabled')) return;
    titleMenuIndex = enabledTitleMenuItems().indexOf(el);
    refreshTitleMenuSelection();
  });
  el.addEventListener('mouseleave', () => {
    titleMenuIndex = -1;
    refreshTitleMenuSelection();
  });
});
window.addEventListener('keydown', (e) => {
  if (titleScreenEl.hidden) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') moveTitleMenuSelection(-1);
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveTitleMenuSelection(1);
  else if (KEY_INTERACT.includes(e.code) || e.code === 'Enter' || e.code === 'Space') {
    e.preventDefault(); // Space also scrolls the page by default
    // with nothing highlighted yet, the first press just highlights the
    // first item, so nothing starts without being seen first
    if (titleMenuIndex < 0) moveTitleMenuSelection(1);
    else activateTitleMenuItem(enabledTitleMenuItems()[titleMenuIndex]);
  }
});

function render() {
  fitCanvasToDisplay();
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  if (gameState === STATE.TITLE) return;

  const palette = paletteAt(player.x);

  const grad = ctx.createLinearGradient(0, 0, 0, CH);
  grad.addColorStop(0, palette.skyTop);
  grad.addColorStop(1, palette.skyBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, CH);

  drawBackground();
  drawSkyTwinkles();
  drawAmbientPetals(false); // far petals, behind the ground and everyone

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  if (palette.pollen) drawPollen();

  for (const p of platforms) {
    if (usesGroundTexture(p)) {
      drawGroundSegment(p);
      continue;
    }
    if (p.isDrifter && isSteppingStone(p)) { // drifting platforms share the stepping-stone art
      drawSteppingStone(p);
      continue;
    }
    if (p.isGate && gatePostSprite.complete && gatePostSprite.naturalWidth > 0) {
      // the Queen's gate: the 7x130 post art at 2x fills each 14x260 bar, its vine
      // swaying (the two posts a little out of step)
      const frame = gatePostFrames ? gatePostFrames[Math.floor(performance.now() / GATE_VINE_FRAME_MS + p.x / 40) % 4] : gatePostSprite;
      ctx.drawImage(frame, p.x, p.y, p.w, p.h);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    if (!p.isGate) {
      ctx.fillStyle = p.isDrifter ? THEME.drifterEdge : palette.platformEdge;
      ctx.fillRect(p.x, p.y, p.w, 4);
    }
  }

  drawDecor();

  for (const c of clovers) {
    if (c.collected) continue;
    drawClover(c.x, c.y, c.x * 7);
  }

  // the Queen's flowers. Hidden until she's asked for them, then they grow
  // up out of the ground with a small overshoot (a save that's already
  // mid-quest shows them at full size).
  const petalsActive = isPetalQuestActive();
  const popT = Math.min(1, (performance.now() - petalsRevealedAt) / PETAL_POP_MS);
  const popScale = popT >= 1 ? 1 : 1 + 0.35 * Math.sin(Math.PI * popT) - (1 - popT) * (1 - popT);
  for (const p of petals) {
    if (p.collected || !petalsActive) continue;
    drawFlower(p.x, p.y, Math.max(0, popScale), p.x * 7);
  }

  // lore markers — become a collectible clue once inspected (see drawClueSpot)
  for (const s of loreSpots) {
    drawClueSpot(s);
    if (activeLoreSpot === s && gameState === STATE.PLAYING) {
      // she's standing on the spot, so clear her antennae too
      drawPromptText('Press E to Inspect', s.x + s.w / 2, Math.min(s.y - 10, player.y - 24));
    }
  }

  // swooping birds (the old stomp hazards): warnings and shadows here, the
  // birds themselves later, over the player and the bushes
  const birdsToDraw = [];
  // the red danger zone, with a safe gap at each bush
  const drawBirdWarning = (hz, alpha) => {
    ctx.fillStyle = `rgba(${THEME.hazards.stompRGB},${alpha})`;
    const gap = SHELTER_HALF + player.w / 2;
    let x = hz.x;
    for (const sx of shelterXs(hz).sort((a, b) => a - b)) {
      if (sx - gap > x) ctx.fillRect(x, hz.groundY - BIRD_DANGER_H, sx - gap - x, BIRD_DANGER_H);
      x = sx + gap;
    }
    if (hz.x + hz.w > x) ctx.fillRect(x, hz.groundY - BIRD_DANGER_H, hz.x + hz.w - x, BIRD_DANGER_H);
  };
  for (const hz of stompHazards) {
    // the red danger zone pulses faster and stronger as the bird closes in
    const warning = (0.35 + 0.25 * Math.sin(hz.pulse)) * (0.5 + 0.3 * hz.urgency);
    if (hz.state === 'telegraph') {
      drawBirdWarning(hz, warning);
    } else if (hz.state === 'swoop') {
      const t = 1 - hz.timer / hz.swoopDur;
      const pose = swoopPose(hz, t);
      // keep the warning up until the bird actually reaches the clearing
      if (pose.approach !== undefined && !pose.inColumn) drawBirdWarning(hz, warning);
      // its shadow tracks it along the ground, darker and bigger the lower it flies
      const near = 1 - pose.lift;
      ctx.fillStyle = `rgba(${THEME.hazards.bird.shadowRGB},${0.15 + 0.45 * near})`;
      ctx.beginPath();
      ctx.ellipse(pose.x, hz.groundY - 2, 20 + 70 * near, 4 + 5 * near, 0, 0, Math.PI * 2);
      ctx.fill();
      // tilt along the flight path (nose down on the dive, up on the climb),
      // measured in the bird's own facing direction; kept fairly gentle, since
      // a sprite this big looks harsh rotated steeply
      const before = swoopPose(hz, Math.max(0, t - 0.02));
      const after = swoopPose(hz, Math.min(1, t + 0.02));
      const tilt = Math.max(-0.45, Math.min(0.6,
        Math.atan2(after.y - before.y, (after.x - before.x) * hz.swoopDir)));
      // (the placeholder's wing: tucked on the dive, flapping otherwise)
      const wing = tilt > 0.25 ? -0.9 : Math.sin(performance.now() / 45) * 0.9;
      birdsToDraw.push(() => drawBird(pose.x, pose.y, hz.swoopDir, tilt, wing, hz.flap));
    }
  }

  drawNpcs();

  drawShelters('back');
  drawPlayerSprite();
  drawShelters('front'); // the bush she's hiding in, in front of her
  for (const draw of birdsToDraw) draw();
  drawShelterPrompts();
  drawTutorialHint();

  ctx.restore();

  drawLightRays();
  drawAmbientPetals(true); // a few big near petals drifting past in front

  // a soft color-wash tying the whole frame into the current blended mood,
  // so platforms/ground read as part of the gradient too, not just the sky
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = palette.skyTop;
  ctx.fillRect(0, 0, CW, CH);
  ctx.restore();

  // the zone vignette hands off to the lantern darkness as it fades in
  const dark = darknessStrength();
  drawVignette(palette.vignette * (1 - dark));
  drawDarkness(dark);
  drawFireflies();
  drawDarkPrompts(); // the dark garden's prompts, on top so they stay bright

  drawCounter();

  if (gameState === STATE.DIALOGUE) renderDialogue();
  if (gameState === STATE.MINIGAME) renderActiveMinigame();
  const overFade = gameOverFade();
  if (overFade) renderGameOver(overFade);
}

/* The counter (Figma "clover counter"), top left, drawn 1:1 from that 95x71
   frame: a row each for clovers, clues and petals, with an icon, a Pixelta 12
   label and the count. The icons are shrunk from their art, so they're
   smoothed (dropping pixels at this scale would break their 1px outlines). */
const counterIcons = {
  clover: Object.assign(new Image(), { src: 'assets/ui/clover-icon.png' }),
  clue: Object.assign(new Image(), { src: 'assets/ui/clue-envelope.png' }),
};
const COUNTER_LAYOUT = {
  x: 8, y: 8, scale: 1, // the whole frame, at the mockup's size
  w: 95, h: 71, hNoPetals: 51, bg: 'rgba(162,220,235,0.26)', color: '#080b3c',
  labelX: 34.6, countX: 76,
  rows: [ // icon box (x, y, size) and the text's top edge, all from the frame's corner
    { label: 'Clovers', icon: { x: 0, y: 2.7, size: 28.5 },   textY: 10.7, countY: 12.4 },
    { label: 'Clues',   icon: { x: 5.6, y: 26.8, size: 17.7 }, textY: 30.0, countY: 31.1 },
    { label: 'Petals',  icon: { x: 5.6, y: 46.3, size: 18.2 }, textY: 50.8, countY: 50.8 },
  ],
};
// once Duchess's flower quest is done, the petals row goes
function isPetalQuestDone() {
  const bee = npcs.find(n => n.isQuestGiver);
  return !!bee && bee.resolved;
}
function drawCounter() {
  const L = COUNTER_LAYOUT;
  const counts = [cloverCount, collectedClues.length, petalsFound];
  const icons = [counterIcons.clover, counterIcons.clue, flowerFrames[Math.floor(performance.now() / FLOWER_FRAME_MS) % flowerFrames.length]];
  const rows = isPetalQuestDone() ? L.rows.slice(0, 2) : L.rows;
  ctx.save();
  ctx.translate(L.x, L.y);
  ctx.scale(L.scale, L.scale);
  ctx.fillStyle = L.bg;
  ctx.fillRect(0, 0, L.w, rows.length < L.rows.length ? L.hNoPetals : L.h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.font = `12px ${FONT_BODY}`;
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  // navy as in the Figma, cream in the dark garden (like the prompts)
  const { from, to, t } = zoneBlendAt(player.x);
  ctx.fillStyle = LEVELS[t < 0.5 ? from : to].isDarkZone ? THEME.text.promptOnDark : L.color;
  rows.forEach((row, i) => {
    const im = icons[i], b = row.icon;
    if (im && im.complete && im.naturalWidth > 0) ctx.drawImage(im, b.x, b.y, b.size, b.size);
    ctx.fillText(row.label, L.labelX, row.textY + 1);
    ctx.fillText(String(counts[i]), L.countX, row.countY + 1);
  });
  ctx.restore();
}

/* The game-over screens, from the "snatched by a hungry bird!" mockup in
   Figma. That frame is 744x419, so every number is its position there scaled
   by 800/744. The game behind is blurred, a coloured glow closes in from the
   edges, and the title, hint and "[ try again ]" button sit in the middle.
   Each way of losing has its own colours (GAME_OVER_COLORS). */
const BIRD_GAME_OVER_MESSAGE = 'Snatched by a hungry bird!';
const PIT_GAME_OVER_MESSAGE = 'Lost in the underbrush!';
const GAME_OVER_LAYOUT = {
  blur: 5,                                   // px, the mockup's layer blur
  edge: { rx: 571, ry: 321 },                // the glow: clear in the middle, full colour by the edges of this ellipse
  title: { y: 156, lineH: 45.7, w: 279, size: 43 }, // centre of the first of its two lines
  hint: { y: 251, size: 16, color: '#fff3d6' },
  dim: 'rgba(12,10,22,0.72)', // darkens the blurred game so the text stands out
  // the button, and how it lights up under the mouse
  button: { x: 305.2, y: 281.1, w: 188.6, h: 29.7, fill: 'rgba(255,243,214,0.14)', hoverFill: 'rgba(217,255,0,0.24)', hoverRing: '#d9ff00', hoverText: '#f4ffb0' },
};
const GAME_OVER_COLORS = {
  [BIRD_GAME_OVER_MESSAGE]: { edge: '65,0,1', title: '#ff4545' },     // the mockup: danger red
  [PIT_GAME_OVER_MESSAGE]: { edge: '10,40,18', title: '#62d85c' },    // deep mossy green, a leafy green title
};
const gameOverColors = () => GAME_OVER_COLORS[gameOverMessage] || GAME_OVER_COLORS[BIRD_GAME_OVER_MESSAGE];

// The screen eases in rather than cutting: the blur, dim and glow build up
// over GAME_OVER_FADE_IN_S, the words following a beat behind; "try again"
// eases it all back out over the game as it carries on.
const GAME_OVER_FADE_IN_S = 0.9, GAME_OVER_TEXT_DELAY_S = 0.3, GAME_OVER_TEXT_IN_S = 0.6, GAME_OVER_FADE_OUT_S = 0.6;
let gameOverAt = -Infinity, gameOverLeftAt = -Infinity;
const easeInOut01 = k => { k = Math.min(1, Math.max(0, k)); return k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k); };

// How far in the game-over screen is ({ bg, text }, 0..1 each), or null when it's not showing.
function gameOverFade() {
  const now = performance.now() / 1000;
  if (gameState === STATE.GAME_OVER) {
    const t = now - gameOverAt;
    return { bg: easeInOut01(t / GAME_OVER_FADE_IN_S), text: easeInOut01((t - GAME_OVER_TEXT_DELAY_S) / GAME_OVER_TEXT_IN_S) };
  }
  const out = (now - gameOverLeftAt) / GAME_OVER_FADE_OUT_S;
  if (gameState !== STATE.PLAYING || out >= 1) return null;
  const k = 1 - easeInOut01(out);
  return { bg: k, text: k * k }; // the words go a little quicker than the backdrop
}

function renderGameOver({ bg, text }) {
  const G = GAME_OVER_LAYOUT, C = gameOverColors();
  ctx.save();
  // blur everything drawn so far (the world and the HUD), where the browser can
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if ('filter' in ctx && bg > 0.01) {
    const snap = renderGameOver.snap || (renderGameOver.snap = document.createElement('canvas'));
    if (snap.width !== canvas.width || snap.height !== canvas.height) { snap.width = canvas.width; snap.height = canvas.height; }
    snap.getContext('2d').drawImage(canvas, 0, 0);
    ctx.filter = `blur(${G.blur * bg * renderScale}px)`;
    ctx.drawImage(snap, 0, 0);
    ctx.filter = 'none';
  }
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.globalAlpha = bg;
  ctx.fillStyle = G.dim;
  ctx.fillRect(0, 0, CW, CH);
  // the edge glow, an ellipse the shape of the screen
  ctx.save();
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(G.edge.rx / G.edge.ry, 1);
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, G.edge.ry);
  glow.addColorStop(0, `rgba(${C.edge},0)`); // fading from its own colour, not white, so the middle doesn't wash out pale
  glow.addColorStop(1, `rgba(${C.edge},1)`);
  ctx.fillStyle = glow;
  ctx.fillRect(-CW, -CH, CW * 2, CH * 2);
  ctx.restore();

  ctx.globalAlpha = text;
  ctx.letterSpacing = '0px'; // the mockup's text is set with no extra spacing
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.title;
  ctx.font = `${G.title.size}px ${FONT_HEADING}`;
  // a title that fits on one line sits centred in the space two lines take
  const oneLine = ctx.measureText(gameOverMessage).width <= G.title.w;
  wrapText(gameOverMessage, CW / 2, G.title.y + (oneLine ? G.title.lineH / 2 : 0), G.title.w, G.title.lineH);
  ctx.fillStyle = G.hint.color;
  ctx.font = `${G.hint.size}px ${FONT_BODY}`;
  ctx.fillText('Press R or click below to try again.', CW / 2, G.hint.y);
  const b = G.button, hover = gameState === STATE.GAME_OVER && !!lastMouse && inRect(lastMouse[0], lastMouse[1], b);
  ctx.fillStyle = hover ? b.hoverFill : b.fill;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  if (hover) { ctx.strokeStyle = b.hoverRing; ctx.lineWidth = 1.5; ctx.strokeRect(b.x + 0.75, b.y + 0.75, b.w - 1.5, b.h - 1.5); }
  ctx.fillStyle = hover ? b.hoverText : THEME.dialogue.text;
  ctx.font = `16px 'Venice Classic', ${FONT_BODY}`;
  ctx.fillText('[ try again ]', b.x + b.w / 2, b.y + b.h / 2);
  ctx.restore();
}

function handleClick(mx, my) {
  if (gameState === STATE.TITLE) return; // title interaction is DOM-driven now, not canvas clicks
  if (gameState === STATE.MINIGAME && activeMinigame === 'cards') {
    handleCardsClick(mx, my);
    return;
  }
  if (gameState === STATE.MINIGAME && activeMinigame === 'lantern') {
    handleLanternClick(mx, my);
    return;
  }
  if (gameState === STATE.GAME_OVER) {
    const r = GAME_OVER_LAYOUT.button;
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
      handlePrimaryAction();
    }
  }
}

/* =========================================================================
   MAIN UPDATE DISPATCH
   ========================================================================= */
function update(dt) {
  if (gameState !== STATE.TITLE) updateAmbient(dt); // the garden keeps moving through dialogue and minigames too
  if (gameState === STATE.TITLE) {
    // no-op: the title screen is a DOM overlay now, driven by its own
    // click/keydown listeners rather than the per-frame game loop
  } else if (gameState === STATE.PLAYING) {
    if (isCarryHoldingPlayer()) {
      updateCarry(dt); // being flown across — no control until set down
    } else {
      if (carry) updateCarry(dt); // the butterfly flying home while she walks on
      if (player.graceTimer > 0) player.graceTimer = Math.max(0, player.graceTimer - dt);
      updatePlayerPhysics(dt);
      updateDrifters(dt);
      updateStomps(dt);
      updateCollectibles();
      updateInteractables();
      updateTutorial(dt);
      // A continuously-rolling checkpoint — no hard level restarts, just
      // pick up again close to wherever you fell. Gated on gameState still
      // being PLAYING (not just player.onGround): a hazard hit earlier in
      // this same update() call can flip us to GAME_OVER without stopping
      // the rest of this frame from running, and without this check the
      // checkpoint would capture the exact death position — respawning
      // the player right back into a hazard that's frozen mid-attack,
      // causing an instant re-death loop that looks like "restart is broken".
      if (gameState === STATE.PLAYING && player.onGround) {
        if (checkpointX !== player.x || checkpointY !== player.y) {
          checkpointX = player.x;
          checkpointY = player.y;
          saveGame(); // only on actual change — not every grounded frame
        }
      }
    }
    updateCamera(dt);
    updatePollen(dt);
  } else if (gameState === STATE.DIALOGUE) {
    updateDialogue(dt);
  } else if (gameState === STATE.MINIGAME) {
    updateActiveMinigame(dt);
  } else if (gameState === STATE.GAME_OVER) {
    if (anyJustPressed(['KeyR', 'r', 'R'])) handlePrimaryAction();
  }
}

/* =========================================================================
   GAME LOOP
   ========================================================================= */
let lastTime = performance.now();
/* =========================================================================
   MUSIC — three songs, one playing at a time:
   - the game's: the forest ambience (assets/audio/forest-ambience.mp3, 45s),
     under the title and the gardens. In the gardens another song is layered
     over it: the forest song (assets/audio/forest-song.mp3) in the first two,
     and in the dark Gloomy Soil Bed assets/audio/soil-bed-house-in-a-forest.mp3
     (a 25s loop);
   - the intro's: the forest song (assets/audio/forest-song.mp3, 81s);
   - the outro's, for the reunion: assets/audio/reunion-salt-marsh-birds.mp3 (71s).
   A cutscene's song starts from the top each time it plays. As a cutscene
   starts the game's song fades out (and waits, paused, to pick up where it
   left off) and the cutscene's fades in, and the other way round after.
   Browsers only allow sound after a click or key press, so the game's
   song fades in with the first one. A plain loop leaves a little gap where an
   MP3 restarts, so each song runs as two copies taking turns: as one nears
   its end a fresh one starts and they crossfade. M or the speaker button
   mutes (a quick fade), and that's remembered. All the music dips to 30%
   during the lantern game, whose colours each sing a note. Sound pauses while
   the tab is hidden.
   ========================================================================= */
const MUSIC_FADE_IN_S = 2.5, MUSIC_FADE_OUT_S = 1, MUSIC_CROSSFADE_S = 3, MUSIC_MUTE_FADE_S = 0.4;
const MUTE_KEY = 'ladybug-garden-muted';
const muteButtonEl = document.getElementById('muteButton');
// `volume` evens out the recordings' loudness: the ambience is very soft (it
// peaks around 2% of full scale), the intro's song about ten times louder and
// the reunion's about three times louder again; the cutscene songs come out
// at the same level, a little above the ambience
// (each song's audio is only fetched the first time it plays). `crossfade`
// is how long each loop overlaps the next: a long blend for the recordings,
// just a moment for a piece written to loop seamlessly
const makeSong = (src, volume, crossfade = MUSIC_CROSSFADE_S) => ({ src, volume, crossfade, tracks: [null, null], fades: [0, 0], current: 0, level: 0, playing: false });
const songs = {
  game: makeSong('assets/audio/forest-ambience.mp3', 0.9),
  intro: makeSong('assets/audio/forest-song.mp3', 0.25),
  outro: makeSong('assets/audio/reunion-salt-marsh-birds.mp3', 0.075),
  // layered over the game's song (see updateMusic): the forest song (the
  // intro's too) in the first two gardens, and in the Gloomy Soil Bed a 25s
  // loop, about 40 times louder than the ambience
  gardens: makeSong('assets/audio/forest-song.mp3', 0.25),
  soilBed: makeSong('assets/audio/soil-bed-house-in-a-forest.mp3', 0.06, 0.12),
};
// while the lantern game plays, all the music drops to this share, so its colour notes stand out
const MUSIC_LANTERN_DUCK = 0.3, MUSIC_DUCK_FADE_S = 0.6;
const music = {
  scene: null,       // the cutscene playing ('intro' or 'outro'), set by playCutscene
  duck: 1,           // all the music's share: dips for the lantern game
  started: false,    // the first click or key press has let sound play
  quickFade: false,  // a mute was just toggled: fade fast
  muted: (() => { try { return localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { return false; } })(),
};

// Play a song: carrying on where it paused, or from the top on a fresh copy
// (a new copy rather than rewinding, since not every server lets audio seek).
function playSong(song, fromTop) {
  if (fromTop || !song.tracks[song.current]) {
    song.tracks[song.current] = Object.assign(new Audio(song.src), { volume: 0 });
    song.tracks[1 - song.current] = null;
    song.fades = [0, 0];
  }
  const t = song.tracks[song.current];
  t.volume = 0;
  song.fades[song.current] = 1;
  song.playing = true;
  return t.play();
}

function startMusic() {
  if (music.started) return;
  playSong(songs.game, false).then(() => { music.started = true; }).catch(() => { songs.game.playing = false; /* not allowed yet: the next click or key tries again */ });
}

// mutes the music and the sound effects together
function setMuted(muted) {
  music.muted = muted;
  music.quickFade = true;
  if (sound.ctx) { // effects stop with a quick fade, and come back at once
    const g = sound.out.gain, t = sound.ctx.currentTime;
    g.cancelScheduledValues(t);
    if (muted) g.setTargetAtTime(0, t, 0.05); else g.setValueAtTime(SFX_VOLUME, t);
  }
  muteButtonEl.classList.toggle('is-muted', muted);
  muteButtonEl.setAttribute('aria-label', muted ? 'Unmute sound (M)' : 'Mute sound (M)');
  muteButtonEl.title = muteButtonEl.getAttribute('aria-label');
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) { /* ignore */ }
}

// One song's frame: its level eases toward `amount` (0..1, all of it unless
// given) while it's `wanted` (and not muted), slowly in and a little quicker
// out, quickly either way for a mute; once it's faded out and not wanted it
// pauses. Near the end of a loop it hands over to a fresh copy from the top.
function updateSong(song, wanted, dt, amount = 1) {
  const target = song.target = wanted && !music.muted ? amount : 0;
  const fadeS = music.quickFade ? MUSIC_MUTE_FADE_S : target > song.level ? MUSIC_FADE_IN_S : MUSIC_FADE_OUT_S;
  song.level = target > song.level ? Math.min(target, song.level + dt / fadeS) : Math.max(target, song.level - dt / fadeS);
  if (!song.playing) return;
  if (!wanted && song.level === 0) {
    song.tracks.forEach(t => t && t.pause());
    song.playing = false;
    return;
  }
  const cur = song.tracks[song.current];
  // a couple of seconds before the hand-over, a fresh copy starts loading, so
  // it's ready to play the moment it's needed
  if (cur.duration && !song.spare && cur.currentTime >= cur.duration - song.crossfade - 2) {
    song.spare = Object.assign(new Audio(song.src), { preload: 'auto', volume: 0 });
    song.spare.load();
  }
  if (cur.duration && cur.currentTime >= cur.duration - song.crossfade && song.fades[1 - song.current] === 0) {
    song.current = 1 - song.current;
    const next = song.tracks[song.current] = song.spare || Object.assign(new Audio(song.src), { volume: 0 });
    song.spare = null;
    next.play().catch(() => {});
  }
  const step = dt / song.crossfade;
  song.tracks.forEach((t, i) => {
    if (!t) return;
    song.fades[i] = i === song.current ? Math.min(1, song.fades[i] + step) : Math.max(0, song.fades[i] - step);
    if (i !== song.current && song.fades[i] === 0 && !t.paused) t.pause();
    t.volume = song.volume * song.level * song.fades[i] * music.duck;
  });
}

function updateMusic(dt) {
  if (!music.started) return;
  // the song that should be playing: the cutscene's while one plays, else the game's
  const want = gameState === STATE.CUTSCENE && songs[music.scene] ? music.scene : 'game';
  const song = songs[want];
  if (!song.playing) playSong(song, want !== 'game').catch(() => {}); // a cutscene's from the top; the game's back where it paused
  // In the gardens a second song plays over the game's: the forest song in
  // the first two, the Soil Bed's own in the darker third. They hand over as
  // she crosses into the Soil Bed (over the same border stretch the colours
  // blend across), and back again if she walks out. Each picks up where it paused.
  const { from, to, t } = zoneBlendAt(player.x);
  const dark = i => (LEVELS[i].isDarkZone ? 1 : 0);
  const inGardens = want === 'game' && gameState !== STATE.TITLE;
  const soilBedShare = dark(from) + (dark(to) - dark(from)) * t;
  const layers = { gardens: inGardens ? 1 - soilBedShare : 0, soilBed: inGardens ? soilBedShare : 0 };
  for (const [name, amount] of Object.entries(layers)) {
    if (amount > 0 && !songs[name].playing) playSong(songs[name], false).catch(() => {});
  }
  // the lantern game's dip
  const duckTarget = gameState === STATE.MINIGAME && activeMinigame === 'lantern' ? MUSIC_LANTERN_DUCK : 1;
  const duckStep = dt * (1 - MUSIC_LANTERN_DUCK) / MUSIC_DUCK_FADE_S;
  music.duck = duckTarget < music.duck ? Math.max(duckTarget, music.duck - duckStep) : Math.min(duckTarget, music.duck + duckStep);
  for (const [name, s] of Object.entries(songs)) {
    if (name in layers) updateSong(s, layers[name] > 0, dt, layers[name]);
    else updateSong(s, name === want, dt);
  }
  if (Object.values(songs).every(s => s.level === s.target)) music.quickFade = false;
}

/* =========================================================================
   SOUND EFFECTS — all made in code with the browser's synthesizer (Web
   Audio), no files: little tones (an oscillator with a quick fade in and
   out) and puffs of filtered noise, put together into blips, chimes and
   rustles. Like the music they can only start after a click or key press,
   and the mute button (M) silences them too. sfx.<name>() plays one.
   ========================================================================= */
const SFX_VOLUME = 0.4; // set so the effects sit a little above the (soft) forest ambience
const sound = { ctx: null, out: null, noise: null };

// the synthesizer, made on the first click or key press (and woken again if the browser put it to sleep)
function ensureSound() {
  if (!sound.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    sound.ctx = new AC();
    sound.out = sound.ctx.createGain();
    sound.out.gain.value = music.muted ? 0 : SFX_VOLUME;
    sound.out.connect(sound.ctx.destination);
    // a second of white noise, reused for every rustle and whoosh
    const n = sound.ctx.createBuffer(1, sound.ctx.sampleRate, sound.ctx.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    sound.noise = n;
  }
  if (sound.ctx.state === 'suspended') sound.ctx.resume().catch(() => {});
  return sound.ctx;
}
const soundReady = () => !!sound.ctx && sound.ctx.state === 'running' && !music.muted;

// One note: `type` wave from `freq` (sliding to `to`, if given) for `dur`
// seconds, `vol` loud, starting `at` seconds from now, with an optional
// wobble (vib: [rate Hz, depth Hz]). It holds at full volume for `hold`
// seconds before fading, which gives short notes some body.
function tone({ freq, to, dur = 0.08, type = 'square', vol = 0.08, at = 0, attack = 0.005, hold = 0, vib }) {
  if (!soundReady()) return;
  const c = sound.ctx, t0 = c.currentTime + at;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  if (vib) {
    const lfo = c.createOscillator(), depth = c.createGain();
    lfo.frequency.value = vib[0]; depth.gain.value = vib[1];
    lfo.connect(depth).connect(osc.frequency);
    lfo.start(t0); lfo.stop(t0 + dur + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  if (hold > 0) g.gain.setValueAtTime(vol, t0 + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(sound.out);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
// A puff of noise through a band filter centred on `freq` (sliding to `to`).
function hiss({ freq = 1500, to, q = 1.2, dur = 0.15, vol = 0.2, at = 0, attack = 0.02 }) {
  if (!soundReady()) return;
  const c = sound.ctx, t0 = c.currentTime + at;
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = sound.noise;
  f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t0);
  if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(sound.out);
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
}
// notes one after another, `step` seconds apart
const notes = (freqs, step, opts) => freqs.forEach((freq, i) => tone({ ...opts, freq, at: (opts.at || 0) + i * step }));
const semis = (f, n) => f * Math.pow(2, n / 12);

// Each speaker's voice: a wave, a pitch, how loud, how long each blip lasts
// (held at full volume for `hold` of that), and the shortest gap between
// blips (so slow talkers blip less often).
const VOICES = {
  'You':                 { type: 'square',   freq: 780,  vol: 0.08, dur: 0.075, hold: 0.03,  gap: 0.065 },             // Bluebell
  '???':                 { type: 'triangle', freq: 1050, vol: 0.18, dur: 0.08,  hold: 0.035, gap: 0.07 },              // Clover
  'Duchess, the Queen Bee':     { type: 'sawtooth', freq: 345,  vol: 0.07, dur: 0.1,   hold: 0.045, gap: 0.08, vib: [55, 27] },
  'Flutter, the Wandering Butterfly': { type: 'sine',     freq: 1470, vol: 0.18, dur: 0.08,  hold: 0.035, gap: 0.07 },
  'Scooter, the Hermit Snail':        { type: 'triangle', freq: 285,  vol: 0.23, dur: 0.12,  hold: 0.05,  gap: 0.12 },
};
const TALK_STEPS = [0, 2, 3, 5, -2, 7]; // semitones each blip can wander by, for a chatty sing-song
let lastTalkAt = 0;

const sfx = {
  // a talking blip for a character typed out in dialogue (letters and numbers only, spaced out)
  talk(speaker, ch) {
    if (!/[A-Za-z0-9]/.test(ch) || !soundReady()) return;
    const v = VOICES[speaker] || VOICES.You, now = sound.ctx.currentTime;
    if (now - lastTalkAt < v.gap) return;
    lastTalkAt = now;
    tone({ ...v, freq: semis(v.freq, TALK_STEPS[Math.floor(Math.random() * TALK_STEPS.length)]) });
  },
  tick()    { tone({ freq: 1250, dur: 0.03, vol: 0.03, type: 'square' }); },           // menus, the next dialogue line
  click()   { tone({ freq: 760, to: 1140, dur: 0.07, type: 'triangle', vol: 0.22, hold: 0.015 }); hiss({ freq: 4000, dur: 0.03, vol: 0.08, attack: 0.003 }); }, // a button pressed
  select()  { tone({ freq: 660, to: 990, dur: 0.09, vol: 0.06 }); },                  // choosing a menu item
  jump()    { tone({ freq: 330, to: 660, dur: 0.1, vol: 0.05 }); },
  clover()  { notes([1175, 1568], 0.06, { type: 'triangle', dur: 0.1, vol: 0.12 }); tone({ freq: 2349, type: 'sine', dur: 0.15, vol: 0.05, at: 0.11 }); },
  petal()   { notes([784, 988, 1175], 0.05, { type: 'sine', dur: 0.12, vol: 0.1 }); },
  paper()   { hiss({ freq: 2600, to: 1800, q: 0.8, dur: 0.18, vol: 0.14 }); tone({ freq: 988, type: 'sine', dur: 0.18, vol: 0.06, at: 0.1 }); },
  rustle()  { hiss({ freq: 1100, to: 2600, q: 0.9, dur: 0.24, vol: 0.28 }); hiss({ freq: 1800, to: 900, q: 1.4, dur: 0.16, vol: 0.16, at: 0.08 }); },
  birdCall(){ tone({ freq: 1150, to: 820, dur: 0.12, vol: 0.05, vib: [30, 40] }); tone({ freq: 1150, to: 760, dur: 0.16, vol: 0.05, vib: [30, 40], at: 0.2 }); },
  whoosh()  { hiss({ freq: 300, to: 2200, q: 0.7, dur: 0.75, vol: 0.4, attack: 0.25 }); },
  caught()  { notes([523, 440, 349, 262], 0.15, { type: 'triangle', dur: 0.24, vol: 0.12 }); },
  retry()   { notes([392, 523, 659], 0.07, { type: 'triangle', dur: 0.12, vol: 0.1 }); },
  // the lantern game: a note per colour, a fizzle for a wrong one, chimes for a round and the win
  lanternNote(i) { tone({ freq: [523, 659, 784, 988, 1175, 1319][i % 6], type: 'triangle', dur: 0.32, vol: 0.13 }); },
  fizzle()  { tone({ freq: 196, to: 110, dur: 0.35, vol: 0.06, type: 'sawtooth' }); hiss({ freq: 600, to: 250, dur: 0.35, vol: 0.12 }); },
  roundWon(){ notes([659, 784, 988], 0.07, { type: 'triangle', dur: 0.14, vol: 0.1 }); },
  fanfare() { notes([523, 659, 784, 1047, 1319], 0.08, { type: 'triangle', dur: 0.2, vol: 0.12 }); tone({ freq: 1568, type: 'sine', dur: 0.5, vol: 0.06, at: 0.42 }); },
  // the wings game
  flip()    { hiss({ freq: 3200, dur: 0.05, vol: 0.12, attack: 0.004 }); tone({ freq: 740, dur: 0.035, vol: 0.03 }); },
  match()   { notes([880, 1319], 0.07, { type: 'sine', dur: 0.16, vol: 0.11 }); },
  miss()    { notes([330, 262], 0.09, { type: 'triangle', dur: 0.14, vol: 0.08 }); },
  // the cutscenes (they play these by name, at moments set in their shots)
  door()    { tone({ freq: 140, to: 210, dur: 0.5, type: 'sawtooth', vol: 0.03, vib: [9, 6] }); hiss({ freq: 700, to: 400, q: 2, dur: 0.45, vol: 0.06, attack: 0.1 }); },
  pop()     { tone({ freq: 500, to: 1200, dur: 0.08, type: 'sine', vol: 0.16 }); notes([1568, 2093], 0.05, { type: 'sine', dur: 0.12, vol: 0.05, at: 0.06 }); },
  sprout()  { tone({ freq: 600, to: 1000, dur: 0.06, type: 'sine', vol: 0.07 }); },
  hug()     { notes([659, 880, 1047], 0.09, { type: 'sine', dur: 0.28, vol: 0.09 }); },
};

setMuted(music.muted);
music.quickFade = false; // (that was just the saved setting, not a toggle)
['pointerdown', 'keydown'].forEach(type => window.addEventListener(type, () => { startMusic(); ensureSound(); }, { capture: true }));
// the click sounds as the sound goes off, or once it's back on
muteButtonEl.addEventListener('click', e => {
  e.stopPropagation();
  startMusic();
  if (!music.muted) sfx.click();
  setMuted(!music.muted);
  if (!music.muted) sfx.click();
  muteButtonEl.blur();
});
window.addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) setMuted(!music.muted); });
document.addEventListener('visibilitychange', () => {
  if (!music.started) return;
  for (const song of Object.values(songs)) {
    if (!song.playing) continue;
    song.tracks.forEach((t, i) => {
      if (!t) return;
      if (document.hidden) t.pause();
      else if (!paused && (song.fades[i] > 0 || i === song.current)) t.play().catch(() => {});
    });
  }
});

/* PAUSE — P stops the game where it is, in the gardens, a conversation, a
   minigame or a cutscene: nothing moves, the music and effects hold, and a
   card says how to carry on. P again (or a click on the card) picks it all
   back up. The title and try-again screens are waiting already, so P does
   nothing there. */
const pauseEl = document.getElementById('pauseOverlay');
let paused = false;
let pausedCutscene = false; // a cutscene was playing when paused, so it resumes too
function setPaused(p) {
  if (p === paused) return;
  if (p && ![STATE.PLAYING, STATE.DIALOGUE, STATE.MINIGAME, STATE.CUTSCENE].includes(gameState)) return;
  paused = p;
  pauseEl.hidden = !p;
  for (const k in keys) keys[k] = false; // so she doesn't keep running after a resume
  for (const k in justPressed) justPressed[k] = false;
  const scene = gameState === STATE.CUTSCENE ? window.__animatic : null;
  if (p) { pausedCutscene = !!(scene && scene.playing); if (pausedCutscene) scene.setPlaying(false); }
  else if (pausedCutscene && scene) { scene.setPlaying(true); pausedCutscene = false; }
  for (const song of Object.values(songs)) {
    if (!song.playing) continue;
    song.tracks.forEach((t, i) => {
      if (!t) return;
      if (p) t.pause();
      else if (song.fades[i] > 0 || i === song.current) t.play().catch(() => {});
    });
  }
  if (sound.ctx) (p ? sound.ctx.suspend() : sound.ctx.resume()).catch(() => {});
  if (!p) lastTime = performance.now(); // no jump for the time spent paused
}
window.addEventListener('keydown', e => {
  if (e.code === 'KeyP' && !e.repeat) { e.preventDefault(); setPaused(!paused); }
}, true);
pauseEl.addEventListener('click', () => setPaused(false));

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 1 / 30);

  if (!paused) {
    elapsed += dt;
    update(dt);
  }
  render();
  updateCanvasCursor();
  if (!paused) updateMusic(dt);
  updateTitlePetals(dt);

  for (const k in justPressed) justPressed[k] = false;

  requestAnimationFrame(loop);
}

buildWorld();
gameState = STATE.TITLE; // world is ready, but the title screen comes first
showTitleScreen();
requestAnimationFrame(loop);
</script>
