<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ladybug's Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Custom typefaces, provided by the user: Pixelta (pixel serif) for all
     text — headings, titles, buttons and body. Pixelta has no straight or
     curly quotes, dashes, arrows or ×, so Venice Classic (bitmap-style
     serif) is next in every stack to fill those in with matching pixel
     glyphs; JetBrains Mono catches the rest. Pixelta is personal-use-only
     per its included license — fine for this hobby project, but flag
     before any commercial use. */
  @font-face {
    font-family: 'Pixelta';
    src: url('assets/fonts/Pixelta.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Venice Classic';
    src: url('assets/fonts/VeniceClassic.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    /* the bars around the game when the window isn't 16:9 — the same deep
       navy the game's shades and outlines use, in light and dark mode alike */
    --letterbox: #0e0c17;
  }

  /* Full-window: the game scales to the largest 16:9 size that fits, centred,
     with plain dark bars filling whatever the window has left over. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--letterbox);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Pixelta, 'Venice Classic', 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    letter-spacing: 0.1em;
  }
  #canvasStage {
    position: relative;
    width: min(100vw, calc(100vh * 800 / 450));
    aspect-ratio: 800 / 450;
    overflow: hidden;
    background: #cdeeff;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* The game's own pixel cursor (assets/ui: the 7x10 arrow art in cursor-art.png, drawn at 2x as a
     14x20 arrow, with a 2x copy of that for sharp screens; tip
     at the top-left): a cream arrow everywhere, turning lime over anything
     clickable — the title menu, and in the canvas the restart button, the
     lantern swatches and the memory cards (canvas.is-clickable, set on
     mousemove by updateCanvasCursor). The system cursors are the fallback. */
  html, body, #canvasStage, canvas, #titleScreen {
    cursor: url('assets/ui/cursor.png') 0 0, default; cursor: -webkit-image-set(url('assets/ui/cursor.png') 1x, url('assets/ui/cursor@2x.png') 2x) 0 0, default; cursor: image-set(url('assets/ui/cursor.png') 1x, url('assets/ui/cursor@2x.png') 2x) 0 0, default;
  }
  canvas.is-clickable, .title-hotspot, #muteButton, #cutscene .end-button {
    cursor: url('assets/ui/cursor-hover.png') 0 0, pointer; cursor: -webkit-image-set(url('assets/ui/cursor-hover.png') 1x, url('assets/ui/cursor-hover@2x.png') 2x) 0 0, pointer; cursor: image-set(url('assets/ui/cursor-hover.png') 1x, url('assets/ui/cursor-hover@2x.png') 2x) 0 0, pointer;
  }

  /* The music's mute button: top right, mirroring the clover counter at top
     left (same panel colour, navy pixel speaker), sized with the stage
     (28 art px square, 8 in from the corner). M does the same. */
  #muteButton {
    position: absolute;
    right: 1%;
    top: 1.78%;
    width: 3.5%;
    height: 6.22%;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: rgba(162, 220, 235, 0.26);
    color: #080b3c;
    display: grid;
    place-items: center;
  }
  #muteButton:hover, #muteButton:focus-visible { background: rgba(162, 220, 235, 0.45); outline: none; }
  #muteButton svg { width: 72%; height: 72%; fill: currentColor; shape-rendering: crispEdges; }
  #muteButton .sound-off, #muteButton.is-muted .sound-on { display: none; }
  #muteButton.is-muted .sound-off { display: inline; }

  /* The cutscenes (cutscenes/intro.js, outro.js: the animatics) play over the
     whole window, fading in and out (see playCutscene). Each brings the
     animatic's own markup; only its picture and skip button are shown. The
     skip button is placed and sized as in the animatics (100cqw = 800 art px). */
  #cutscene {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: #000;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #cutscene.is-shown { opacity: 1; }
  #cutscene header, #cutscene .transport, #cutscene .scrub, #cutscene .notes { display: none; }
  #cutscene .stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; container-type: inline-size; background: #000; }
  #cutscene canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #cutscene .skip { position: absolute; left: 85.04%; top: 87.02%; width: 13.28%; height: 7.97%; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; font: 3cqw 'Pixelta', 'Venice Classic', Georgia, serif; letter-spacing: normal; color: #f6ff00; background: rgba(171, 35, 48, 0.53); border: 0; border-radius: 0; cursor: pointer; transition: opacity .25s, background .15s; }
  #cutscene .skip:hover, #cutscene .skip:focus-visible { background: rgba(171, 35, 48, 0.8); outline: none; }
  #cutscene .skip.is-blue { background: rgba(67, 78, 168, 0.6); }
  #cutscene .skip.is-blue:hover, #cutscene .skip.is-blue:focus-visible { background: rgba(67, 78, 168, 0.85); }
  #cutscene .skip[hidden] { display: flex; opacity: 0; pointer-events: none; }
  /* the ending's "[ play again ]", under "The End": styled like the try-again
     screens' button (cream-tinted box, lime text, lime glow under the mouse),
     sized with the stage (188.6x29.7 art px, 16px text) */
  #cutscene .end-button {
    position: absolute; left: 38.2%; top: 68%; width: 23.6%; height: 6.6%;
    display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
    font: 2cqw 'Venice Classic', Pixelta, Georgia, serif; letter-spacing: normal;
    color: #d9ff00; background: rgba(255, 243, 214, 0.14); border: 0; border-radius: 0; outline: none;
    opacity: 0; transition: opacity 0.8s ease, background 0.15s;
  }
  #cutscene .end-button.is-shown { opacity: 1; }
  #cutscene .end-button:hover, #cutscene .end-button:focus-visible { color: #f4ffb0; background: rgba(217, 255, 0, 0.24); box-shadow: inset 0 0 0 0.19cqw #d9ff00; }

  /* The pause card (P): over everything, cutscenes included, the game
     dimmed behind it in the letterbox navy. A click on it resumes too. */
  #pauseOverlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin;
    background: rgba(14, 12, 23, 0.72);
  }
  #pauseOverlay[hidden] { display: none; }
  #pauseOverlay p { margin: 0; letter-spacing: normal; }
  #pauseOverlay .pause-title { font: min(7vw, 12.4vh) Pixelta, 'Venice Classic', Georgia, serif; color: #d9ff00; }
  #pauseOverlay .pause-hint { font: min(2.2vw, 3.9vh) Pixelta, 'Venice Classic', Georgia, serif; color: #fff3d6; }

  /* =======================================================================
     TITLE SCREEN — the reference artwork exported from Figma as separate
     layers (background, edge gradients, logo, menu text, creature), stacked
     back into the same composition so each piece can move independently:
     a slow Ken Burns drift + subtle mouse parallax on the background, a
     soft breathing glow on the logo, and a drop-shadow glow + lean on
     whichever menu line is selected (hugging its actual glyphs, not a
     generic box). The creature stays perfectly still by design — no bob,
     no parallax. The three menu-text layers are also parallax-free so they
     never drift out of alignment with their invisible hit-target buttons.
     ======================================================================= */
  #titleScreen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  #titleScreen[hidden] { display: none; }
  #titleScreen.is-leaving { opacity: 0; pointer-events: none; }

  .title-layers { position: absolute; inset: 0; }

  .title-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* the gardens' falling petals, drifting over the backdrop (under the edge
     shading, the logo, the ladybug and the menu); see TITLE PETALS */
  #titlePetals { image-rendering: pixelated; }

  .title-layer-bg {
    animation: titleBgDrift 18s ease-in-out infinite alternate;
    transform-origin: center center;
  }
  @keyframes titleBgDrift {
    0%   { transform: scale(1) translate3d(0, 0, 0); }
    50%  { transform: scale(1.07) translate3d(-1.1%, -0.7%, 0); }
    100% { transform: scale(1.03) translate3d(0.6%, 0.4%, 0); }
  }

  .title-parallax {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: transform 0.25s ease-out;
  }

  .title-logo {
    animation: titleLogoFloat 5s ease-in-out infinite;
  }
  @keyframes titleLogoFloat {
    0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 6px rgba(216, 255, 60, 0.35)); }
    50%      { transform: translateY(-3px); filter: drop-shadow(0 0 15px rgba(216, 255, 60, 0.55)); }
  }

  /* The player's bug, intentionally static — no animation, no parallax. It
     reuses the in-game sprite's standing frame instead of a baked 800x450
     layer, placed where the Figma export's bug sat: 1.6x scale (64px ->
     102.4 of the 800x450 frame), flipped to face left, feet on the old
     bug's baseline. Percentages keep it locked to the artwork at any size. */
  .title-creature {
    position: absolute;
    left: 79.775%;   /* 638.2 / 800 */
    top: 65.378%;    /* 294.2 / 450 */
    width: 12.8%;    /* 102.4 / 800 */
    height: 22.756%; /* 102.4 / 450 */
    transform: scaleX(-1);
    image-rendering: pixelated;
    pointer-events: none;
  }

  /* Each menu item has two stacked layers: the quiet bracketless words
     (-idle, muted sage) shown normally, and the yellow bracketed version
     that only fades in — with its glow — while hovered or keyboard-selected. */
  .title-menu-idle {
    transition: opacity 0.18s ease;
  }
  .title-menu-idle.is-selected { opacity: 0; }
  .title-menu-idle.is-disabled { opacity: 0.35; }
  .title-menu-text {
    opacity: 0;
    transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease;
    transform-origin: left center;
  }
  .title-menu-text.is-selected {
    opacity: 1;
    transform: translateX(4px) scale(1.035);
    filter: drop-shadow(0 0 10px rgba(216, 255, 60, 0.65)) drop-shadow(0 0 3px rgba(216, 255, 60, 0.9));
  }

  .title-hotspot {
    all: unset;
    position: absolute;
    cursor: url('assets/ui/cursor-hover.png') 0 0, pointer; cursor: -webkit-image-set(url('assets/ui/cursor-hover.png') 1x, url('assets/ui/cursor-hover@2x.png') 2x) 0 0, pointer; cursor: image-set(url('assets/ui/cursor-hover.png') 1x, url('assets/ui/cursor-hover@2x.png') 2x) 0 0, pointer;
    box-sizing: border-box;
  }
  .title-hotspot.is-disabled { cursor: url('assets/ui/cursor.png') 0 0, default; cursor: -webkit-image-set(url('assets/ui/cursor.png') 1x, url('assets/ui/cursor@2x.png') 2x) 0 0, default; cursor: image-set(url('assets/ui/cursor.png') 1x, url('assets/ui/cursor@2x.png') 2x) 0 0, default; }
  .title-hotspot:focus-visible {
    outline: 2px solid rgba(216, 255, 60, 0.8);
    outline-offset: 2px;
    border-radius: 4px;
  }

</style>
</head>
<body>
  <div id="canvasStage">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="titleScreen">
      <div class="title-layers">
        <div class="title-parallax" data-depth="4">
          <img class="title-layer title-layer-bg" src="assets/title/1-bg.png" alt="Where the Flowers Grow">
        </div>
        <canvas class="title-layer" id="titlePetals" aria-hidden="true"></canvas>
        <img class="title-layer" src="assets/title/2-l-gradient.png" alt="">
        <img class="title-layer" src="assets/title/r-gradient.png" alt="">
        <img class="title-layer" src="assets/title/3-top-gradient.png" alt="">
        <img class="title-layer" src="assets/title/4-bottom-gradient.png" alt="">
        <div class="title-parallax" data-depth="10">
          <img class="title-layer title-logo" src="assets/title/logo.png" alt="">
        </div>
        <img class="title-creature" src="assets/player/ladybug-frame0.png" alt="">
        <img class="title-layer title-menu-idle" data-action="new" src="assets/title/5-new-game-idle.png" alt="">
        <img class="title-layer title-menu-idle" data-action="continue" src="assets/title/6-continue-idle.png" alt="">
        <img class="title-layer title-menu-text" data-action="new" src="assets/title/5-new-game.png" alt="">
        <img class="title-layer title-menu-text" data-action="continue" src="assets/title/6-continue.png" alt="">
      </div>

      <button class="title-hotspot" data-action="new" aria-label="New game" style="left:5.3%; top:72.5%; width:16.5%; height:5.4%;"></button>
      <button class="title-hotspot" data-action="continue" aria-label="Continue" style="left:5.3%; top:80%; width:14.5%; height:4.5%;"></button>
    </div>
    <button id="muteButton" type="button" aria-label="Mute sound (M)" title="Mute sound (M)">
      <svg viewBox="0 0 10 9" aria-hidden="true">
        <path d="M1 3h2v3H1zM3 2h1v5H3zM4 1h1v7H4z"/>
        <path class="sound-on" d="M6 3h1v3H6zM8 1h1v7H8z"/>
        <path class="sound-off" d="M6 3h1v1H6zM8 3h1v1H8zM7 4h1v1H7zM6 5h1v1H6zM8 5h1v1H8z"/>
      </svg>
    </button>
  </div>
  <div id="pauseOverlay" hidden>
    <p class="pause-title">Paused</p>
    <p class="pause-hint">Press P to keep playing</p>
  </div>

<script>
'use strict';

/* =========================================================================
   CANVAS SETUP
   ========================================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CW = 800; // the game's layout size — all drawing is in these units
const CH = 450;
ctx.imageSmoothingEnabled = false; // keep the forest pack's pixel art crisp when scaled up

// The canvas's real pixel buffer is sized to how big it actually shows on
// screen (times the display's pixel density), and every frame draws the
// 800x450 layout scaled up into it. Otherwise the browser stretches an
// 800x450 image to fit, which smears or jags text. Rechecked every frame so
// window resizes and browser zoom stay sharp too.
let renderScale = 1;
function fitCanvasToDisplay() {
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(rect.width * dpr);
  const h = Math.round(rect.height * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    // resizing a canvas wipes its drawing state, so restore the settings
    // this game relies on
    ctx.imageSmoothingEnabled = false;
    ctx.letterSpacing = TEXT_LETTER_SPACING;
  }
  renderScale = w / CW;
}

// Canvas text can't use CSS variables, so the two custom typefaces (see the
// @font-face rules in <style>) get their own font-stack constants. Both are
// Pixelta now; Venice Classic fills in the characters Pixelta lacks
// (apostrophes, quotes, dashes). Kept as two names so headings and body
// can still diverge later.
const FONT_HEADING = "Pixelta, 'Venice Classic', 'JetBrains Mono', monospace";
const FONT_BODY = "Pixelta, 'Venice Classic', 'JetBrains Mono', monospace";
// Browsers only fetch a web font once something actually uses it, and no
// page text uses these any more (it's all canvas now) — so each one used to
// download on its first canvas draw, showing the fallback font for a moment
// (e.g. the first game-over title). Start both downloads up front instead.
document.fonts.load("16px Pixelta");
document.fonts.load("16px 'Venice Classic'");
// Both typefaces run their letters together at these small sizes; spacing
// them out is what makes the canvas text legible. Set once — it's part of the
// context's persistent drawing state (re-applied by fitCanvasToDisplay after
// a resize), and measureText() (used by wrapText) accounts for it. Browsers
// without canvas letterSpacing just ignore it.
const TEXT_LETTER_SPACING = '1.5px';
ctx.letterSpacing = TEXT_LETTER_SPACING;

/* =========================================================================
   PARALLAX BACKGROUND — one three-layer set per garden (Daylight, Dreamy,
   Mossy; each zone's LEVELS entry names its set). Each layer scrolls at a
   different fraction of camera speed: an opaque sky with clouds, then two
   nearer silhouette treelines. Source tiles are 402x251; drawn
   bottom-anchored, scaled to fill the canvas height, and tiled sideways.
   Across each zone border the two neighboring sets crossfade layer by
   layer, over the same window (and at the same x) the palette blends —
   so the backdrop and the color wash shift together as one gradient.
   ========================================================================= */
function loadBackgroundSet(name, middleFile = `${name}-middle`) {
  const src = file => `assets/background/parallax-${file.toLowerCase()}.png`;
  return {
    back:   Object.assign(new Image(), { src: src(`${name}-back`) }),
    middle: Object.assign(new Image(), { src: src(middleFile) }),
    front:  Object.assign(new Image(), { src: src(`${name}-front`) }),
  };
}
const BACKGROUND_SETS = {
  daylight: loadBackgroundSet('Daylight'),
  dreamy:   loadBackgroundSet('Dreamy'),
  mossy:    loadBackgroundSet('Mossy', 'Mossy-midle'), // filename is spelled "midle" on disk
};
// [layer, scroll factor, drift px/s] — the sky layer drifts on its own so the
// clouds keep moving even while the player stands still
const BACKGROUND_LAYERS = [['back', 0.15, 4], ['middle', 0.35, 0], ['front', 0.55, 0]];

// Two things drew a faint vertical line wherever two tiles met:
// - the exported tiles' outermost pixel columns are only partly opaque (an
//   anti-aliasing leftover from the export), so each tile is drawn from its
//   inner columns only;
// - tiles met at fractional screen pixels, so the joining pixel was half
//   covered by each tile and the sky showed through — so every tile edge is
//   snapped to a whole screen pixel, making neighbours meet exactly.
const BACKGROUND_EDGE_CROP = 2; // 2, not 1: when scaled, the last drawn column can still sample its outer neighbour

function drawBackgroundLayer(img, scrollFactor, alpha, drift = 0) {
  if (!img.complete || img.naturalWidth === 0 || alpha <= 0) return;
  const srcX = BACKGROUND_EDGE_CROP;
  const srcW = img.naturalWidth - 2 * BACKGROUND_EDGE_CROP;
  const tileH = CH;
  const tileW = srcW * (CH / img.naturalHeight);
  const snap = v => Math.round(v * renderScale) / renderScale;
  let m = (cameraX * scrollFactor + elapsed * drift) % tileW;
  if (m < 0) m += tileW;
  ctx.globalAlpha = alpha;
  for (let x = -m; x < CW; x += tileW) {
    const left = snap(x), right = snap(x + tileW);
    ctx.drawImage(img, srcX, 0, srcW, img.naturalHeight, left, 0, right - left, tileH);
  }
  ctx.globalAlpha = 1;
}

// Screen-space (not inside the camera-translated block) — each layer computes
// its own scroll offset from cameraX directly, which is what makes the
// layers drift past each other instead of moving together. Blended at the
// player's x, same as paletteAt(), so both shift in step.
function drawBackground() {
  const blend = zoneBlendAt(player.x);
  const from = BACKGROUND_SETS[LEVELS[blend.from].backgroundSet];
  const to = BACKGROUND_SETS[LEVELS[blend.to].backgroundSet];
  for (const [layer, scroll, drift] of BACKGROUND_LAYERS) {
    drawBackgroundLayer(from[layer], scroll, 1, drift);
    if (to !== from) drawBackgroundLayer(to[layer], scroll, blend.t, drift);
  }
}

/* =========================================================================
   PLAYER SPRITE — hand-drawn ladybug art replacing the box+dot placeholder.
   Drawn larger than the 22x22 hitbox (matches how the NPC creatures are
   already drawn bigger than their collision boxes) for readability.
   ========================================================================= */
// canvas drawImage() only ever samples an <img>'s first frame — browsers
// don't advance GIF animation for images drawn onto a canvas. So both
// animations are driven by hand from frames extracted to separate PNGs:
// - walk (2 frames) plays only while walking on the ground, advancing by
//   distance walked (not time), so the legs keep pace with the actual speed
//   and never tread in place or slide;
// - idle (2 frames, a blink at the GIF's own 1s per frame) plays whenever
//   it isn't walking — standing, or in the air — and in its dialogue
//   portrait. Its first frame is the walk cycle's standing pose, so the two
//   hand off without a jump.
const playerFrames = [
  Object.assign(new Image(), { src: 'assets/player/ladybug-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/player/ladybug-frame1.png' }),
];
const playerIdleFrames = [
  Object.assign(new Image(), { src: 'assets/player/ladybug-idle0.png' }),
  Object.assign(new Image(), { src: 'assets/player/ladybug-idle1.png' }),
];
const PLAYER_IDLE_FRAME_MS = 1000;

function currentPlayerIdleSprite() {
  return playerIdleFrames[Math.floor(performance.now() / PLAYER_IDLE_FRAME_MS) % playerIdleFrames.length];
}
const PLAYER_STEP_PX = 28;          // px walked per walk-cycle frame
const PLAYER_WALK_MIN_SPEED = 20;   // below this |vx| (friction coasting to a stop) counts as standing
const PLAYER_SPRITE_SIZE = 64; // matches the source art's native resolution 1:1
// The art's legs end 4px lower than the old legless sprite's body did; lift it
// so the feet land where that body used to, instead of sinking into the grass.
const PLAYER_SPRITE_Y_OFFSET = -4;

// Wing colors sampled directly from ladybug-frame0.png's own shell shading
// (darker blue-violet base -> pale cyan highlight), so the wings read as
// part of the same bug rather than a generic translucent shape.
const PLAYER_WING_OUTER = 'rgba(67,78,168,0.62)';
const PLAYER_WING_INNER = 'rgba(162,220,235,0.55)';

// One wing, drawn in the bug's local space (already translated/rotated/
// flipped by the caller). side: -1 = left, +1 = right. `foreshorten` scales
// the wing thin at the top/bottom of each beat and full-width at the
// middle, the classic 2D flutter trick for selling a fast wingbeat.
function drawPlayerWing(side, flap, foreshorten) {
  const angle = side < 0 ? (-0.4 + flap) : (0.4 - flap);
  ctx.save();
  ctx.translate(side * 7, -5);
  ctx.rotate(angle);
  ctx.scale(foreshorten, 1);
  ctx.fillStyle = PLAYER_WING_OUTER;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = PLAYER_WING_INNER;
  ctx.beginPath();
  ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayerSprite() {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const walking = player.onGround && Math.abs(player.vx) > PLAYER_WALK_MIN_SPEED;
  const sprite = walking
    ? playerFrames[Math.floor(player.walkDistance / PLAYER_STEP_PX) % playerFrames.length]
    : currentPlayerIdleSprite();
  const airborne = !player.onGround;
  // Wings peek out from under the shell and flap only while airborne; a
  // slight body tilt sells the glide the same way the floatier fall physics
  // do (see FALL_GRAVITY above). wingCycle drives both the flap rotation and
  // the foreshortening scale together so they read as one wingbeat.
  const wingCycle = performance.now() / 70;
  const flap = airborne ? Math.sin(wingCycle) * 0.4 : 0;
  const foreshorten = airborne ? 0.55 + 0.45 * Math.abs(Math.cos(wingCycle)) : 1;
  const tilt = airborne ? Math.sin(performance.now() / 140) * 0.14 : 0;

  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.save();
    // flicker during the post-respawn grace period, the usual "can't be hit
    // right now" signal
    if (player.graceTimer > 0 && Math.floor(performance.now() / 100) % 2 === 0) ctx.globalAlpha = 0.3;
    ctx.translate(cx, cy + PLAYER_SPRITE_Y_OFFSET);
    ctx.scale(player.facing, 1);
    ctx.rotate(tilt);

    if (airborne) {
      drawPlayerWing(-1, flap, foreshorten);
      drawPlayerWing(1, flap, foreshorten);
    }

    ctx.drawImage(sprite, -PLAYER_SPRITE_SIZE / 2, -PLAYER_SPRITE_SIZE / 2, PLAYER_SPRITE_SIZE, PLAYER_SPRITE_SIZE);
    ctx.restore();
  } else {
    // fallback while the sprite loads (or if it fails to load)
    ctx.fillStyle = THEME.player.body;
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }
}

/* =========================================================================
   HERMIT SNAIL SPRITE — same deal as the player: a 2-frame blink (antenna
   twitch) extracted from the source GIF and hand-alternated, since canvas
   drawImage() never animates GIFs on its own.
   ========================================================================= */
const snailFrames = [
  Object.assign(new Image(), { src: 'assets/npcs/hermit-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/npcs/hermit-frame1.png' }),
];
const SNAIL_BLINK_FRAME_MS = 1000;
const SNAIL_SPRITE_SIZE = 64; // matches the source art's native resolution 1:1

function currentSnailSprite() {
  const frameIndex = Math.floor(performance.now() / SNAIL_BLINK_FRAME_MS) % snailFrames.length;
  return snailFrames[frameIndex];
}

/* =========================================================================
   QUEEN BUMBLEBEE SPRITE — a 2-frame blink, same approach as above,
   extracted from a 512x512 GIF down to the 64x64 pixel grid it was drawn
   on so she matches the scale of the ladybug and snail. Her wings are part
   of the art, so none are drawn procedurally. She faces left, toward the
   player's approach, so she's never flipped.
   ========================================================================= */
const beeFrames = [
  Object.assign(new Image(), { src: 'assets/npcs/queen-bee-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/npcs/queen-bee-frame1.png' }),
];
const BEE_BLINK_FRAME_MS = 500; // the source GIF's per-frame delay
const BEE_SPRITE_SIZE = 64;

/* =========================================================================
   WANDERING BUTTERFLY SPRITE — a 2-frame wing flap, extracted the same way
   as the bee (512x512 GIF down to its 64x64 pixel grid), played at the
   GIF's own 0.5s per frame. Faces left, toward the player's approach.
   ========================================================================= */
const butterflyFrames = [
  Object.assign(new Image(), { src: 'assets/npcs/butterfly-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/npcs/butterfly-frame1.png' }),
];
const BUTTERFLY_FRAME_MS = 500;
const BUTTERFLY_SPRITE_SIZE = 64;

function currentButterflySprite() {
  const frameIndex = Math.floor(performance.now() / BUTTERFLY_FRAME_MS) % butterflyFrames.length;
  return butterflyFrames[frameIndex];
}

/* =========================================================================
   LOVEBUG (PARTNER) SPRITE — a 3-frame idle (a little shuffle and blink),
   extracted like the others and looped at the GIF's own 1s per frame. The
   art faces right; it's flipped to face left, toward the player arriving.
   Same 64px art and footprint as the player's sprite, so it's placed the
   same way.
   ========================================================================= */
const partnerFrames = [
  Object.assign(new Image(), { src: 'assets/npcs/partner-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/npcs/partner-frame1.png' }),
  Object.assign(new Image(), { src: 'assets/npcs/partner-frame2.png' }),
];
const PARTNER_FRAME_MS = 1000;

function currentPartnerSprite() {
  const frameIndex = Math.floor(performance.now() / PARTNER_FRAME_MS) % partnerFrames.length;
  return partnerFrames[frameIndex];
}

/* =========================================================================
   LUCKY CLOVER SPRITE — a 2-frame bob (the second frame sits 1px higher),
   extracted like the others to its 64x64 grid (the clover itself is the
   middle 32x32) and drawn 1:1 at the GIF's own 0.33s per frame. Each world
   clover is offset in time by its x so neighbours don't bob in lockstep.
   ========================================================================= */
const cloverFrames = [
  Object.assign(new Image(), { src: 'assets/collectibles/clover-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/collectibles/clover-frame1.png' }),
];
const CLOVER_FRAME_MS = 330;
const CLOVER_SPRITE_SIZE = 64;
const CLOVER_PICKUP_R = 13; // half the pickup square — sized to the 32px leaves, not the old 18px dot

function drawClover(cx, cy, timeOffsetMs) {
  const sprite = cloverFrames[Math.floor((performance.now() + timeOffsetMs) / CLOVER_FRAME_MS) % cloverFrames.length];
  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.drawImage(sprite, cx - CLOVER_SPRITE_SIZE / 2, cy - CLOVER_SPRITE_SIZE / 2, CLOVER_SPRITE_SIZE, CLOVER_SPRITE_SIZE);
    return;
  }
  // fallback while the sprite loads (or if it fails to load)
  ctx.fillStyle = THEME.hud.cloverFill;
  ctx.beginPath();
  ctx.arc(cx, cy, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = THEME.hud.cloverStroke;
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* =========================================================================
   QUEST FLOWER SPRITE (the Queen's petals) — a 2-frame bob like the clover
   (second frame 1px higher), extracted to its 64x64 grid and drawn 1:1 at
   the GIF's 0.33s per frame. A flower's level-data point is the surface it
   stands on: the art's lowest row sits just into that surface's grass, and
   its pickup area covers the whole flower.
   ========================================================================= */
const flowerFrames = [
  Object.assign(new Image(), { src: 'assets/collectibles/flower-frame0.png' }),
  Object.assign(new Image(), { src: 'assets/collectibles/flower-frame1.png' }),
];
const FLOWER_FRAME_MS = 330;
const FLOWER_SPRITE_SIZE = 64;
const FLOWER_ART_BOTTOM = 59; // px from the sprite's top edge to just below the art's lowest row
const FLOWER_SINK = 2;        // how far the stem tucks into the grass
const FLOWER_PICKUP = { w: 40, h: 54 };

function flowerPickupBox(p) {
  return { x: p.x - FLOWER_PICKUP.w / 2, y: p.y - FLOWER_PICKUP.h, w: FLOWER_PICKUP.w, h: FLOWER_PICKUP.h };
}

// Drawn growing up from its base, so `scale` (the pop-in) raises it out of
// the ground instead of swelling from its middle.
function drawFlower(x, baseY, scale, timeOffsetMs) {
  const sprite = flowerFrames[Math.floor((performance.now() + timeOffsetMs) / FLOWER_FRAME_MS) % flowerFrames.length];
  if (!sprite.complete || sprite.naturalWidth === 0) return;
  ctx.save();
  ctx.translate(x, baseY + FLOWER_SINK);
  ctx.scale(scale, scale);
  ctx.drawImage(sprite, -FLOWER_SPRITE_SIZE / 2, -FLOWER_ART_BOTTOM, FLOWER_SPRITE_SIZE, FLOWER_SPRITE_SIZE);
  ctx.restore();
}

function currentBeeSprite() {
  const frameIndex = Math.floor(performance.now() / BEE_BLINK_FRAME_MS) % beeFrames.length;
  return beeFrames[frameIndex];
}

/* =========================================================================
   DECOR — purely cosmetic scenery, all hand-drawn for this game (the old
   tileset rocks and mounds are gone), scattered per zone via each LEVELS
   entry's buildDecor(). Static (no animation, no hitbox) — never touched by
   collision or interaction code, so a decor entry can never accidentally
   block or trigger anything.

   Every type is bottom-anchored to the world's GROUND_Y so it sits on the
   ground like a real object.
   ========================================================================= */
const decorSprites = {
  // hand-drawn 32x32 bushes (exported at 8x, sampled back down)
  bush:        Object.assign(new Image(), { src: 'assets/decor/bush.png' }),
  bushFlowers: Object.assign(new Image(), { src: 'assets/decor/bush-flowers.png' }),
};
/* Ground tiles — hand-drawn on a 32x32 grid (exported at 8x, sampled back
   down to 32x32 PNGs), drawn 1:1:
   - ground-top:  the grass row along the top, repeating sideways;
   - ground-fill: soil, repeating in every direction under the top row;
   - ground-edge: the right-hand end cap of the top row (mirrored for the
     left). Below a cap, the soil keeps the cap's tapered outline: it's the
     fill tile cut to the columns the cap's bottom row covers.
   Every non-drifter, non-gate platform uses them — full ground strips get
   the top row and soil down to their bottom (the last row cut off at the
   bottom of the screen). Thin stepping stones have their own art (see
   drawSteppingStone) and only fall back to the top row of tiles if it
   hasn't loaded. buildWorld snaps all their widths to whole tiles. Tile edges are snapped to
   whole screen pixels so neighbours meet exactly. */
const groundTiles = {
  top:  Object.assign(new Image(), { src: 'assets/decor/ground-top.png' }),
  fill: Object.assign(new Image(), { src: 'assets/decor/ground-fill.png' }),
  edge: Object.assign(new Image(), { src: 'assets/decor/ground-edge.png' }),
};
const GROUND_TILE = 32;
let groundCapFill = null; // the soil under a cap, made once the tiles have loaded

function groundTilesReady() {
  return Object.values(groundTiles).every(img => img.complete && img.naturalWidth > 0);
}

function usesGroundTexture(p) {
  return !p.isDrifter && !p.isGate && groundTilesReady();
}

function makeGroundCapFill() {
  const T = GROUND_TILE;
  const probe = document.createElement('canvas');
  probe.width = probe.height = T;
  const pg = probe.getContext('2d');
  pg.drawImage(groundTiles.edge, 0, 0);
  const c = document.createElement('canvas');
  c.width = c.height = T;
  const g = c.getContext('2d');
  g.drawImage(groundTiles.fill, 0, 0);
  // opened straight from disk, the browser won't let the art's pixels be
  // read: the soil then just stays a full square under the cap
  try {
    const bottomRow = pg.getImageData(0, T - 1, T, 1).data;
    for (let x = 0; x < T; x++) if (bottomRow[x * 4 + 3] < 128) g.clearRect(x, 0, 1, T);
  } catch (e) { /* keep the unmasked fill */ }
  return c;
}

// one tile (or the left part of one, `w` px), mirrored for the left end,
// with its edges snapped to whole screen pixels
function drawGroundTile(img, x, y, w, h, mirror) {
  const sx = v => Math.round((v - cameraX) * renderScale) / renderScale + cameraX;
  const sy = v => Math.round((v - cameraY) * renderScale) / renderScale + cameraY;
  const left = sx(x), right = sx(x + w), top = sy(y), bottom = sy(y + h);
  if (!mirror) {
    ctx.drawImage(img, 0, 0, w, h, left, top, right - left, bottom - top);
  } else {
    ctx.save();
    ctx.translate(right, top);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h, 0, 0, right - left, bottom - top);
    ctx.restore();
  }
}

/* Stepping stones (the thin floating platforms): one hand-drawn 64x32 chunk
   of turf with roots hanging off it (exported at 8x, sampled back down),
   scaled to each stone's width — 1.5x for the 96px stones, 2x for the 128px
   ones — with its grass surface (art row 2) on the platform top and the
   soil and roots hanging below. */
const steppingStoneImage = Object.assign(new Image(), { src: 'assets/decor/stepping-stone.png' });
const STEPPING_STONE_ART_W = 64, STEPPING_STONE_ART_H = 32, STEPPING_STONE_SURFACE_ROW = 2;

function isSteppingStone(p) {
  return p.h < GROUND_TILE && steppingStoneImage.complete && steppingStoneImage.naturalWidth > 0;
}

function drawSteppingStone(p) {
  const s = p.w / STEPPING_STONE_ART_W;
  const snap = (v, cam) => Math.round((v - cam) * renderScale) / renderScale + cam;
  const left = snap(p.x, cameraX), right = snap(p.x + p.w, cameraX);
  const top = snap(p.y - STEPPING_STONE_SURFACE_ROW * s, cameraY);
  ctx.drawImage(steppingStoneImage, left, top, right - left, STEPPING_STONE_ART_H * s);
}

function drawGroundSegment(p) {
  if (isSteppingStone(p)) { drawSteppingStone(p); return; }
  const T = GROUND_TILE;
  if (!groundCapFill) groundCapFill = makeGroundCapFill();
  const rows = p.h < T ? 1 : Math.ceil(p.h / T);
  const bottom = p.h < T ? p.y + T : p.y + p.h;
  for (let r = 0; r < rows; r++) {
    const y = p.y + r * T, h = Math.min(T, bottom - y);
    const capImg = r === 0 ? groundTiles.edge : groundCapFill;
    const midImg = r === 0 ? groundTiles.top : groundTiles.fill;
    // no rounded cap where the ground runs off either end of the world
    drawGroundTile(p.x <= 0 ? midImg : capImg, p.x, y, T, h, true);                              // left end
    for (let x = p.x + T; x < p.x + p.w - T; x += T) {
      drawGroundTile(midImg, x, y, Math.min(T, p.x + p.w - T - x), h, false);
    }
    drawGroundTile(p.x + p.w >= worldWidth ? midImg : capImg, p.x + p.w - T, y, T, h, false);    // right end
  }
}

// The clue marker art, all hand-drawn 32x32 (exported at 8x, sampled back
// down): a sealed envelope with a heart, the same envelope opened (shown
// while its clue is being read), and the letter left behind afterwards.
// `bottomRow` is each one's lowest drawn pixel row, so all three can stand
// on the same spot.
const CLUE_ART = {
  closed: { img: Object.assign(new Image(), { src: 'assets/decor/clue-marker.png' }), bottomRow: 22 },
  open:   { img: Object.assign(new Image(), { src: 'assets/decor/clue-marker-open.png' }), bottomRow: 22 },
  paper:  { img: Object.assign(new Image(), { src: 'assets/decor/clue-paper.png' }), bottomRow: 29 },
};
const CLUE_SCALE = 2; // out in the garden; the HUD icon is 1x
const CLUE_PAPER_ALPHA = 0.6; // the letter left behind is a little see-through, like a memory of the clue

// one piece of clue art, centred on cx with its lowest pixel row at bottomY
function drawClueArt(kind, cx, bottomY, alpha = 1, scale = CLUE_SCALE) {
  const { img, bottomRow } = CLUE_ART[kind];
  if (!img.complete || img.naturalWidth === 0) return;
  const size = 32 * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, Math.round(cx - size / 2), Math.round(bottomY - (bottomRow + 1) * scale), size, size);
  ctx.restore();
}

// A clue spot in the garden: the sealed envelope bobbing until it's
// inspected; it pops open while its lines play; once read, the letter is
// left behind, settling into place.
function drawClueSpot(s) {
  const cx = s.x + s.w / 2, bottom = s.y + s.h;
  if (s.collected) {
    const t = s.collectedAt === undefined ? 1 : Math.min(1, (elapsed - s.collectedAt) / 0.6);
    const settle = 1 - (1 - t) * (1 - t);
    drawClueArt('paper', cx, bottom - 12 * (1 - settle), CLUE_PAPER_ALPHA * settle);
  } else if (s.opened) {
    const pop = Math.sin(Math.PI * Math.min(1, (elapsed - s.openedAt) / 0.3));
    drawClueArt('open', cx, bottom - 6 * pop);
  } else {
    drawClueArt('closed', cx, bottom + Math.round(Math.sin(elapsed * 2 + s.x) * 2));
  }
}

// One post of the Queen's gate (drawn at 2x over each gate bar; see render).
// The vine climbing it sways: four frames, made from the art once it loads,
// in which each stretch of vine (between the post's bands, 34 rows apart)
// shifts a pixel left, back, right, back as one piece, so its shape holds,
// the lower stretch a beat behind the upper. Where the vine moves off, the
// post shows through (each column's own colour, from a bare row at its foot).
const gatePostSprite = Object.assign(new Image(), { src: 'assets/decor/gate-post.png' });
const GATE_VINE_COLOURS = ['26616b', '6aab7c', 'b5de89', 'e1a7c5'].map(h => parseInt(h, 16)); // its greens and the pink flower
const GATE_VINE_FRAME_MS = 230;
let gatePostFrames = null; // canvases, once made
gatePostSprite.addEventListener('load', () => {
  try {
    const w = gatePostSprite.naturalWidth, h = gatePostSprite.naturalHeight;
    const src = Object.assign(document.createElement('canvas'), { width: w, height: h }).getContext('2d');
    src.drawImage(gatePostSprite, 0, 0);
    const base = src.getImageData(0, 0, w, h).data;
    const rgb = (d, i) => (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    const isVine = i => base[i + 3] > 0 && GATE_VINE_COLOURS.includes(rgb(base, i));
    const plainRow = h - 3; // a row of bare post near the foot
    gatePostFrames = [0, 1, 2, 3].map(phase => {
      const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
      const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
      d.set(base);
      for (let y = 0; y < h; y++) {
        const dx = [0, 1, 0, -1][(phase + 4 - Math.floor(y / 34) % 4) % 4];
        if (!dx) continue;
        const vine = [];
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (isVine(i)) { vine.push([x, i]); for (let k = 0; k < 4; k++) d[i + k] = base[(plainRow * w + x) * 4 + k]; }
        }
        for (const [x, i] of vine) {
          const nx = Math.min(w - 2, Math.max(1, x + dx)), j = (y * w + nx) * 4; // kept inside the post's outline
          for (let k = 0; k < 4; k++) d[j + k] = base[i + k];
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    });
  } catch (e) { gatePostFrames = null; /* can't read the art's pixels here: the post stays still */ }
});

const DECOR_NATIVE_W = { bush: 32, bushFlowers: 32 }; // px, for the grounded-span check in buildWorld
// The bushes are drawn at a clean 3x (a bug's-eye view: bigger than the
// ladybug), and their art has 2 empty rows under it, so they're lowered by
// those plus a few px to sit down into the grass instead of on top of it.
const DECOR_STYLE = {
  bush:        { scale: 3, sink: 2 * 3 + 3 },
  bushFlowers: { scale: 3, sink: 2 * 3 + 3 },
};
const decorScale = type => DECOR_STYLE[type].scale;

function drawDecor() {
  for (const d of decor) {
    const sprite = decorSprites[d.type];
    if (!sprite.complete || sprite.naturalWidth === 0) continue;
    const s = decorScale(d.type), sink = DECOR_STYLE[d.type].sink;
    const w = sprite.naturalWidth * s;
    const h = sprite.naturalHeight * s;
    ctx.drawImage(sprite, Math.round(d.x - w / 2), GROUND_Y - h + sink, w, h);
  }
}

/* =========================================================================
   STATE MACHINE
   ========================================================================= */
const STATE = { TITLE: 'TITLE', PLAYING: 'PLAYING', DIALOGUE: 'DIALOGUE', MINIGAME: 'MINIGAME', GAME_OVER: 'GAME_OVER', CUTSCENE: 'CUTSCENE' };
let gameState = STATE.PLAYING;

/* =========================================================================
   INPUT HANDLING
   ========================================================================= */
const keys = {};       // currently held keys
const justPressed = {}; // edge-triggered this frame

// Matched against both e.code (physical position, e.g. "KeyA") and e.key
// (layout letter / named key, e.g. "a", "ArrowLeft") so input keeps working
// regardless of keyboard layout or how the event was generated.
const KEY_LEFT  = ['ArrowLeft', 'KeyA', 'a', 'A', 'Left'];
const KEY_RIGHT = ['ArrowRight', 'KeyD', 'd', 'D', 'Right'];
const KEY_JUMP  = ['ArrowUp', 'KeyW', 'w', 'W', 'Space', ' ', 'Up'];
const KEY_INTERACT = ['KeyE', 'e', 'E'];

function markKey(e, down) {
  if (e.code) keys[e.code] = down;
  if (e.key) keys[e.key] = down;
}

window.addEventListener('keydown', (e) => {
  const ids = [e.code, e.key].filter(Boolean);
  if (!ids.some(id => keys[id])) {
    for (const id of ids) justPressed[id] = true;
  }
  markKey(e, true);
  // prevent page scroll on arrows/space
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { markKey(e, false); });

function anyDown(codes) { return codes.some(c => keys[c]); }
function anyJustPressed(codes) { return codes.some(c => justPressed[c]); }

// a mouse event's position in the 800x450 layout
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return [(e.clientX - rect.left) * CW / rect.width, (e.clientY - rect.top) * CH / rect.height];
}
canvas.addEventListener('click', (e) => handleClick(...canvasPoint(e)));

// The cursor turns lime over whatever a click would do something to (the
// same hit tests handleClick uses) — see the cursor rules in <style>.
const inRect = (mx, my, r) => mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
function isClickableAt(mx, my) {
  if (gameState === STATE.MINIGAME && activeMinigame === 'cards') {
    if (!cards || cards.lockTimer > 0 || cards.winTimer > 0) return false;
    return cards.deck.some((_, i) => !cards.matched[i] && !cards.revealed[i] && inRect(mx, my, cardRect(i)));
  }
  if (gameState === STATE.MINIGAME && activeMinigame === 'lantern') {
    if (lantern.phase === 'intro') return lantern.phaseTimer <= 0; // a click anywhere starts it, once the card unlocks
    if (lantern.phase !== 'input') return false;                     // swatches only take presses when it's your turn
    return LANTERN_SWATCHES.some((_, i) => inRect(mx, my, LANTERN_LAYOUT.swatch(i)));
  }
  if (gameState === STATE.GAME_OVER) return inRect(mx, my, GAME_OVER_LAYOUT.button);
  return false;
}
let lastMouse = null; // so the cursor also updates when the screen changes under a still mouse
function updateCanvasCursor() {
  canvas.classList.toggle('is-clickable', !!lastMouse && isClickableAt(...lastMouse));
}
canvas.addEventListener('mousemove', (e) => { lastMouse = canvasPoint(e); updateCanvasCursor(); });
canvas.addEventListener('mouseleave', () => { lastMouse = null; updateCanvasCursor(); });

/* =========================================================================
   PHYSICS CONSTANTS
   ========================================================================= */
// Gravity is split so the jump still feels snappy on the way up but drifts
// down like a bug gliding on its wings on the way down — RISE_GRAVITY alone
// sets jump apex/hang time (unchanged from the old single GRAVITY value).
// FALL_GRAVITY/MAX_FALL_SPEED are the "subtle drift" tuning (chosen over the
// floatier 300/260 "full flutter-down" — that one made falls drag too long).
const RISE_GRAVITY = 1150;
const FALL_GRAVITY = 650;
const MOVE_ACCEL = 2200;
const MOVE_FRICTION = 2400;
const MAX_SPEED = 230;
const JUMP_VELOCITY = 600;
const MAX_FALL_SPEED = 500;
const COYOTE_TIME = 0.15;
const JUMP_BUFFER_TIME = 0.18;
// Max jump apex ~= JUMP_VELOCITY^2 / (2*RISE_GRAVITY) ≈ 156px — comfortably
// clears every vertical platform gap in the level data (worst case is 120px).
// Fall duration from that apex is longer now that FALL_GRAVITY < RISE_GRAVITY.

const GROUND_Y = 800;        // undergrowth floor (world space)
const LEVEL_HEIGHT = 900;    // world vertical extent — canopy near y:0, undergrowth near y:900

/* =========================================================================
   DESIGN TOKENS — every UI/creature/hazard color used outside the per-zone
   LEVELS palette data lives here. LEVELS.palette stays separate on purpose:
   it's each garden's *mood* (grief/hope/joy), which is meant to vary zone
   to zone, whereas THEME is the game's *visual language* (HUD chrome,
   dialogue boxes, creature colors, hazard colors) — the stuff that should
   look consistent everywhere and is what you'd actually restyle if you
   swapped the game's whole art direction. Colors that get an animated
   alpha at the call site (blinking prompts, pulsing glows) are stored as
   a bare "r,g,b" string so the call site can wrap it in its own rgba().
   ========================================================================= */
const THEME = {
  text: {
    primary: '#ffffff',
    dim: '#cfd6c4',
    onDark: '#f4f0e0',
    prompt: '#080b3c',          // prompts and hints (Figma "prompts and hints"), no outline
    promptOnDark: '#fffdf6',    // the same in the Gloomy Soil Bed, where navy would vanish
  },
  // dialogue box — colors taken from the dialogue mockup
  dialogue: {
    text: '#d9ff00',            // speaker name + line
    boxRGB: '42,38,66', boxAlpha: 0.55,
    shadeRGB: '42,38,65',       // the navy the screen edges darken to while someone's talking
  },
  hud: {

// A swooping-bird hazard over a ground clearing x..x+w (named for the shoe
// stomp it replaced), with a bush to hide in at each of `covers` (px from
// the clearing's left edge). swoopDir is picked when each swoop starts.
function makeStomp(x, w, covers) {
  return {
    x, w, covers, groundY: GROUND_Y,
    state: 'idle',
    timer: 0.6 + Math.random() * 0.8,
    // a shorter red-column warning than before: the slow, visible approach is now most of the build-up
    idleDur: 1.4, telegraphDur: 1.0, swoopDur: SWOOP_APPROACH_S + SWOOP_EXIT_S,
    swoopDir: 1,
    flap: 0,     // wing-frame clock, ticking faster the faster it flies
    pulse: 0,    // warning-column pulse phase, quickening as it closes in
    urgency: 0,  // 0..1 through the approach, for the warning's strength
  };
}

// The reunion conversation — declared before LEVELS since the partner NPC's
// introLines reference it directly inside that array literal, and the
// array is built immediately (not lazily), so this must exist textually
// above it or it hits the `const` temporal dead zone.
// The story: the lovebug went past the garden wall for rare berries (the
// ladybug's favorite), got lost, and never came back; the ladybug set out
// after them, gathering clovers (the lovebug's favorite) on the way. The
// reunion ends in that trade — berries for clovers.
const FINAL_REUNION_LINES_SRC = [
  { speaker: '???', text: '...you came.' },
  { speaker: 'You', text: "Of course I did. You said you'd be back by sundown." },
  { speaker: '???', text: "I know. I'm so sorry. The berries only grow down here, in the dark... and then I couldn't find my way back." },
  { speaker: 'You', text: 'You went all this way for berries?' },
  { speaker: '???', text: "They're your favorite. I wanted to surprise you." },
  { speaker: 'You', text: 'Well, you did. You scared me half to death, but you did.' },
  { speaker: '???', text: 'Here. I saved the ripest ones for you.' },
];

// Clovers are the lovebug's favorite — the ladybug gathers them on the way
// as her gift back. What she says when she hands them over depends on how
// many; then the two head home together.
function cloverGiftLines() {
  const n = cloverCount, total = clovers.length;
  const clv = n === 1 ? '1 clover' : `${n} clovers`;
  const goHome = [
    { speaker: '???', text: "Let's go home." },
    { speaker: 'You', text: 'Together, this time.' },
  ];
  if (n === 0) return [
    { speaker: 'You', text: "I meant to bring you clovers. I got so caught up looking for you, I forgot." },
    { speaker: '???', text: "You found me. That's better than any clover." },
    ...goHome,
  ];
  const gift = [{ speaker: 'You', text: 'I brought you something too.' }];
  if (n === total) return [
    ...gift,
    { speaker: 'You', text: `I picked every clover in the garden. All ${n} of them. For you.` },
    { speaker: '???', text: 'Every single one?' },
    { speaker: 'You', text: 'Every single one. Each one was a step closer to you.' },
    { speaker: '???', text: "...Then I'll keep them forever." },
    ...goHome,
  ];
  if (n >= total / 2) return [
    ...gift,
    { speaker: 'You', text: `I picked these along the way. ${clv}. Your favorite.` },
    { speaker: '???', text: 'You carried all of these across the garden?' },
    { speaker: 'You', text: 'Every one of them made me think of you.' },
    ...goHome,
  ];
  return [
    ...gift,
    { speaker: 'You', text: `I found these on the way. ${clv}. I know they're your favorite.` },
    { speaker: '???', text: "You were looking for me and still stopped to pick clovers? ...Thank you." },
    ...goHome,
  ];
}
